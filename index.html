<meta name="apple-mobile-web-app-title" content="셀 케어">

<style>
/* 레이아웃: 휴대폰 한 손 사용 기준 한 줄 카드 흐름, 넓은 화면에서도 가운데 640px 기둥 */
:root {
  /* 색: 교회 로고의 남색(#20365B)과 회청색(#4E6285)에 맞춤 */
  --bg: #F3F5F9;
  --card: #FFFFFF;
  --ink: #1A2436;
  --muted: #586378;
  --line: #D8DEE9;
  --accent: #20365B;
  --accent-mid: #4E6285;
  --accent-ink: #FFFFFF;
  --accent-soft: #E6EBF3;
  --focus: #8EA3C6;
  --warn: #9C5212;
  --warn-soft: #FBEEDF;
  --ok: #2B7150;
  --ok-soft: #E2F1E7;
  --danger: #A0372A;
  --danger-soft: #FBE7E3;
  --font-display: "Gowun Batang", "Noto Serif KR", serif;
  --font-body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg); color: var(--ink);
  font-family: var(--font-body); font-size: 17px; line-height: 1.6;
  -webkit-text-size-adjust: 100%;
  padding-bottom: calc(88px + env(safe-area-inset-bottom, 0px));
}
button, input, textarea, select { font: inherit; color: inherit; }
.wrap { max-width: 640px; margin: 0 auto; padding-inline: 16px; padding-block: 12px 24px; }
header.top {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
  background: var(--bg); border-bottom: 1px solid var(--line);
}
header.top .in { max-width: 640px; margin: 0 auto; padding: 10px 16px; display: flex; align-items: center; gap: 8px; min-height: 56px; }
header.top .title { font-weight: 600; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.brand { display: inline-flex; align-items: center; gap: 8px; font-family: var(--font-display); font-size: 19px; color: var(--accent); }
.brand img { width: 30px; height: 27px; display: block; }
.login-logo { display: block; width: 120px; height: auto; margin: 8px auto 4px; }
.iconbtn { border: 0; background: transparent; min-width: 44px; min-height: 44px; border-radius: 10px; cursor: pointer; font-size: 15px; color: var(--muted); padding: 0 8px; }
.iconbtn:hover { background: var(--accent-soft); color: var(--accent); }
h1 { font-family: var(--font-display); font-weight: 700; font-size: 26px; line-height: 1.35; margin: 12px 0 4px; text-wrap: balance; }
h2 { font-size: 18px; font-weight: 600; margin: 28px 0 10px; }
h3 { font-size: 17px; font-weight: 600; margin: 0 0 6px; }
.sub { color: var(--muted); margin: 0 0 8px; font-size: 15px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 18px; }
.stack { display: grid; gap: 12px; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.spacer { flex: 1; }
.muted { color: var(--muted); }
.small { font-size: 15px; }
.tiny { font-size: 13px; }
.num { font-variant-numeric: tabular-nums; }
.btn {
  display: flex; align-items: center; justify-content: center; gap: 8px;
  width: 100%; min-height: 54px; padding: 12px 18px; border-radius: 12px;
  border: 1px solid var(--accent); background: var(--accent); color: var(--accent-ink);
  font-weight: 600; font-size: 17px; cursor: pointer; text-align: center;
}
.btn.ghost { background: var(--card); color: var(--accent); }
.btn.quiet { background: transparent; border-color: var(--line); color: var(--ink); font-weight: 500; }
.btn.warn { background: var(--warn); border-color: var(--warn); }
.btn.sm { min-height: 44px; font-size: 15px; width: auto; padding: 8px 14px; }
.btn:disabled { opacity: .5; cursor: default; }
.btn:focus-visible, .seg button:focus-visible, .chip:focus-visible, .iconbtn:focus-visible, .link:focus-visible, .listitem:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
.link { background: none; border: 0; color: var(--accent); text-decoration: underline; cursor: pointer; padding: 8px 0; font-size: 15px; }
.pill { display: inline-flex; align-items: center; gap: 4px; padding: 2px 10px; border-radius: 999px; font-size: 14px; font-weight: 500; background: #EDF0F5; color: var(--muted); white-space: nowrap; }
.pill.warn { background: var(--warn-soft); color: var(--warn); }
.pill.ok { background: var(--ok-soft); color: var(--ok); }
.pill.danger { background: var(--danger-soft); color: var(--danger); }
.pill.accent { background: var(--accent-soft); color: var(--accent); }
.ibtn { display: inline-grid; place-items: center; width: 26px; height: 26px; border-radius: 50%; border: 1.5px solid var(--accent); color: var(--accent); background: #fff; font: italic 700 15px/1 Georgia, serif; vertical-align: 3px; margin-left: 8px; cursor: pointer; padding: 0; position: relative; }
.ibtn::after { content: ''; position: absolute; inset: -9px; }
.ibtn[aria-expanded="true"] { background: var(--accent); color: #fff; }
.ibox { background: var(--accent-soft); border-radius: 12px; padding: 12px 14px; margin: 6px 0 12px; font-size: .95em; line-height: 1.6; }
.ibox ul { margin: 4px 0 0; padding-left: 1.1em; }
.banner { border-radius: 12px; padding: 14px 16px; background: var(--accent-soft); color: var(--ink); }
.banner.warn { background: var(--warn-soft); }
.banner.danger { background: var(--danger-soft); }
.banner b { display: block; margin-bottom: 2px; }
label.field { display: grid; gap: 6px; font-weight: 500; }
input[type=text], input[type=search], input[type=email], input[type=date], input[type=time], textarea, select {
  width: 100%; min-height: 50px; padding: 12px 14px; border: 1px solid var(--line); border-radius: 12px; background: #fff;
}
textarea { min-height: 120px; resize: vertical; line-height: 1.6; }
input:focus, textarea:focus, select:focus { outline: 2px solid var(--focus); border-color: var(--accent); }
.seg { display: grid; grid-template-columns: repeat(var(--n, 2), 1fr); gap: 8px; }
.seg button { min-height: 50px; border-radius: 12px; border: 1px solid var(--line); background: #fff; cursor: pointer; font-weight: 500; padding: 6px 8px; }
.seg button[aria-pressed=true] { background: var(--accent); border-color: var(--accent); color: #fff; }
.seg.att button[aria-pressed=true][data-v=absent] { background: var(--warn); border-color: var(--warn); }
.seg.att button[aria-pressed=true][data-v=unknown] { background: #6A7385; border-color: #6A7385; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { min-height: 40px; padding: 6px 14px; border-radius: 999px; border: 1px solid var(--line); background: #fff; cursor: pointer; font-size: 15px; }
.chip[aria-pressed=true] { background: var(--accent); border-color: var(--accent); color: #fff; }
.check { display: flex; gap: 10px; align-items: flex-start; cursor: pointer; padding: 6px 0; }
.check input { width: 22px; height: 22px; margin-top: 2px; accent-color: var(--accent); flex: none; }
.steps { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; margin: 8px 0 18px; }
.steps div { text-align: center; font-size: 13px; color: var(--muted); padding-top: 8px; border-top: 4px solid var(--line); }
.steps div.done { border-color: #93A6C6; color: var(--ink); }
.steps div.now { border-color: var(--accent); color: var(--accent); font-weight: 600; }
.member { display: grid; gap: 8px; padding: 14px 0; border-bottom: 1px solid var(--line); }
.member:last-child { border-bottom: 0; }
.member .nm { font-weight: 600; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.footer-bar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 6;
  background: rgba(243,245,249,.97); border-top: 1px solid var(--line);
  padding: 10px 16px calc(10px + env(safe-area-inset-bottom, 0px));
}
.footer-bar .in { max-width: 640px; margin: 0 auto; display: grid; gap: 6px; }
.footer-bar .btns { display: grid; grid-template-columns: 1fr 2fr; gap: 10px; }
.savestate { font-size: 13px; color: var(--muted); text-align: center; min-height: 18px; }
nav.tabs {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 4; background: var(--accent);
  padding-bottom: env(safe-area-inset-bottom, 0px); box-shadow: 0 -4px 14px rgba(32,54,91,.18);
}
nav.tabs .in { max-width: 640px; margin: 0 auto; display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 6px; padding: 7px 8px; }

function addDays(iso, n) { const d = new Date(iso + 'T00:00:00Z'); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); }
function kstDate(ts) { return new Date(ts).toLocaleDateString('sv-SE', { timeZone: 'Asia/Seoul' }); }
function parts(iso) { return { y: +iso.slice(0, 4), m: +iso.slice(5, 7), d: +iso.slice(8, 10) }; }
function weekLabel(iso, withYear) { const p = parts(iso); if (EN()) return MONTHS[p.m - 1] + (withYear ? ' ' + p.y : '') + ', Week ' + Math.ceil(p.d / 7); return (withYear ? p.y + '년 ' : '') + p.m + '월 ' + Math.ceil(p.d / 7) + '주차'; }
function dayLabel(iso) { if (!iso) return ''; const p = parts(iso); const dw = new Date(iso + 'T00:00:00Z').getUTCDay(); if (EN()) return ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'][dw] + ', ' + MONTHS[p.m - 1] + ' ' + p.d; const w = '일월화수목금토'[dw]; return p.m + '월 ' + p.d + '일 (' + w + ')'; }
function dateTime(ts) {
  if (!ts) return '';
  const d = new Date(ts);
  return d.toLocaleString(EN() ? 'en-US' : 'ko-KR', { timeZone: 'Asia/Seoul', month: EN() ? 'short' : 'long', day: 'numeric', hour: 'numeric', minute: '2-digit' });
}
function toast(msg, ms = 2800) {
  const t = $('#toast'); t.textContent = msg; t.hidden = false;
  clearTimeout(toast.t); toast.t = setTimeout(() => { t.hidden = true; }, ms);
}
function errText(e) {
  const m = (e && (e.message || e.error_description || e.msg)) || String(e || '');
  if (/VERSION_CONFLICT/.test(m)) return '다른 셀리더가 방금 저장했습니다. 최신 내용을 불러와 주세요.';
  if (/Failed to fetch|NetworkError|Load failed/i.test(m)) return '인터넷 연결을 확인해 주세요.';
  if (/JWT|jwt expired|invalid claim/i.test(m)) return '로그인이 만료되었습니다. 다시 로그인해 주세요.';
  return m.replace(/^VERSION_CONFLICT:\s*/, '');
}
async function rpc(name, args) {

  const { data, error } = await sb.rpc(name, args || {});
  if (error) throw error;
  return data;
}

const S = { ctx: null, me: null, roles: [], tab: null, view: null, stack: [] };

function hasRole(r) { return S.roles.includes(r); }
function isSenior() { return hasRole('senior_pastor') || hasRole('samonim'); }
function availableTabs() {
  const t = [];
  if (S.ctx.leader_cells.length || S.ctx.my_open_reports.length) t.push({ id: 'leader', label: tr('셀리더', 'Cell Leader') });
  if (hasRole('leadership')) t.push({ id: 'leadership', label: S.me?.name || tr('교역자', 'Pastoral staff') });
  if (isSenior()) t.push({ id: 'senior', label: tr('전체 현황', 'Overview') });
  if (hasRole('leadership') || isSenior()) t.push({ id: 'notes', label: tr('성도 동정', 'Notes') });
  if (hasRole('admin')) t.push({ id: 'admin', label: tr('관리', 'Admin') });
  return t;
}
const TAB_HOME = { leader: { name: 'leaderHome' }, leadership: { name: 'leadershipHome' }, senior: { name: 'dashboard' }, admin: { name: 'adminHome' }, notes: { name: 'notesHome' } };

function go(view, opts = {}) {
  if (!opts.replace && S.view) S.stack.push(S.view);
  S.view = view;
  if (!opts.replace) history.pushState({ n: S.stack.length }, '');
  render();
  window.scrollTo(0, 0);
}
function back() {
  if (S.stack.length) { S.view = S.stack.pop(); render(); window.scrollTo(0, 0); }
  else { S.view = TAB_HOME[S.tab]; render(); }
}
window.addEventListener('popstate', () => { if (S.ctx && S.stack.length) { S.view = S.stack.pop(); render(); } });
function switchTab(id) { S.tab = id; S.stack = []; S.view = { ...TAB_HOME[id] }; render(); window.scrollTo(0, 0); }

function renderTabs(show) {
  const nav = $('#tabs');
  const tabs = S.ctx ? availableTabs() : [];
  if (!show || tabs.length < 2) { nav.hidden = true; document.body.style.paddingBottom = show === 'footer' ? '170px' : '24px'; if (show && tabs.length < 2) document.body.style.paddingBottom = '24px'; return; }
  nav.hidden = false; document.body.style.paddingBottom = '';
  nav.innerHTML = '<div class="in">' + tabs.map(t =>
    '<button data-act="tab" data-id="' + t.id + '"' + (S.tab === t.id ? ' aria-current="page"' : '') + '>' + (TAB_ICON[t.id] || '') + '<span>' + esc(t.label) + '</span></button>').join('') + '</div>';
}

async function render() {
  const v = S.view; const app = $('#app');
  // 보고서 작성 화면을 벗어나면 (뒤로가기 버튼·휴대폰 뒤로가기 포함) 아래 「이전/다음」 막대를 항상 닫음
  if (v.name !== 'report') { if (E) { try { await save(); } catch (_) {} E = null; } hideFooter(); }
  try {
    if (v.name === 'leaderHome') return await viewLeaderHome(app);
    if (v.name === 'report') return await viewReportEditor(app, v);
    if (v.name === 'leadershipHome') return await viewLeadershipHome(app, v);
    if (v.name === 'detail') return await viewReportDetail(app, v);
    if (v.name === 'dashboard') return await viewDashboard(app, v);
    if (v.name === 'group') return await viewGroup(app, v);
    if (v.name === 'adminHome') return await viewAdminHome(app);
    if (v.name === 'members') return await viewMembers(app, v);
    if (v.name === 'notesHome') return await viewNotesHome(app, v);
    if (v.name === 'noteEdit') return viewNoteEdit(app, v);
    if (v.name === 'lrEdit') return await viewLrEdit(app, v);
    if (v.name === 'lrRead') return await viewLrRead(app, v);
    if (v.name === 'issues') return await viewIssues(app, v);
    if (v.name === 'notices') return await viewNotices(app, v);
    if (v.name === 'messages') return await viewMessages(app, v);
    if (v.name === 'digest') return await viewDigest(app, v);
    if (v.name === 'msgNew') return await viewMsgNew(app, v);
    if (v.name === 'thread') return await viewThread(app, v);
  } catch (e) {
    console.error(e);
    setTop('', S.stack.length > 0); renderTabs(true);
    app.innerHTML = '<div class="banner danger" role="alert"><b>화면을 불러오지 못했습니다.</b>' + esc(errText(e)) +
      '</div><div style="margin-top:12px"><button class="btn ghost" data-act="reload">다시 시도</button></div>';
  }
}

/* 등록 신청 (로그인 전) — 명단에 미리 있는 이름과 맞춰 관리자가 승인 */
function viewRegister(app) {
  app.innerHTML = `
    <h1>셀 케어 등록 신청</h1>
    <p class="sub">셀리더·교역자로 섬기시는 분이 처음 한 번만 신청하시면 됩니다.</p>
    <div class="card stack" style="margin-top:16px">
      ${LOGIN.regDone ? `
        <div class="banner"><b>신청이 접수되었습니다</b>담당자가 확인한 뒤 승인해 드립니다. 승인되면 ${esc(LOGIN.email)} 주소로 로그인하실 수 있어요.</div>
        <p class="small muted" style="margin:0">이미 등록된 이메일이라면 바로 로그인하셔도 됩니다.</p>
        <button class="btn" data-act="reg-close">로그인 화면으로</button>
      ` : `
        <label class="field">이름
          <input id="reg-name" type="text" autocomplete="name" maxlength="40" placeholder="예) 홍길동" value="${esc(LOGIN.regName)}">
        </label>
        <label class="field">이메일
          <input id="reg-email" type="email" inputmode="email" autocomplete="email" maxlength="200" placeholder="자주 확인하시는 이메일" value="${esc(LOGIN.email)}">
        </label>
        <p class="tiny muted" style="margin:0">적어 주신 이름과 이메일은 셀 케어 로그인에만 쓰이고, 담당 관리자만 볼 수 있습니다.</p>
        <button class="btn" data-act="reg-send" ${LOGIN.busy ? 'disabled' : ''}>${LOGIN.busy ? '보내는 중…' : '신청하기'}</button>
        <button class="link" data-act="reg-close">로그인 화면으로 돌아가기</button>
      `}
      ${LOGIN.msg ? `<div class="banner warn" role="alert">${esc(LOGIN.msg)}</div>` : ''}
    </div>`;
}
async function sendRegister() {
  const name = ($('#reg-name')?.value || '').trim();
  const email = ($('#reg-email')?.value || '').trim().toLowerCase();
  LOGIN.regName = name; LOGIN.email = email; LOGIN.msg = '';
  if (name.length < 2) { LOGIN.msg = '이름을 적어 주세요.'; return viewLogin(); }
  if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) { LOGIN.msg = '이메일 주소를 다시 확인해 주세요.'; return viewLogin(); }
  LOGIN.busy = true; viewLogin();
  try { await rpc('request_access', { p_name: name, p_email: email }); LOGIN.regDone = true; fetch('api/notify-request', { method: 'POST' }).catch(() => {}); }
  catch (e) { LOGIN.msg = errText(e); }
  LOGIN.busy = false; viewLogin();
}
async function sendLogin() {
  const email = ($('#login-email')?.value || '').trim().toLowerCase();
  LOGIN.email = email; LOGIN.msg = '';
  if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) { LOGIN.msg = '이메일 주소를 다시 확인해 주세요.'; return viewLogin(); }
  LOGIN.busy = true; viewLogin();
  const { error } = await sb.auth.signInWithOtp({
    email, options: { shouldCreateUser: true, emailRedirectTo: location.origin + location.pathname }
  });
  LOGIN.busy = false;
  if (error) {
    const m = error.message || ''; const code = error.code || '';
    const report = (kind) => { sb.rpc('report_login_problem', { p_kind: kind, p_detail: m }).then(() => fetch('api/notify-request', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ alert: true }) })).catch(() => {}); };
    if (/sending|smtp|email.*(fail|error)/i.test(m)) report('mail');
    else if (/rate limit|email rate/i.test(m)) report('rate');
    if (/sending|smtp|email.*(fail|error)/i.test(m)) LOGIN.msg = '지금 로그인 메일을 보내는 데 문제가 있습니다. 승인과는 상관없는 일시적인 문제이니, 김도현 간사에게 알려 주시고 잠시 후 다시 시도해 주세요.';
    else if (code === 'unexpected_failure' || /Database error|NOT_APPROVED/i.test(m)) LOGIN.msg = '아직 승인되지 않은 이메일입니다. 아래 「등록 신청하기」로 먼저 신청해 주세요. 이미 신청하셨다면 승인 후 다시 시도해 주세요.';
    else if (code === 'signup_disabled' || /for this instance/i.test(m)) LOGIN.msg = '등록은 되어 있지만 아직 초대를 수락하지 않으셨어요. 받으신 초대 메일의 링크를 먼저 눌러 주세요. 메일이 없다면 담당 교역자에게 초대를 다시 요청해 주세요.';
    else if (code === 'otp_disabled' || /signup|not allowed|not found|Signups/i.test(m)) LOGIN.msg = '아직 등록되지 않은 이메일입니다. 담당 교역자에게 문의해 주세요.';
    else if (/rate|security purposes|seconds/i.test(m)) LOGIN.msg = '메일을 너무 자주 요청했습니다. 잠시 후 다시 시도해 주세요.';
    else LOGIN.msg = '메일을 보내지 못했습니다. 잠시 후 다시 시도해 주세요. (' + m + ')';
    return viewLogin();
  }
  LOGIN.sent = true; viewLogin();
}
async function verifyCode() {
  const token = ($('#login-code')?.value || '').replace(/\D/g, '');
  if (token.length < 6 || token.length > 10) { LOGIN.msg = '메일로 받은 숫자 코드를 그대로 입력해 주세요.'; return viewLogin(); }
  LOGIN.busy = true; LOGIN.msg = ''; viewLogin();
  const { error } = await sb.auth.verifyOtp({ email: LOGIN.email, token, type: 'email' });
  LOGIN.busy = false;
  if (error) { LOGIN.msg = tr('코드가 맞지 않거나 시간이 지났습니다. 메일을 다시 받아 주세요.', 'The code is incorrect or expired. Please request a new one.'); return viewLogin(); }
}

async function loadContext() {
  const ctx = await rpc('get_my_context');
  if (!ctx) {
    S.ctx = null; setTop(''); renderTabs(false);
    $('#topbar').insertAdjacentHTML('beforeend', '<button class="iconbtn" data-act="logout">로그아웃</button>');
    $('#app').innerHTML = `<h1>아직 등록되지 않은 계정입니다</h1>
      <div class="card"><p style="margin-top:0">로그인은 되었지만, 셀 케어 명단에 이 이메일이 없거나 사용이 중지된 상태입니다.</p>
      <p class="muted small" style="margin-bottom:0">담당 교역자에게 이메일 등록을 요청해 주세요.</p></div>`;
    return;
  }
  S.ctx = ctx; S.me = ctx.profile; S.roles = ctx.roles || [];
  const tabs = availableTabs();
  if (!tabs.length) {

const PUSH = { busy: false, msg: '' };
const isIOS = () => /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
const isStandalone = () => window.matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
function b64urlToBytes(s) { const p = '='.repeat((4 - s.length % 4) % 4); const b = atob((s + p).replace(/-/g, '+').replace(/_/g, '/')); return Uint8Array.from(b, c => c.charCodeAt(0)); }
async function pushState() {
  if (/KAKAOTALK|NAVER|Instagram|FBAN|FBAV/i.test(navigator.userAgent)) return { s: 'inapp' };
  if (!('serviceWorker' in navigator) || !('PushManager' in window) || !('Notification' in window)) return { s: isIOS() && !isStandalone() ? 'ios-home' : 'unsupported' };
  try { const r = await fetch('api/vapid-public', { cache: 'no-store' }); if (!r.ok) return { s: 'off' }; } catch (_) { return { s: 'off' }; }
  if (Notification.permission === 'denied') return { s: 'denied' };
  const reg = await navigator.serviceWorker.ready;
  const sub = await reg.pushManager.getSubscription();
  return { s: sub ? 'on' : 'ready', sub };
}
async function renderPushBox() {
  const box = $('#pushbox'); if (!box) return;
  let st; try { st = await pushState(); } catch (_) { st = { s: 'off' }; }
  if (!$('#pushbox')) return;
  const msg = PUSH.msg ? `<p class="small" style="margin:0;color:var(--accent)">${esc(PUSH.msg)}</p>` : '';
  const card = (inner) => `<h2>${tr('셀 케어 알림', 'Notifications')}</h2><div class="card stack">${inner}${msg}</div>`;
  if (st.s === 'off') { box.innerHTML = ''; return; }
  if (st.s === 'on' && !PUSH.synced) {   // 이 휴대폰 알림을 지금 로그인한 사람 것으로 맞춤 (계정을 바꿔 로그인한 경우)
    PUSH.synced = true;
    const j = st.sub.toJSON();
    rpc('save_push_subscription', { p_endpoint: j.endpoint, p_p256dh: j.keys.p256dh, p_auth: j.keys.auth, p_ua: navigator.userAgent, p_lang: LANG }).catch(() => { PUSH.synced = false; });
  }
  if (st.s === 'on') return box.innerHTML = card(`<p style="margin:0">${tr('이 휴대폰으로 <b>셀 케어 알림</b>을 받고 있습니다.', 'This phone receives <b>Cell Care notifications</b>.')}</p>
    <div class="row" style="gap:8px"><button class="btn sm ghost" data-act="push-test" ${PUSH.busy ? 'disabled' : ''}>${tr('테스트 알림 보내기', 'Send a test')}</button>
    <button class="link" data-act="push-off">${tr('알림 끄기', 'Turn off')}</button></div>`);
  if (st.s === 'ready') return box.innerHTML = card(`<p style="margin:0">${tr('셀 케어 알림을 받으시겠어요?', 'Would you like Cell Care notifications?')}</p>
    <button class="btn" data-act="push-on" ${PUSH.busy ? 'disabled' : ''}>${PUSH.busy ? tr('설정하는 중…', 'Setting up…') : tr('알림 받기', 'Turn on notifications')}</button>
    <p class="tiny muted" style="margin:0">${tr('버튼을 누른 뒤 나오는 창에서 「허용」을 눌러 주세요.', 'Then tap “Allow” in the pop-up.')}</p>`);
  if (st.s === 'denied') return box.innerHTML = card(`<p style="margin:0">${tr('이 휴대폰에서 셀 케어 알림이 꺼져 있습니다.', 'Cell Care notifications are blocked on this phone.')}</p>
    <p class="small muted" style="margin:0">${tr('휴대폰 <b>설정 → 알림</b>(또는 인터넷 앱의 사이트 설정)에서 셀 케어 알림을 허용한 뒤 다시 열어 주세요.', 'Allow them in your phone’s <b>Settings → Notifications</b> (or the browser’s site settings), then reopen the app.')}</p>`);
  if (st.s === 'ios-home') return box.innerHTML = card(`<p style="margin:0">${tr('아이폰은 <b>홈 화면에 추가</b>한 뒤에 알림을 받을 수 있어요.', 'On iPhone, notifications work after you <b>Add to Home Screen</b>.')}</p>
    <ol class="small" style="margin:0;padding-left:20px;line-height:1.8">${tr('<li>사파리 아래쪽 <b>공유 버튼</b>(네모에 위쪽 화살표)을 누릅니다.</li><li><b>홈 화면에 추가</b>를 누릅니다.</li><li>홈 화면에 생긴 <b>셀 케어</b> 아이콘으로 열고, 여기서 「알림 받기」를 누릅니다.</li>', '<li>Tap the <b>Share</b> button at the bottom of Safari.</li><li>Tap <b>Add to Home Screen</b>.</li><li>Open Cell Care from the new home-screen icon and tap “Turn on notifications”.</li>')}</ol>`);
  if (st.s === 'inapp') return box.innerHTML = card(`<p style="margin:0">${tr('카카오톡 등 다른 앱 안에서 연 화면에서는 알림을 받을 수 없어요.', 'Notifications don’t work inside other apps like KakaoTalk.')}</p>
    <p class="small muted" style="margin:0">${tr('오른쪽 위 메뉴에서 <b>다른 브라우저로 열기</b>(크롬·사파리)를 눌러 주세요.', 'Use the menu to <b>open in your browser</b> (Chrome or Safari).')}</p>`);
  box.innerHTML = card(`<p style="margin:0">${tr('이 인터넷 앱에서는 알림을 받을 수 없어요.', 'This browser can’t receive notifications.')}</p><p class="small muted" style="margin:0">${tr('휴대폰의 크롬(안드로이드) 또는 사파리(아이폰)로 열어 주세요.', 'Please open it in Chrome (Android) or Safari (iPhone).')}</p>`);
}
// 제출 알림: 확인할 분께 바로 알림 (실패해도 제출에는 영향 없음)
async function notifySubmitted(id) {

    fetch('api/pastor-message', { method: 'POST', headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + (data.session?.access_token || '') }, body: JSON.stringify({ report: id }) }).catch(() => {});
  } catch (_) { /* 토요일 확인 알림이 대신 챙김 */ }

async function pushOn() {
  PUSH.busy = true; PUSH.msg = ''; 
  try {
    const perm = await Notification.requestPermission();
    if (perm !== 'granted') { PUSH.msg = '알림이 허용되지 않았습니다.'; return; }
    const reg = await navigator.serviceWorker.ready;
    const { key } = await (await fetch('api/vapid-public', { cache: 'no-store' })).json();
    const sub = (await reg.pushManager.getSubscription()) || await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: b64urlToBytes(key) });
    const j = sub.toJSON();
    await rpc('save_push_subscription', { p_endpoint: j.endpoint, p_p256dh: j.keys.p256dh, p_auth: j.keys.auth, p_ua: navigator.userAgent, p_lang: LANG });
    PUSH.msg = tr('알림을 켰습니다. 「테스트 알림 보내기」로 확인해 보세요.', 'Notifications are on. Try “Send a test”.');
  } catch (e) { PUSH.msg = '알림을 켜지 못했습니다. (' + errText(e) + ')'; }
  finally { PUSH.busy = false; renderPushBox(); }
}
async function pushOff() {
  try {
    const reg = await navigator.serviceWorker.ready; const sub = await reg.pushManager.getSubscription();
    if (sub) { await rpc('delete_push_subscription', { p_endpoint: sub.endpoint }).catch(() => {}); await sub.unsubscribe(); }
    PUSH.msg = tr('알림을 껐습니다.', 'Notifications are off.');
  } catch (e) { PUSH.msg = errText(e); }
  renderPushBox();
}
async function pushTest() {
  PUSH.busy = true; PUSH.msg = ''; renderPushBox();
  try {
    const { data } = await sb.auth.getSession();
    const r = await fetch('api/test-push', { method: 'POST', headers: { Authorization: 'Bearer ' + (data.session?.access_token || '') } });
    const j = await r.json();
    PUSH.msg = r.ok && j.sent ? tr('테스트 알림을 보냈습니다. 잠시 뒤 알림이 오는지 확인해 주세요.', 'Test sent. It should arrive in a moment.')
      : r.ok && j.failed ? '알림 서버에서 받지 않았습니다. 「알림 끄기」 후 다시 「알림 받기」를 눌러 주세요.'
      : r.ok ? '이 계정에 등록된 휴대폰이 없습니다. 「알림 끄기」 후 다시 「알림 받기」를 눌러 주세요.'
      : '보내지 못했습니다. ' + (j.error || '');
  } catch (e) { PUSH.msg = '보내지 못했습니다. (' + errText(e) + ')'; }
  finally { PUSH.busy = false; renderPushBox(); }
}

/* 호칭: 이름에 직분이 붙어 있으면(예: 장주상 전도사) '님'만, 없으면 '셀리더님' */
function honorific(name) { name = (name || '').trim(); return /\s/.test(name) ? name + '님' : name + ' 셀리더님'; }

const DAYS7 = ['월', '화', '수', '목', '금', '토', '일'];
function timeText(t) { const m = /^(\d{1,2}):(\d{2})/.exec(t || ''); if (!m) return t || ''; const h = +m[1]; return (h < 12 ? '오전 ' : '오후 ') + (h % 12 || 12) + ':' + m[2]; }
function schedText(c) { return [c.meet_day ? c.meet_day + '요일' : '', c.meet_time ? timeText(c.meet_time) : '', c.meet_place || ''].filter(Boolean).join(' · '); }
// 대신 쓰기: 이 셀의 담당 교역자(부산은 교역자 모두)이고 셀리더 본인이 아닐 때
function canProxy(r) { return !!r && !r.i_am_leader && (S.ctx.roles || []).includes('leadership') && (r.responsible_leadership_id === S.me.id || r.campus === '부산'); }
function writerLabel(leaders, submitter) {
  const ls = String(leaders || '').split(',').map(x => x.trim()).filter(Boolean);
  if (!submitter || !ls.length || ls.includes(submitter)) return submitter || '';
  return ls.join(', ') + '(' + submitter + ')';
}

  notes: '교역자가 특별히 만난 분들의 소식입니다. 셀리더와 셀원에게는 보이지 않습니다. 「누가 볼 수 있나요?」에서 볼 사람을 정할 수 있습니다.',
  dashCells: '이 주 모든 셀 보고서의 제출과 확인 현황입니다. 「모든 셀 보고서」를 펼치면 셀 이름으로 찾아 바로 열 수 있습니다.',

};
function info(k) {
  return [`<button class="ibtn" data-act="info" data-k="${k}" aria-expanded="false" aria-controls="ib-${k}" aria-label="${tr('안내 보기', 'Show help')}">i</button>`,
    `<div class="ibox" id="ib-${k}" hidden>${INFO[k] || ''}</div>`];
}
const HELP_LINE = () => `<p class="tiny muted" style="text-align:center;margin:16px 0 0">${tr('앱 사용 중 문제가 있으면 김도현 간사에게 문의해 주세요.', 'If you have any trouble with the app, please contact Dohyun Kim.')}</p>`;
const catsLabel = (n) => ((n.categories && n.categories.length) ? n.categories : (n.category ? [n.category] : ((n.prayer || '').trim() ? ['prayer'] : []))).map(k => LX('care', k)).join(', ');
const reviewerName = (mode, name) => mode === 'senior_direct' ? '담임 목사님·사모님' : (name || '담당자');
const assignedName = (cellId) => (S.ctx?.leader_cells || []).find(c => c.cell_id === cellId)?.leadership || '';
/* 관계 기록: 서로 어려워함 / 이 분이 상대 때문에 어려워함 */
function relText(subject, other, kind) {
  if (!other) return '';
  return kind === 'one_way' ? tr(subject + ' → ' + other + ' (' + other + ' 때문에 어려워함)', subject + ' → ' + other + ' (troubled by ' + other + ')')
    : tr(subject + ' ↔ ' + other + ' (서로 어려워함)', subject + ' ↔ ' + other + ' (mutual difficulty)');
}
let E = null; // 편집 중인 보고서
let PMSG_LOADED = '';

async function loadEditor(id) {
  const [rep] = await q(sb.from('weekly_reports').select('*').eq('id', id));
  if (!rep) throw new Error(tr('보고서를 찾을 수 없거나 볼 권한이 없습니다.', 'Report not found, or you do not have access.'));
  const [roster, visitors, prayers, notes, revisions, cells] = await Promise.all([
    rpc('get_report_roster', { p_report: id }),
    rpc('get_recent_visitors', { p_report: id }).catch(() => []),
    rpc('get_open_prayers', { p_report: id }),
    q(sb.from('care_notes').select('*').eq('report_id', id).order('created_at')),
    q(sb.from('revision_requests').select('*').eq('report_id', id).order('created_at', { ascending: false })),
    q(sb.from('cells').select('id, name, review_mode').eq('id', rep.cell_id)),
    rpc('pastor_msg_get', { p_report: id }).catch(() => [])
  ]).then(x => { PMSG_LOADED = (x[6] && x[6][0]) ? x[6][0].content : ''; return x; });
  const sep = new Set(((await rpc('separate_members', { p_cell: rep.cell_id }).catch(() => [])) || []).map(x => x.member_id));
  const sched = ((await rpc('cell_schedule', { p_cell: rep.cell_id }).catch(() => [])) || [])[0] || null;
  const proxy = !(S.ctx.leader_cells || []).some(c => c.cell_id === rep.cell_id);
  roster.forEach(x => { x.separate = sep.has(x.member_id); });
  const att = {};
  for (const m of roster) if (m.attendance) att[m.member_id] = { status: m.attendance, absence_reason: m.absence_reason || '' };
  const pu = {};
  for (const p of prayers) if (p.this_week_status) pu[p.prayer_id] = { status: p.this_week_status, note: p.this_week_note || '' };
  return {
    id, rep, cell: cells[0] || { name: '' }, roster, visitors, prayers, revisions, sched, proxy,
    step: E && E.id === id ? E.step : 0,
    m: {
      meeting_held: rep.meeting_held, meeting_date: rep.meeting_date || '', meeting_cancel_reason: rep.meeting_cancel_reason || '',
      // 실제 모인 시간·장소: 비어 있으면 셀의 원래 시간·장소를 미리 채움
      meeting_time: rep.meeting_time || (sched && sched.meet_time) || '', meeting_place: rep.meeting_place || (sched && sched.meet_place) || '',
      grace_notes: rep.grace_notes || '', grace_none: rep.grace_none === true, leader_message: rep.leader_message === 'share_up' ? 'none' : (rep.leader_message || 'none'), leader_message_note: rep.leader_message_note || '',
      att, pu,
      notes: notes.map(n => ({ member_id: n.member_id, categories: n.categories && n.categories.length ? n.categories.slice() : (n.category ? [n.category] : []), prayer: n.prayer || '', content: n.content, attention: n.leadership_attention_required, related_member_id: n.related_member_id || '', related_name: n.related_name || '', related_mode: n.related_member_id ? 'member' : n.related_name ? 'other' : '', relation_kind: n.relation_kind || 'mutual' })),
      hasCare: true
    },
    pmsg: PMSG_LOADED, pmsgSaved: PMSG_LOADED,
    version: rep.version, dirty: false, saving: false, saveMsg: '', conflict: false, confirm: false, newName: '', newReg: false, showAdd: false
  };
}

async function viewReportEditor(app, v) {
  E = await loadEditor(v.id);
  if (E.rep.status === 'submitted') { E = null; S.view = { name: 'detail', id: v.id, mine: true }; return render(); }
  renderEditor();
}

function mondayOf(iso) { const d = new Date(iso + 'T00:00:00Z'); return addDays(iso, -((d.getUTCDay() + 6) % 7)); }
function weekOK(d) { return d && d >= E.rep.week_start && d <= addDays(E.rep.week_start, 6); }

function renderEditor() {
  const app = $('#app'); const r = E.rep; const m = E.m;
  setTop(E.cell.name + ' · ' + weekLabel(r.week_start), true); renderTabs(false);
  document.body.style.paddingBottom = '170px';
  let h = '';
  const openRev = E.revisions.find(x => !x.resolved_at);
  if (openRev) h += `<div class="banner warn" style="margin-top:8px"><b>${tr('수정 요청 사유', 'Revision request')}</b>${TX('rev:' + openRev.id, openRev.reason)}</div>`;
  if (!openRev && r.status === 'draft' && r.submission_no > 0) h += `<div class="banner warn" style="margin-top:8px"><b>제출했던 보고서를 고치는 중입니다</b>다 고치신 뒤 마지막 단계에서 <b style="display:inline">다시 제출하기</b>를 꼭 눌러 주세요. 다시 제출하기 전까지는 '고치는 중'으로 보입니다.</div>`;
  if (E.proxy) h += `<div class="banner" style="margin-top:8px;border:1.5px solid var(--accent)"><b>✍️ 셀리더 대신 쓰는 중입니다</b>제출하면 「셀리더(${esc(S.me.name)})」로 표시됩니다. 셀리더도 같은 보고서를 함께 보고 고칠 수 있습니다.</div>`;
  if (E.conflict) h += `<div class="banner danger" role="alert" style="margin-top:8px"><b>다른 셀리더가 방금 이 보고서를 저장했습니다.</b>최신 내용을 불러온 뒤 이어서 작성해 주세요.<div style="margin-top:10px"><button class="btn sm" data-act="ed-reload">최신 내용 불러오기</button></div></div>`;
  h += '<div class="steps" aria-label="진행 단계">' + STEPS.map((s, i) => `<div class="${i < E.step ? 'done' : i === E.step ? 'now' : ''}">${i + 1}. ${s}</div>`).join('') + '</div>';

  if (E.step === 0) {
    const ldr = E.cell.review_mode === 'leadership' ? reviewerName('leadership', assignedName(E.cell.id)) + ' 확인' : E.cell.review_mode === 'senior_direct' ? '스캇 브래너 담임 목사님 / 성희 브래너 사모님 확인' : '검토 없음';
    h += `<h1>${weekLabel(r.week_start)} 셀모임${info('meet')[0]}</h1>${info('meet')[1]}
      <div class="banner" style="margin:8px 0 12px"><b>셀 케어 안내</b>맡으신 셀원에 대한 일률적인 보고보다는, 셀원들과 함께 나누며 애통하고 기도했던 내용, 함께 기뻐하고 감사했던 내용을 중심으로 작성해 주시기 바랍니다.</div>
      <div class="card"><dl class="summary" style="margin:0">
        <dt>보고 주차</dt><dd>${weekLabel(r.week_start, true)} (${dayLabel(r.week_start)} ~ ${dayLabel(addDays(r.week_start, 6))})</dd>
        <dt>셀</dt><dd>${esc(E.cell.name)}</dd><dt>확인</dt><dd>${ldr}</dd></dl></div>
      <h2>${weekLabel(r.week_start)} 셀모임을 진행하셨나요?</h2>
      <div class="seg" style="--n:2">
        <button data-act="ed-set" data-k="meeting_held" data-v="true" aria-pressed="${m.meeting_held === true}">진행함</button>
        <button data-act="ed-set" data-k="meeting_held" data-v="false" aria-pressed="${m.meeting_held === false}">진행하지 못함</button>
      </div>`;
    if (m.meeting_held === true) h += `<div style="margin-top:16px"><label class="field">셀모임 날짜
        <input type="date" data-bind="meeting_date" data-rerender="1" max="${S.ctx.today}" value="${esc(m.meeting_date)}"></label>
        ${m.meeting_date && !weekOK(m.meeting_date) ? (() => { const nw = mondayOf(m.meeting_date); return m.meeting_date > S.ctx.today
          ? `<div class="banner warn" style="margin-top:8px"><b>아직 오지 않은 날짜입니다</b>모임한 날짜를 다시 골라 주세요.</div>`
          : `<div class="banner warn" style="margin-top:8px" role="alertdialog"><b>${dayLabel(m.meeting_date)}은 ${weekLabel(nw)} (${dayLabel(nw)} ~ ${dayLabel(addDays(nw, 6))})입니다</b>이 보고서를 ${weekLabel(nw)} 보고서로 옮길까요? 적어 두신 출석·셀 케어·은혜와 나눔 내용은 그대로 함께 옮겨집니다.
            <div class="row" style="margin-top:10px;gap:8px;flex-wrap:wrap"><button class="btn sm" data-act="ed-move" ${E.moving ? 'disabled' : ''}>${weekLabel(nw)} 보고서로 옮기기</button><button class="btn quiet sm" data-act="ed-move-cancel">날짜 다시 고르기</button></div></div>`; })() : ''}
        <div class="row" style="gap:10px;margin-top:12px;flex-wrap:wrap;align-items:flex-end">
          <label class="field" style="flex:1 1 130px;margin:0">모인 시간<input type="time" data-bind="meeting_time" value="${esc(m.meeting_time)}"></label>
          <label class="field" style="flex:2 1 180px;margin:0">모인 장소<input type="text" data-bind="meeting_place" maxlength="80" placeholder="예: 셀리더 댁, 교회 2층 소그룹실" value="${esc(m.meeting_place)}"></label></div>
        ${E.sched && (E.sched.meet_day || E.sched.meet_time || E.sched.meet_place) ? `<p class="tiny muted" style="margin:6px 0 0">원래 모임: ${esc(schedText(E.sched))} · 다르게 모였으면 고쳐 주세요.</p>` : ''}</div>`;
    if (m.meeting_held === false) h += `<div style="margin-top:16px"><label class="field">모임을 진행하지 못한 이유
        <textarea data-bind="meeting_cancel_reason" placeholder="예: 추석 연휴로 쉬었습니다">${esc(m.meeting_cancel_reason)}</textarea></label>
        <p class="tiny muted">모임을 하지 못한 주에도 보고서를 제출할 수 있습니다.</p></div>`;
  }

  if (E.step === 1) {
    const listed = E.roster.filter(x => x.listed && !x.separate);
    const separate = E.roster.filter(x => x.listed && x.separate);
    const others = E.roster.filter(x => !x.listed);
    h += `<h1>출석${info('att')[0]}</h1>${info('att')[1]}<p class="sub">셀원마다 참석 여부를 골라 주세요.</p>
      <button class="btn quiet sm" data-act="ed-allpresent" style="margin-bottom:8px">정식 셀원 모두 참석으로</button>
      <div class="card" style="padding-block:4px">`;
    const memRow = (x) => {
      const a = m.att[x.member_id] || {};
      return `<div class="member"><div class="nm">${esc(x.name)}${x.type_in_week === 'visitor' ? ' <span class="pill accent">방문</span>' : ''}</div>
        <div class="seg att" style="--n:3">${['present', 'absent', 'unknown'].map(s =>
          `<button data-act="ed-att" data-id="${x.member_id}" data-v="${s}" aria-pressed="${a.status === s}">${LX('att', s)}</button>`).join('')}</div>
        ${a.status === 'absent' ? `<input type="text" data-att-reason="${x.member_id}" placeholder="결석 사유 (예: 출장)" value="${esc(a.absence_reason || '')}">` : ''}</div>`;
    };
    h += listed.length ? listed.map(memRow).join('') : '<p class="empty">등록된 셀원이 없습니다.</p>';
    h += '</div>';
    if (separate.length) {
      h += '<h2>따로 만나는 셀원</h2><p class="sub">셀모임과 따로 만나는 분입니다. 결석으로 세지 않습니다.</p><div class="card" style="padding-block:4px">' + separate.map(x => {
        const a = m.att[x.member_id] || {};
        return `<div class="member"><div class="nm">${esc(x.name)} <span class="pill">따로</span></div>
          <div class="seg att" style="--n:2"><button data-act="ed-att" data-id="${x.member_id}" data-v="present" aria-pressed="${a.status === 'present'}">이번 주 만남</button>
          <button data-act="ed-att" data-id="${x.member_id}" data-v="unknown" aria-pressed="${a.status !== 'present'}">못 만남</button></div></div>`;
      }).join('') + '</div>';
    }
    if (others.length) h += '<h2>이번 주 방문자</h2><div class="card" style="padding-block:4px">' + others.map(memRow).join('') + '</div>';
    const vis = E.visitors.filter(x => !E.roster.find(y => y.member_id === x.member_id));
    if (vis.length) h += '<h2>최근에 왔던 방문자</h2><p class="sub">이번 주에도 왔다면 눌러서 추가해 주세요.</p><div class="chips">' +
      vis.map(x => `<button class="chip" data-act="ed-revisit" data-id="${x.member_id}">+ ${esc(x.name)} <span class="tiny muted">(${weekLabel(x.last_seen_week)})</span></button>`).join('') + '</div>';
    h += '<h2>새 참석자</h2>';
    h += E.showAdd ? `<div class="card stack">
        <label class="field">이름<input type="text" id="new-name" placeholder="이름" value="${esc(E.newName)}"></label>
        <label class="check"><input type="checkbox" id="new-reg" ${E.newReg ? 'checked' : ''}><span>정식 셀원으로 바로 등록<br><span class="tiny muted">체크하지 않으면 이번 주 방문자로만 기록됩니다.</span></span></label>

      : '<button class="btn ghost" data-act="ed-addopen">+ 새 참석자 추가</button>';
  }

  if (E.step === 3) {
    h += `<h1>은혜와 나눔${info('grace')[0]}</h1>${info('grace')[1]}
      <label class="check"><input type="checkbox" data-bind-check="grace_none" ${m.grace_none ? 'checked' : ''}><span>이번 주 특별히 나눌 내용이 없습니다</span></label>
      <p class="tiny muted">기도제목만 있는 경우 위 항목을 선택해 주세요. 셀 케어에 적은 기도제목은 그대로 제출됩니다.</p>

  }

  if (E.step === 2) {
    h += '<h1>셀 케어 <span style="font-weight:500;font-size:.7em">(셀원 근황)</span>' + info('care')[0] + '</h1>' + info('care')[1];
    if (E.prayers.length) {

function markDirty(rerender) { E.dirty = true; E.saveMsg = '저장 전'; const s = $('#savestate'); if (s) s.textContent = E.saveMsg; clearTimeout(E.timer); E.timer = setTimeout(save, 1200); if (rerender) renderEditor(); }

// 기도제목만 있는 기록도 기존 DB의 기도 유형으로 저장한다.
function careCategories(n) {
  return n.categories.length ? n.categories : ((n.prayer || '').trim() && !n.content.trim() ? ['prayer'] : []);
}
function invalidCareNote(n) {
  const hasText = !!(n.content.trim() || (n.prayer || '').trim());
  return (hasText || !!n.member_id || !!n.categories.length) && (!n.member_id || !hasText || !careCategories(n).length);
}
function payload() {
  const m = E.m;
  return {
    meeting_held: m.meeting_held, meeting_date: m.meeting_held ? (m.meeting_date || null) : null,
    meeting_cancel_reason: m.meeting_held === false ? m.meeting_cancel_reason : null,
    meeting_time: m.meeting_held === true ? (m.meeting_time || '') : '', meeting_place: m.meeting_held === true ? (m.meeting_place || '') : '',
    grace_notes: m.grace_none ? null : m.grace_notes, grace_none: m.grace_none, leader_message: m.leader_message, leader_message_note: m.leader_message !== 'none' ? (m.leader_message_note || '').trim() : '',
    attendance: E.roster.filter(x => x.listed || m.att[x.member_id]).map(x => {
      const a = m.att[x.member_id] || { status: 'unknown' };
      return { member_id: x.member_id, status: a.status, absence_reason: a.status === 'absent' ? (a.absence_reason || '') : '' };
    }),
    care_notes: m.hasCare ? m.notes.filter(n => n.member_id && careCategories(n).length && (n.content.trim() || (n.prayer || '').trim()))
      .map(n => ({ member_id: n.member_id, category: careCategories(n)[0], categories: careCategories(n), content: n.content.trim(), prayer: (n.prayer || '').trim(), leadership_attention_required: !!n.attention,
        related_member_id: n.categories.includes('relationship') ? (n.related_member_id || '') : '', related_name: n.categories.includes('relationship') && n.related_mode === 'other' ? (n.related_name || '') : '', relation_kind: n.relation_kind || 'mutual' })) : [],
    prayer_updates: Object.entries(m.pu).filter(([, u]) => u.status).map(([id, u]) => ({ prayer_id: id, status: u.status, note: u.note || '' }))
  };
}
async function save() {
  if (!E || E.conflict) return false;
  if (E.saving) { E.again = true; return E.savingPromise; }
  if (!E.dirty) return true;
  clearTimeout(E.timer);
  E.saving = true; E.dirty = false; E.saveMsg = '저장하는 중…'; const s = $('#savestate'); if (s) s.textContent = E.saveMsg;
  const ed = E;
  E.savingPromise = (async () => {
    try {
      ed.version = await rpc('save_report', { p_report: ed.id, p_data: payload(), p_version: ed.version });
      if ((ed.pmsg || '').trim() !== (ed.pmsgSaved || '').trim()) { const v = ed.pmsg || ''; await rpc('pastor_msg_save', { p_report: ed.id, p_content: v }); ed.pmsgSaved = v; }
      const t = new Date().toLocaleTimeString('ko-KR', { hour: 'numeric', minute: '2-digit', timeZone: 'Asia/Seoul' });
      ed.saveMsg = '자동 저장됨 · ' + t;
      return true;
    } catch (e) {
      if (e.code === 'P0409' || /VERSION_CONFLICT/.test(e.message || '')) { ed.conflict = true; if (E === ed) renderEditor(); }
      else { ed.dirty = true; ed.saveMsg = '저장하지 못했습니다: ' + errText(e); }
      return false;
    } finally {
      ed.saving = false;
      const s2 = $('#savestate'); if (s2 && E === ed) s2.textContent = ed.saveMsg;
      if (ed.again) { ed.again = false; if (ed.dirty) save(); }
    }
  })();
  return E.savingPromise;
}

function validateForSubmit() {
  const m = E.m; const w = E.rep.week_start;
  if (m.meeting_held === null || m.meeting_held === undefined) return [0, '이번 주 셀모임 진행 여부를 골라 주세요.'];
  if (m.meeting_held && !weekOK(m.meeting_date)) return [0, '셀모임 날짜를 ' + dayLabel(w) + '부터 ' + dayLabel(addDays(w, 6)) + ' 사이로 입력해 주세요.'];
  if (m.meeting_held === false && !m.meeting_cancel_reason.trim()) return [0, '모임을 진행하지 못한 이유를 적어 주세요.'];
  if (m.meeting_held && !m.grace_none && !m.grace_notes.trim()) return [3, '은혜와 나눔을 적어 주세요.'];
  if (m.hasCare && m.notes.some(invalidCareNote)) return [2, '셀원과 내용 또는 기도제목을 적어 주세요. 기도제목만 적을 때는 유형을 고르지 않아도 됩니다.'];
  return null;
}
async function submitReport() {
  const bad = validateForSubmit();
  if (bad) { E.confirm = false; E.step = bad[0]; renderEditor(); toast(bad[1], 4000); return; }
  const ok = await save(); if (!ok && E.conflict) return;
  if (E.dirty) { const ok2 = await save(); if (!ok2) { toast('저장하지 못해 제출할 수 없습니다. 인터넷 연결을 확인해 주세요.'); return; } }
  try {
    await rpc('submit_report', { p_report: E.id, p_version: E.version });
    const id = E.id; E = null; hideFooter();
    notifySubmitted(id);
    toast('보고서를 제출했습니다. 수고 많으셨습니다.');
    S.stack = []; S.view = { name: 'detail', id, mine: true }; render();
  } catch (e) {
    if (e.code === 'P0409' || /VERSION_CONFLICT/.test(e.message || '')) { E.conflict = true; E.confirm = false; renderEditor(); }
    else { E.confirm = false; renderEditor(); toast(errText(e), 5000); }
  }
}

/* 편집 화면의 입력 (다시 그리지 않음: 글자 입력 중 커서 유지) */
document.addEventListener('input', (e) => {
  if (!E) return; const t = e.target;
  if (t.dataset.bind) { E.m[t.dataset.bind] = t.value; markDirty(false); }
  else if (t.dataset.attReason) { (E.m.att[t.dataset.attReason] ||= { status: 'absent' }).absence_reason = t.value; markDirty(false); }
  else if (t.dataset.puNote) { (E.m.pu[t.dataset.puNote] ||= {}).note = t.value; markDirty(false); }
  else if (t.dataset.note !== undefined && t.dataset.f === 'content') { E.m.notes[+t.dataset.note].content = t.value; markDirty(false); }
  else if (t.dataset.note !== undefined && t.dataset.f === 'prayer') { E.m.notes[+t.dataset.note].prayer = t.value; markDirty(false); }
  else if (t.dataset.note !== undefined && t.dataset.f === 'related_name') { E.m.notes[+t.dataset.note].related_name = t.value; markDirty(false); }
  else if (t.dataset.pmsg) { E.pmsg = t.value; markDirty(false); }
  else if (t.id === 'new-name') E.newName = t.value;
});
document.addEventListener('change', (e) => {
  if (!E) return; const t = e.target;
  if (t.dataset.bindCheck) { E.m[t.dataset.bindCheck] = t.checked; markDirty(true); }
  else if (t.dataset.bind) { E.m[t.dataset.bind] = t.value; markDirty(!!t.dataset.rerender); }
  else if (t.dataset.noteAttn !== undefined) { E.m.notes[+t.dataset.noteAttn].attention = t.checked; markDirty(false); }
  else if (t.dataset.note !== undefined && t.dataset.f === 'member_id') { E.m.notes[+t.dataset.note].member_id = t.value; markDirty(E.m.notes[+t.dataset.note].categories.includes('relationship')); }
  else if (t.dataset.note !== undefined && t.dataset.f === 'related') { const n = E.m.notes[+t.dataset.note];
    if (t.value === '__other') { n.related_mode = 'other'; n.related_member_id = ''; } else { n.related_mode = t.value ? 'member' : ''; n.related_member_id = t.value; n.related_name = ''; }
    markDirty(true); }
  else if (t.id === 'new-reg') E.newReg = t.checked;
});

  if (canEdit) h += `<div style="margin-top:12px"><button class="btn" data-act="open-editor" data-id="${rep.id}">${rep.status === 'revision_requested' ? '수정해서 다시 제출하기' : rep.submission_no > 0 ? '고친 보고서 다시 제출하기' : '작성 계속하기'}</button></div>`;
  if (rep.status === 'submitted' && row.i_am_leader && rep.review_status !== 'reviewed') {

      ? `<div class="banner warn" style="margin-top:12px" role="alertdialog"><b>보고서를 고치시겠어요?</b>고치는 동안에는 '고치는 중'으로 보이고, 확인할 분은 다시 제출하신 뒤에 확인할 수 있습니다. 다 고치신 뒤 꼭 <b style="display:inline">다시 제출하기</b>를 눌러 주세요.
          <div class="row" style="margin-top:12px"><button class="btn sm" data-act="rep-reopen" data-id="${rep.id}" ${DETAIL.busy ? 'disabled' : ''}>고치기 시작</button><button class="btn quiet sm" data-act="rep-reopen-cancel">취소</button></div></div>`
      : `<div style="margin-top:12px"><button class="btn ghost" data-act="rep-reopen-ask" data-id="${rep.id}">보고서 고치기</button>

    <div class="card"><h3>${tr('출석', 'Attendance')}</h3><div class="num">${tr('셀원 ' + listedAtt.length + '명 중 참석 ' + pres.length + '명', pres.length + ' of ' + listedAtt.length + ' members present')}${visitors.length ? tr(' · 방문 ' + visitors.length + '명', ' · ' + visitors.length + ' visitor(s)') : ''}</div>

      <div class="tiny muted" style="margin-top:4px">${tr('담임 목사님·사모님만 보십니다', 'Only visible to Pastor Scott Brenner & Mrs. Sunghee Brenner')}${pmsg.sent_at ? ' · ' + tr(dateTime(pmsg.sent_at) + ' 전달됨', 'Sent ' + dateTime(pmsg.sent_at)) : ''}</div>

    ${rep.submitted_at && (isSenior() || cmts.some(c => c.target === 'report')) ? `<div class="card" style="border-color:#C9D3E4"><h3>${tr('담임 목사님·사모님 코멘트', 'Comments from Pastor & Mrs. Brenner')}</h3>${commentBlock(cmts, 'report', rep)}</div>` : ''}

/* 담임 목사님·사모님 코멘트 (보고서 / 목사님께 드리는 말씀) */
const CMT = { id: null, draft: { report: '', pastor_msg: '' }, busy: false, del: null };
function commentBlock(cmts, target, rep) {
  const list = cmts.filter(c => c.target === target);
  const hasHangul = (s) => /[가-힣]/.test(s || '');
  let h = list.map(c => {
    // 목사님·사모님 화면은 쓰신 그대로, 셀리더·교역자 화면은 한국어 번역을 먼저
    const showKo = !isSenior() && c.content_ko && !hasHangul(c.content);
    return `<div class="note" style="border-left:3px solid var(--accent);padding-left:10px;margin-top:10px">
      <div><b>${esc(c.author_name)}</b> <span class="tiny muted">${dateTime(c.created_at)}</span></div>
      <div style="margin-top:4px">${nl2br(showKo ? c.content_ko : c.content)}</div>
      ${showKo ? '<div class="tiny muted" style="margin-top:4px">' + tr('원문: ', 'Original: ') + nl2br(c.content) + '</div>' : ''}
      ${c.mine ? '<div class="row" style="gap:8px;margin-top:6px">' + (CMT.del === c.id
          ? `<button class="btn warn sm" data-act="cmt-del" data-id="${c.id}">${tr('이 코멘트 지우기', 'Delete this comment')}</button><button class="btn quiet sm" data-act="cmt-del-cancel">${tr('취소', 'Cancel')}</button>`
          : `<button class="link tiny" data-act="cmt-del-ask" data-id="${c.id}">${tr('지우기', 'Delete')}</button>`) + '</div>' : ''}</div>`;
  }).join('');
  if (isSenior()) {
    const who = target === 'pastor_msg'
      ? tr('이 말씀을 쓴 셀리더만 봅니다.', 'Only the cell leader who wrote this message will see your reply.')
      : tr('셀리더와 담당 교역자가 봅니다.', 'The cell leader and their Leadership will see this.');
    h += `<div style="margin-top:10px"><textarea data-cmt="${target}" rows="3" maxlength="3000" style="width:100%" placeholder="${target === 'pastor_msg' ? tr('이 말씀에 답글을 남겨 주세요', 'Reply to this message') : tr('보고서에 코멘트를 남겨 주세요', 'Leave a comment on this report')}">${esc(CMT.draft[target] || '')}</textarea>
      <p class="tiny muted" style="margin:4px 0 8px">${who} ${tr('영어로 쓰시면 한국어 번역이 함께 전달됩니다.', 'Written in English, it will be sent with a Korean translation.')}</p>
      <button class="btn sm" data-act="cmt-add" data-target="${target}" data-id="${rep.id}" ${CMT.busy ? 'disabled' : ''}>${CMT.busy ? tr('보내는 중…', 'Sending…') : target === 'pastor_msg' ? tr('답글 보내기', 'Send reply') : tr('코멘트 남기기', 'Post comment')}</button></div>`;
  } else if (!list.length) return '';
  return h;
}
async function commentAdd(id, target) {
  const text = (CMT.draft[target] || '').trim();
  if (!text) return toast(tr('코멘트를 적어 주세요.', 'Please write a comment.'));
  CMT.busy = true; render();
  try {
    const cid = await rpc('senior_comment_add', { p_report: id, p_target: target, p_content: text });
    CMT.draft[target] = '';
    try {
      const { data } = await sb.auth.getSession();
      await fetch('api/senior-comment', { method: 'POST', headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + (data.session?.access_token || '') }, body: JSON.stringify({ comment: cid }) });
    } catch (_) { }
    toast(tr('코멘트를 남겼습니다.', 'Comment sent.'));
  } catch (e) { toast(errText(e), 5000); }
  finally { CMT.busy = false; render(); }
}
document.addEventListener('input', (e) => { const t = e.target.dataset && e.target.dataset.cmt; if (t) CMT.draft[t] = e.target.value; });
/* 보고서 내용 번역 (목사님·사모님, 영어 화면) — 화면을 열면 자동으로 번역 */
const TX_CACHE = {};
function txStatus(map, busy, err, act, id) {
  if (map) return '<p class="tiny muted" style="margin:8px 0 0">Translated by AI · the Korean original is shown in small text.</p>';
  if (err) return `<div class="banner warn small" style="margin-top:8px">${esc(err)}<div style="margin-top:8px"><button class="btn sm ghost" data-act="${act}" data-id="${id || ''}">Try again</button></div></div>`;
  return '<p class="tiny muted" style="margin:8px 0 0">Translating into English…</p>';
}
function autoTx(map, busy, err, fn) { if (!DEMO.role && EN() && isSenior() && !map && !busy && !err) setTimeout(fn, 0); }
const TRANS = { id: null, map: null, busy: false, err: '' };
function TX(key, ko) {
  const en = TRANS.map && TRANS.map[key];
  if (!EN() || !en) return nl2br(ko);
  return nl2br(en) + '<div class="tiny muted" style="margin-top:2px">' + nl2br(ko) + '</div>';
}
async function translateReport(id) {
  TRANS.busy = true; TRANS.err = ''; render();
  try {
    const { data } = await sb.auth.getSession();
    const r = await fetch('api/translate', { method: 'POST', headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + (data.session?.access_token || '') }, body: JSON.stringify({ report: id }) });
    const j = await r.json();
    if (!r.ok) throw new Error(j.error || r.status);
    TRANS.id = id; TRANS.map = j.translations || {}; TX_CACHE['rep:' + id] = TRANS.map;
  } catch (e) { TRANS.err = 'Could not translate right now. Please try again in a moment.'; }
  finally { TRANS.busy = false; render(); }
}
document.addEventListener('input', (e) => { if (e.target.id === 'rv-note') DETAIL.note = e.target.value; if (e.target.id === 'rv-reason') DETAIL.reason = e.target.value; });

/* =====================================================================
   주차 상태 공통
   ===================================================================== */
function rowState(r) {
  if (!r.report_id) return r.is_missing ? { t: tr('미제출 · 마감 지남', 'Not submitted · overdue'), c: 'danger' } : { t: tr('작성 전', 'Not started'), c: '' };
  if (r.status === 'draft') return r.is_missing ? { t: tr('작성 중 · 마감 지남', 'Draft · overdue'), c: 'danger' } : { t: tr('작성 중', 'Draft'), c: '' };
  if (r.status === 'revision_requested') return { t: tr('수정 요청됨', 'Revision requested'), c: 'warn' };
  const late = r.is_late ? tr(' (마감 후)', ' (late)') : '';
  if (r.review_status === 'reviewed') return { t: tr('제출 완료', 'Submitted') + late + tr(' · 확인 완료', ' · Reviewed'), c: 'ok' };
  if (r.review_status === 'not_required') return { t: tr('제출 완료', 'Submitted') + late + tr(' · 검토 없음', ' · No review'), c: 'ok' };
  return { t: tr('제출 완료', 'Submitted') + late + ' · ' + (r.review_mode === 'senior_direct' ? tr('확인 대기', 'Awaiting review') : tr('교역자 확인 대기', 'Awaiting Leadership review')), c: 'warn' };
}
const isConcern = (r) => r.escalation_level && r.escalation_level !== 'normal';
function weekNav(week, act) {
  const thisWeek = S.ctx.this_week;
  return `<div class="weeknav"><button class="btn quiet sm" data-act="${act}" data-week="${addDays(week, -7)}">${tr('← 지난주', '← Prev')}</button>
    <b>${weekLabel(week, true)}</b>
    <button class="btn quiet sm" data-act="${act}" data-week="${addDays(week, 7)}" ${week >= thisWeek ? 'disabled' : ''}>${tr('다음 주 →', 'Next →')}</button></div>`;
}
function cellItem(r, opts = {}) {
  const st = rowState(r);
  const can = !!r.report_id && r.status !== 'draft';
  return `<button class="listitem" ${can ? `data-act="open-detail" data-id="${r.report_id}"` : 'data-act="noop"'} ${can ? '' : 'aria-disabled="true"'}>
    <span class="top"><b>${esc(r.cell_name)}</b><span class="pill ${st.c}">${st.t}</span></span>
    <span class="small muted">Cell Leader: ${esc(r.leader_names || tr('배정 전', 'Not assigned'))}${opts.showResp && r.responsible_leadership_name ? tr(' · 담당: ', ' · Leadership: ') + esc(r.responsible_leadership_name) : ''}</span>
    ${isConcern(r) ? `<span class="small" style="color:var(--warn)">${tr('상위 보고', 'Escalation')}: ${LX('escalation', r.escalation_level)}</span>` : ''}
    ${r.attention_items ? `<span class="small" style="color:var(--warn)">${tr('교역자 확인 필요 항목 ' + r.attention_items + '건', r.attention_items + ' item(s) flagged for Leadership')}</span>` : ''}
  </button>`;
}

/* Leadership 탭의 '내 셀': 제출된 보고서는 보기, 아직이면 작성 화면으로 (확인 버튼 없음) */

  return `<button class="listitem" ${act}>
    <span class="top"><b>${esc(r.cell_name)}</b><span class="pill ${st.c}">${st.t}</span></span>

  </button>`;

   ===================================================================== */
async function viewLeadershipHome(app, v) {
  setTop(S.me?.name || tr('교역자', 'Pastoral staff'), false); renderTabs(true);
  const week = v.week || S.ctx.this_week;
  const [rows, asg, lr, unread] = await Promise.all([
    rpc('get_week_status', { p_week_start: week }),
    q(sb.from('leadership_assignments').select('cell_id, start_date, end_date').eq('leadership_user_id', S.me.id)),
    rpc('lr_get', { p_week: week }).catch(() => null),
    rpc('msg_unread').catch(() => 0)
  ]);
  const today = S.ctx.today;
  const current = new Set(asg.filter(a => a.start_date <= today && (!a.end_date || a.end_date >= today)).map(a => a.cell_id));
  const busan = rows.filter(r => r.campus === '부산' && !r.i_am_leader).sort((a, b) => a.cell_name.localeCompare(b.cell_name, 'ko'));
  const mineBundang = rows.filter(r => r.campus !== '부산' && !r.i_am_leader && r.review_mode === 'leadership' && (current.has(r.cell_id) || r.responsible_leadership_id === S.me.id || r.i_can_review));
  const showBusan = busan.length > 0 || rows.some(r => r.i_am_leader && campusOf(r) === '부산');
  const onBusan = showBusan && CAMP.v === '부산';
  // 분당·부산 탭 모두 같은 구성: 부산은 교역자 모두가 함께 맡는 셀이 「담당 셀」
  const mine = onBusan ? busan : mineBundang;
  const own = rows.filter(r => r.i_am_leader && (!showBusan || campusOf(r) === CAMP.v)).sort((a, b) => a.cell_name.localeCompare(b.cell_name, 'ko'));
  const submitted = mine.filter(r => r.status === 'submitted');
  const need = mine.filter(r => r.i_can_review);
  const reviewed = submitted.filter(r => r.review_status === 'reviewed');
  const concern = mine.filter(isConcern);
  const order = (r) => r.i_can_review ? 0 : r.status === 'revision_requested' ? 1 : !r.report_id || r.status === 'draft' ? 2 : 3;
  mine.sort((a, b) => order(a) - order(b) || a.cell_name.localeCompare(b.cell_name, 'ko'));

  let h = `<h1>${esc(S.me.name)}</h1>` + weekNav(week, 'lh-week') + (showBusan ? campusSeg() : '');
  h += noticeCard(await rpc('notice_list', { p_limit: 3 }).catch(() => []), true);
  {
    const st = !lr ? ['pill warn', '아직 작성 전'] : lr.status === 'submitted' ? ['pill ok', '제출 완료 · ' + (lr.items || []).length + '명'] : ['pill accent', '작성 중'];
    h += `<div class="card stack" style="margin-bottom:12px"><div class="row"><h3 style="margin:0">교역자 보고</h3><span class="spacer"></span><span class="${st[0]}">${st[1]}</span></div>
      <p class="muted small" style="margin:0">${lr && lr.status === 'submitted' ? dateTime(lr.submitted_at) + ' 제출 · 담임 목사님·사모님께서 보고 계십니다.' : '맡으신 분들 가운데 목사님께 전할 소식을 직접 정리해 주세요. 제출하면 바로 목사님·사모님께 보입니다.'}</p>
      <button class="btn ${lr && lr.status === 'submitted' ? 'ghost' : ''}" data-act="lr-edit-open" data-week="${week}">${!lr ? '교역자 보고 쓰기' : lr.status === 'submitted' ? '보고 보기 · 고치기' : '이어서 쓰기'}</button></div>
      <button class="listitem" data-act="open-issues" style="margin-bottom:12px"><span class="top"><b>셀원 이슈 보기</b><span class="small muted">내 분파 · 교회 전체 →</span></span><span class="small muted">관계, 장기결석, 건강 등 이슈별로, 사람별로 모아 봅니다.</span></button>` + msgEntry(unread, '셀리더나 목사님·사모님께서 보낸 메시지를 보고 답장할 수 있습니다.');
  }
  h += need.length
    ? `<div class="banner warn"><b>확인이 필요한 보고서가 ${need.length}건 있습니다</b><div style="margin-top:10px"><button class="btn warn sm" data-act="open-detail" data-id="${need[0].report_id}">확인하러 가기</button></div></div>`
    : mine.length ? '<div class="banner"><b>지금 확인할 보고서가 없습니다</b>제출되는 대로 여기에 표시됩니다.</div>' : '';
  h += `<div class="stats" style="margin-top:12px">
    <div class="stat"><div class="v">${mine.length}</div><div class="k">담당 셀</div></div>
    <div class="stat"><div class="v">${submitted.length}</div><div class="k">제출 완료</div></div>
    <div class="stat ${mine.length - submitted.length ? 'warn' : ''}"><div class="v">${mine.length - submitted.length}</div><div class="k">미제출</div></div>
    <div class="stat"><div class="v">${reviewed.length}</div><div class="k">확인 완료</div></div>
    <div class="stat ${need.length ? 'warn' : ''}"><div class="v">${need.length}</div><div class="k">확인 필요</div></div>
    <div class="stat ${concern.length ? 'warn' : ''}"><div class="v">${concern.length}</div><div class="k">목양 관심</div></div></div>`;
  h += '<h2>담당 셀' + info('lhCells')[0] + '</h2>' + info('lhCells')[1] + (onBusan ? '<p class="sub" style="margin-top:0">부산 캠퍼스 셀은 교역자 모두가 함께 맡습니다. 먼저 확인하신 분 이름으로 기록됩니다.</p>' : '')
    + (mine.length ? (mine.length > 4 ? `<input type="search" id="lh-q" value="${esc(LHQ.q)}" placeholder="셀 이름이나 셀리더 이름으로 찾기" style="margin:4px 0 10px" autocomplete="off">` : '')
      + '<div class="stack" id="lh-list">' + mine.map(r => `<div data-q="${esc((r.cell_name + ' ' + (r.leader_names || '')).toLowerCase())}">${cellItem(r)}${canProxy(r) && r.status !== 'submitted'
          ? `<div style="text-align:right;margin-top:4px"><button class="btn sm ghost" ${r.report_id ? `data-act="open-report" data-id="${r.report_id}"` : `data-act="start-report" data-cell="${r.cell_id}" data-week="${week}"`}>✍️ ${r.report_id ? '대신 이어서 쓰기' : '셀리더 대신 쓰기'}</button></div>` : ''}</div>`).join('') + '</div><p class="empty" id="lh-none" hidden>찾는 셀이 없습니다.</p>'
      : '<p class="empty">' + (onBusan ? '이 주에 부산 캠퍼스 셀이 없습니다.' : '이 주에 담당한 셀이 없습니다.') + '</p>');
  const manage = onBusan ? mine : mine.filter(r => current.has(r.cell_id));
  if (manage.length) h += '<h3 style="margin:20px 0 8px">셀원 관리</h3><div class="chips">' + manage.map(r => `<button class="chip" data-act="open-members" data-cell="${r.cell_id}" data-name="${esc(r.cell_name)}">${esc(r.cell_name)}</button>`).join('') + '</div>';
  if (own.length) {
    const ownWho = own.every(r => r.review_mode === 'none') ? '검토 없이 제출하는 셀입니다.' + (onBusan ? ' 교역자 누구나 보고서를 쓸 수 있습니다.' : '')
      : '확인은 ' + (own.some(r => r.review_mode === 'senior_direct') ? '스캇 브래너 담임 목사님 / 성희 브래너 사모님' : '담당 교역자') + '께서 하십니다.';
    h += '<h2>내 셀</h2><p class="sub">직접 인도하는 셀입니다. ' + ownWho + '</p>';
    h += '<div class="stack">' + own.map(r => ownCellItem(r, week)).join('') + '</div>';
  }
  if (!S.ctx.leader_cells.length) h += '<div id="pushbox"></div>';
  h += '<p style="text-align:center;margin-top:24px"><a href="staff-guide.html" style="color:var(--accent);font-weight:500">📖 교역자 사용 안내</a></p>' + HELP_LINE();
  app.innerHTML = h;
  bindListSearch('#lh-q', '#lh-list', '#lh-none', (v) => { LHQ.q = v; });
  renderPushBox();
}
// 목록 검색: 입력하면 data-q에 그 글자가 들어 있는 줄만 남김
const LHQ = { q: '' };
function bindListSearch(inputSel, listSel, noneSel, keep) {
  const q = $(inputSel); if (!q) return;
  const run = () => { const t = (q.value || '').trim().toLowerCase(); if (keep) keep(q.value); let n = 0;
    document.querySelectorAll(listSel + ' > [data-q]').forEach(x => { const on = !t || x.dataset.q.includes(t); x.hidden = !on; if (on) n++; });
    const none = $(noneSel); if (none) none.hidden = n > 0; };
  q.addEventListener('input', run); run();
}

   ===================================================================== */
const DASH = { sort: 'unreviewed', filter: 'all', campus: '', allOpen: false, q: '' };
const CAMP = { v: (() => { try { return localStorage.getItem('cc_campus') === '부산' ? '부산' : '분당'; } catch (_) { return '분당'; } })() };
const campusOf = (r) => r.campus === '부산' ? '부산' : '분당';
function campusSeg() {
  return `<div class="seg" role="tablist" style="margin:4px 0 14px">${['분당', '부산'].map(c =>
    `<button role="tab" data-act="campus" data-v="${c}" aria-pressed="${CAMP.v === c}" aria-selected="${CAMP.v === c}">${campusLabel(c)}</button>`).join('')}</div>`;
}
function groupKey(r) {
  if (r.campus === '부산') return { key: 'busan', name: tr('부산 캠퍼스 (교역자 공동)', 'Busan campus (all staff)'), mode: 'leadership' };
  if (r.review_mode === 'none') return { key: 'none', name: tr('검토 없음 셀', 'Cells without review'), mode: 'none' };
  if (r.review_mode === 'senior_direct') return { key: 'senior', name: tr('스캇 브래너 담임 목사님 / 성희 브래너 사모님 직접 확인', 'Reviewed by Pastor Scott Brenner & Mrs. Sunghee Brenner'), mode: 'senior' };
  return { key: r.responsible_leadership_id || 'unassigned', name: r.responsible_leadership_name ? r.responsible_leadership_name : tr('담당 교역자 없음', 'No Leadership assigned'), mode: 'leadership' };
}
function groupRows(rows) {
  const g = new Map();
  for (const r of rows) {
    const k = groupKey(r);
    if (!g.has(k.key)) g.set(k.key, { ...k, rows: [] });
    g.get(k.key).rows.push(r);
  }
  return [...g.values()].map(x => {
    const sub = x.rows.filter(r => r.status === 'submitted');
    const rev = sub.filter(r => r.review_status === 'reviewed');
    return { ...x, n: x.rows.length, sub: sub.length, rev: rev.length, unrev: x.mode === 'none' ? 0 : sub.length - rev.length,
      missing: x.rows.length - sub.length, concern: x.rows.filter(isConcern).length, urgent: x.rows.filter(r => r.escalation_level === 'urgent').length };
  });
}
async function signals(week) {
  const w1 = addDays(week, -7), w2 = addDays(week, -14);
  const [prev, prev2, cells] = await Promise.all([rpc('get_week_status', { p_week_start: w1 }), rpc('get_week_status', { p_week_start: w2 }),
    q(sb.from('cells').select('id, created_at'))]);
  const made = {}; cells.forEach(c => { made[c.id] = kstDate(c.created_at); });
  const out = [];
  for (const r of prev) {
    const r2 = prev2.find(x => x.cell_id === r.cell_id);
    const existed = !made[r.cell_id] || made[r.cell_id] <= addDays(w2, 6);
    if (existed && r.is_missing && r2 && r2.is_missing) out.push({ cell: r.cell_name, text: tr('2주 연속 보고서 미제출', 'No report for 2 weeks in a row'), id: null });
  }
  const now = Date.now();
  for (const set of [prev, prev2]) for (const r of set) {
    if (r.status === 'submitted' && r.review_status === 'pending' && r.submitted_at && now - new Date(r.submitted_at).getTime() > 7 * 864e5)
      out.push({ cell: r.cell_name, text: weekLabel(r.week_start || w1) + tr(' 보고서, 제출 후 7일 넘게 확인 대기', ' report — awaiting review for over 7 days'), id: r.report_id });
  }
  try {
    const weeks = [week, w1, w2];
    const rows = await q(sb.from('attendance').select('member_id, status, weekly_reports!inner(week_start, cell_id, status)').in('weekly_reports.week_start', weeks).eq('weekly_reports.status', 'submitted'));
    const by = new Map();
    for (const a of rows) { const k = a.member_id; if (!by.has(k)) by.set(k, { cell: a.weekly_reports.cell_id, weeks: new Set() }); if (a.status === 'absent') by.get(k).weeks.add(a.weekly_reports.week_start); }
    const hit = [...by.entries()].filter(([, x]) => weeks.every(w => x.weeks.has(w)));
    if (hit.length) {
      const mem = await q(sb.from('cell_members').select('id, name, cell_id').in('id', hit.map(([id]) => id)));
      const cur = await rpc('get_week_status', { p_week_start: week });
      for (const [id, x] of hit) {
        const mm = mem.find(m => m.id === id); const c = cur.find(r => r.cell_id === x.cell);
        out.push({ cell: c ? c.cell_name : '', text: (mm ? mm.name : tr('셀원', 'Member')) + tr(' 3주 연속 결석', ' — absent 3 weeks in a row'), id: c ? c.report_id : null });
      }
    }
  } catch (e) { console.warn('결석 신호 계산 생략', e); }
  return out;
}

    const resp = (reach || []).filter(x => x.kind === 'staff').map(x => x.id);

      .sort((a, b) => (b.on - a.on) || a.name.localeCompare(b.name, 'ko'));
  }
  if (!people.length) { box.innerHTML = `<p class="small muted" style="margin:8px 0">${kind === 'leader' ? tr('이 셀에 지금 메시지를 받을 수 있는 셀리더가 없습니다.', 'No cell leader can receive messages for this cell right now.') : tr('메시지를 받을 수 있는 교역자가 없습니다.', 'No staff can receive messages right now.')}</p>`; return; }
  const hint = kind === 'leader'
    ? tr('셀리더께 메시지로 전해집니다. 이 이슈 내용이 함께 붙습니다.', 'Sent to the cell leader as a message, with this issue attached.')
    : (people.some(p => p.on) ? tr('이 셀의 담당 교역자를 먼저 골라 두었습니다. 다른 분을 더 고르셔도 됩니다.', 'The staff in charge of this cell is selected. You can add others.') : tr('전달할 교역자를 골라 주세요.', 'Choose who to forward to.'));
  box.innerHTML = `<div class="cellbox stack" style="margin-top:10px">
    <p class="tiny muted" style="margin:0">${hint}</p>
    <div class="chips">${people.map(p => `<button class="chip" data-act="iss-pick" data-id="${p.id}" aria-pressed="${p.on}">${esc(p.name)}</button>`).join('')}</div>
    <textarea rows="3" maxlength="3000" data-iss-text placeholder="${kind === 'leader' ? tr('예: 이 부분 함께 기도하겠습니다. 다음 주에 어떻게 지내시는지 알려 주세요.', 'e.g. We are praying with you. Please let us know how they are doing next week.') : tr('예: 이 성도님 한번 연락해 주실 수 있을까요?', 'e.g. Could you reach out to this person?')}"></textarea>
    <div class="row" style="gap:8px"><button class="btn sm" data-act="iss-send-go" data-id="${id}">${tr('보내기', 'Send')}</button><button class="btn sm ghost" data-act="iss-send-x" data-id="${id}">${tr('취소', 'Cancel')}</button></div></div>`;
  box.querySelector('[data-iss-text]')?.focus();
}
async function issSendGo(id) {
  const box = document.querySelector(`[data-iss-send="${id}"]`); const r = (ISS.rows || []).find(x => x.item_id === id); if (!box || !r) return;
  const to = [...box.querySelectorAll('[data-act=iss-pick][aria-pressed=true]')].map(b => b.dataset.id);
  const text = (box.querySelector('[data-iss-text]')?.value || '').trim();
  if (!to.length) return toast(tr('받는 분을 골라 주세요.', 'Please choose who to send to.'));
  if (!text) return toast(tr('보낼 내용을 적어 주세요.', 'Please write a message.'));
  const btn = box.querySelector('[data-act=iss-send-go]'); if (btn.disabled) return; btn.disabled = true;
  // 붙는 이슈 내용은 받는 분(셀리더·교역자)이 읽기 쉽게 한국어로
  const L0 = LANG; let block;
  try { LANG = 'ko'; block = '\n\n― 셀원 이슈 ―\n' + r.person_name + ' · ' + noteCat(r.category) + ' · ' + dayLabel(r.on_date) + ' · ' + (r.cell_name || '') + '\n'
    + (r.relation_kind && r.related_name ? relText(r.person_name, r.related_name, r.relation_kind) + '\n' : '') + (r.content || ''); } finally { LANG = L0; }
  const body = text + block;
  try {
    const res = await rpc('msg_start', { p_to: to, p_body: body.slice(0, 4000), p_report: null });
    msgNotify(res.post);
    box.innerHTML = `<p class="small" style="margin:8px 0;color:var(--ok, inherit)">${tr('보냈습니다. 「메시지」에서 답장을 보실 수 있습니다.', 'Sent. Replies will appear in Messages.')}</p>`; box.dataset.kind = '';
    toast(tr('보냈습니다.', 'Sent.'));
  } catch (e) { btn.disabled = false; toast(errText(e), 4500); }
}
async function viewIssues(app, v) {
  setTop(tr('셀원 이슈', 'Member issues'), true); renderTabs(true);
  const senior = isSenior();
  const scope = senior ? 'all' : ISS.scope;
  const allRows = (await rpc('issue_board', { p_weeks: ISS.weeks, p_scope: scope })) || [];
  ISS.rows = allRows;
  // 분당 / 부산 탭 (교역자 화면과 같은 선택을 함께 씀)
  const rows = allRows.filter(r => (r.campus === '부산' ? '부산' : '분당') === CAMP.v);
  // 한 기록에 유형을 여러 개 고른 경우 모든 유형에서 보이게. 관계 상대를 적은 기록은 「관계」에도 들어감
  const catsOf = (r) => { const c = (r.categories && r.categories.length ? r.categories : [r.category]).filter(Boolean); if (r.relation_kind && !c.includes('relationship')) c.push('relationship'); return [...new Set(c)]; };
  rows.forEach(r => { r.cats = catsOf(r); });
  const list = ISS.cat ? rows.filter(r => r.cats.includes(ISS.cat)) : rows;
  const cnt = {}; rows.forEach(r => r.cats.forEach(k => { cnt[k] = (cnt[k] || 0) + 1; }));
  let h = `<h1>${tr('셀원 이슈 보기', 'Member issues')}${info('issues')[0]}</h1>${info('issues')[1]}<p class="sub">${tr('셀보고서의 셀 케어 기록과 볼 수 있는 성도 동정을 모았습니다.', 'Care notes from cell reports and the pastoral notes you can see.')}</p>`;
  h += campusSeg();
  if (!senior) h += `<div class="seg" style="--n:2;margin-top:12px"><button data-act="iss-scope" data-v="mine" aria-pressed="${ISS.scope === 'mine'}">내 분파</button><button data-act="iss-scope" data-v="all" aria-pressed="${ISS.scope === 'all'}">교회 전체</button></div>`;
  h += `<div class="chips" style="margin-top:10px">${[4, 8, 12].map(w => `<button class="chip" data-act="iss-weeks" data-v="${w}" aria-pressed="${ISS.weeks === w}">${tr('최근 ' + w + '주', 'Last ' + w + ' wks')}</button>`).join('')}</div>`;
  h += `<div class="chips" style="margin-top:6px"><button class="chip" data-act="iss-cat" data-v="" aria-pressed="${!ISS.cat}">${tr('전체', 'All')} ${rows.length}</button>${NOTE_CAT_KEYS.filter(k => cnt[k] || k === 'relationship').map(k => `<button class="chip" data-act="iss-cat" data-v="${k}" aria-pressed="${ISS.cat === k}">${noteCat(k)} ${cnt[k] || 0}</button>`).join('')}</div>`;
  if (EN() && senior && rows.length) {
    if (ISS.txWeeks !== ISS.weeks && !ISS.txBusy) { ISS.tx = null; ISS.txErr = ''; }
    h += txStatus(ISS.tx, ISS.txBusy, ISS.txErr, 'iss-tx');
    autoTx(ISS.tx, ISS.txBusy, ISS.txErr, () => { if (S.view.name === 'issues') issuesTranslate(); });
  }
  h += `<div class="seg" style="--n:2;margin-top:10px"><button data-act="iss-view" data-v="person" aria-pressed="${ISS.view === 'person'}">${tr('사람별', 'By person')}</button><button data-act="iss-view" data-v="recent" aria-pressed="${ISS.view === 'recent'}">${tr('최근 순', 'Latest')}</button></div>`;

  const who = (r) => r.source === 'report' ? 'm:' + r.person_id : 'n:' + r.person_name;
  const relOther = (r) => r.related_name || '';
  const item = (r, asOther) => `<div class="note${r.attention ? ' attn' : ''}" style="margin-top:8px">
      <div class="row" style="flex-wrap:wrap;gap:6px">${(r.cats || [r.category]).map(k => `<span class="pill">${noteCat(k)}</span>`).join('')}${r.source === 'note' ? `<span class="pill accent">${tr('성도 동정', 'Pastoral note')}</span>` : ''}${asOther ? `<span class="pill warn">${tr('상대로 언급됨', 'Mentioned as the other person')}</span>` : ''}<span class="spacer"></span><span class="tiny muted">${dayLabel(r.on_date)}</span></div>
      ${r.relation_kind && relOther(r) ? `<div class="small" style="margin-top:4px"><b>${esc(relText(r.person_name, relOther(r), r.relation_kind))}</b></div>` : ''}
      <div class="small" style="margin-top:4px">${(() => { const en = EN() && ISS.tx && ISS.tx['iss:' + r.source + ':' + r.item_id]; return en ? nl2br(en) + '<div class="tiny muted" style="margin-top:2px">' + nl2br(r.content) + '</div>' : nl2br(r.content); })()}</div>
      <div class="tiny muted" style="margin-top:2px">${r.source === 'report' ? esc(r.cell_name || '') + (r.resp_name ? ' · ' + esc(r.resp_name) : '') + ' · ' + tr('셀리더 ', 'by ') + esc(r.author_name || '') : tr('쓴 분: ', 'By ') + esc(r.author_name || '')}</div>
      ${senior && r.source === 'report' && r.cell_id ? `<div class="row" style="gap:8px;margin-top:10px;flex-wrap:wrap"><button class="btn sm ghost" data-act="iss-send" data-id="${r.item_id}" data-v="leader">${tr('셀리더에게 코멘트', 'Comment to cell leader')}</button><button class="btn sm ghost" data-act="iss-send" data-id="${r.item_id}" data-v="staff">${tr('담당 교역자에게 전달', 'Forward to staff')}</button></div><div data-iss-send="${r.item_id}"></div>` : ''}</div>`;

  // 관계 한눈에: 누가 누구와
  const rels = list.filter(r => r.relation_kind && relOther(r));
  if (rels.length && (!ISS.cat || ISS.cat === 'relationship')) {
    const pairs = new Map();
    for (const r of rels) {
      const a = r.person_name, b = relOther(r);
      const key = r.relation_kind === 'mutual' ? 'M:' + [a, b].sort().join('|') : 'O:' + a + '|' + b;
      if (!pairs.has(key)) pairs.set(key, { a, b, kind: r.relation_kind, n: 0, last: r.on_date, cell: r.cell_name });
      const x = pairs.get(key); x.n++; if (r.on_date > x.last) x.last = r.on_date;
    }
    h += `<h2>${tr('관계 한눈에', 'Relationships at a glance')} <span class="muted" style="font-weight:400">${pairs.size}</span></h2><div class="card" style="padding:6px 14px">` +
      [...pairs.values()].sort((x, y) => (y.last > x.last ? 1 : -1)).map(x => `<div class="row" style="padding:10px 0;border-bottom:1px solid var(--line);gap:8px;flex-wrap:wrap">
        <b>${esc(x.a)} ${x.kind === 'mutual' ? '↔' : '→'} ${esc(x.b)}</b><span class="tiny muted">${x.kind === 'mutual' ? tr('서로 어려워함', 'mutual') : tr(x.b + ' 때문에 어려워함', 'troubled by ' + x.b)}</span>
        <span class="spacer"></span><span class="tiny muted">${x.cell ? esc(x.cell) + ' · ' : ''}${tr(x.n + '번', x.n + '×')} · ${dayLabel(x.last)}</span></div>`).join('') + '</div>';
  }

  if (!list.length) { h += `<p class="empty" style="margin-top:16px">${tr('이 기간에 기록된 이슈가 없습니다.', 'No issues in this period.')}</p>`; app.innerHTML = h; return; }
  if (ISS.view === 'recent') {
    h += `<h2>${tr('최근 순', 'Latest')} <span class="muted" style="font-weight:400">${list.length}</span></h2><div class="stack" style="gap:0">` +
      list.map(r => `<div class="card" style="margin-top:8px"><b>${esc(r.person_name)}</b>${item(r, false)}</div>`).join('') + '</div>';
  } else {
    const groups = new Map();
    const add = (k, name, cell, r, asOther) => { if (!groups.has(k)) groups.set(k, { name, cell, items: [] }); groups.get(k).items.push({ r, asOther }); };
    for (const r of list) add(who(r), r.person_name, r.cell_name, r, false);
    // 관계 상대도 그 사람 묶음에 함께 보이게
    for (const r of rels) {
      const k = r.related_member_id ? 'm:' + r.related_member_id : 'n:' + relOther(r);
      const k2 = groups.has(k) ? k : [...groups.keys()].find(g => groups.get(g).name === relOther(r)) || k;
      add(k2, relOther(r), groups.get(k2)?.cell || (r.related_member_id ? r.cell_name : ''), r, true);
    }
    const arr = [...groups.entries()].map(([k, g]) => ({ k, ...g, last: g.items.reduce((m, x) => x.r.on_date > m ? x.r.on_date : m, '') }))
      .sort((a, b) => b.items.length - a.items.length || (b.last > a.last ? 1 : -1));
    h += `<h2>${tr('사람별', 'By person')} <span class="muted" style="font-weight:400">${arr.length}${tr('명', '')}</span></h2><div class="stack">` + arr.map(g => {
      const cats = [...new Set(g.items.flatMap(x => x.r.cats || [x.r.category]))];
      // 하나만 열림 (다른 카드를 열면 닫힘). 열고 닫을 때 다시 불러오지 않고 화면에서 바로 펼침
      const open = ISS.open === g.k;
      return `<div class="card" data-iss-card="${esc(g.k)}"><button class="row" data-act="iss-open" data-k="${esc(g.k)}" aria-expanded="${open}" style="all:unset;display:flex;width:100%;gap:8px;align-items:center;flex-wrap:wrap;cursor:pointer">
          <b style="font-size:1.05em">${esc(g.name)}</b><span class="tiny muted">${esc(g.cell || '')}</span><span class="spacer"></span>
          ${cats.map(c => `<span class="pill">${noteCat(c)}</span>`).join('')}<span class="tiny muted">${tr(g.items.length + '건', g.items.length + '')} <span data-iss-arrow>${open ? '▲' : '▼'}</span></span></button>
        <div data-iss-body${open ? '' : ' hidden'}>${g.items.sort((a, b) => (b.r.on_date > a.r.on_date ? 1 : -1)).map(x => item(x.r, x.asOther)).join('')}</div></div>`;
    }).join('') + '</div>';
  }
  app.innerHTML = h;
}

const lrKey = (kind, id) => kind + ':' + id;
async function lrLoad(week) {

function noteFormSync() {

async function noteSave() {

    toast(tr('저장했습니다.', 'Saved.')); NOTE.form = null; NOTE.tx = null; NOTE.busy = false; back();

async function noteTranslate() {
  NOTE.txBusy = true; NOTE.txErr = ''; render();
  try {
    const { data } = await sb.auth.getSession();
    const r = await fetch('api/translate', { method: 'POST', headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + (data.session?.access_token || '') }, body: JSON.stringify({ notes: true }) });
    const j = await r.json(); if (!r.ok) throw new Error(j.error || r.status);

  finally { NOTE.txBusy = false; render(); }
}

async function msgSend(report) {

  if (!body) return toast(tr('보낼 내용을 적어 주세요.', 'Please write a message.'));
  if (MSG.busy) return; MSG.busy = true;
  try {
    const r = await rpc('msg_start', { p_to: MSG.sel, p_body: body, p_report: report || null });
    msgNotify(r.post); MSG.sel = []; MSG.draft = '';
    toast(tr('보냈습니다.', 'Sent.'));
    MSG.busy = false;
    return go({ name: 'thread', id: r.thread }, { replace: true });
  } catch (e) { toast(errText(e), 4500); }
  MSG.busy = false; render();
}
async function msgReply(id) {
  const body = (MSG.reply || '').trim();
  if (!body) return toast(tr('보낼 내용을 적어 주세요.', 'Please write a message.'));
  if (MSG.busy) return; MSG.busy = true;
  try { const post = await rpc('msg_post', { p_thread: id, p_body: body }); msgNotify(post); MSG.reply = ''; }
  catch (e) { toast(errText(e), 4500); }
  MSG.busy = false; render();
}
