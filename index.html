const ADMIN = { open: 'requests', pick: {}, mail: null, stop: null, busy: false };
const normName = (t) => String(t || '').toLowerCase().replace(/\([^)]*\)|\s/g, '').replace(/(목사님|전도사님|간사님|사모님|셀리더님|집사님|권사님|장로님|성도님|목사|전도사|간사|사모|셀리더|집사|권사|장로|성도|님)$/, '');
async function loadAdminData() {
  const today = S.ctx.today;
  const cur = (x) => x.start_date <= today && (!x.end_date || x.end_date >= today);
  const [reqs, people, roles, cells, leaders, asg, members, closed] = await Promise.all([
    q(sb.from('access_requests').select('id, name, email, matched_profile_id, status, created_at').eq('status', 'pending').order('created_at')),
    q(sb.from('profiles').select('id, name, email, auth_user_id, active').order('name')),
    q(sb.from('user_roles').select('user_id, role')),
    q(sb.from('cells').select('id, name, campus, review_mode, active').eq('active', true).order('name')),
    q(sb.from('cell_leaders').select('cell_id, user_id, start_date, end_date, is_primary')),
    q(sb.from('leadership_assignments').select('cell_id, leadership_user_id, start_date, end_date')),
    q(sb.from('cell_members').select('cell_id, name, member_type, active, joined_at, left_at').eq('active', true)),
    q(sb.from('cells').select('id, name, campus').eq('active', false).order('name'))
  ]);
  const P = new Map(people.map(p => [p.id, { ...p, roles: [], leads: [], oversees: [] }]));
  roles.forEach(r => P.get(r.user_id)?.roles.push(r.role));
  const C = new Map(cells.map(c => [c.id, { ...c, leaders: [], resp: null, members: [] }]));
  leaders.filter(cur).sort((a, b) => b.is_primary - a.is_primary).forEach(l => { const c = C.get(l.cell_id), p = P.get(l.user_id); if (c && p) { c.leaders.push(p); p.leads.push(c); } });
  asg.filter(cur).forEach(a => { const c = C.get(a.cell_id), p = P.get(a.leadership_user_id); if (c && p) { c.resp = p; p.oversees.push(c); } });
  members.filter(m => m.member_type === 'member' && (!m.left_at || m.left_at >= today) && (!m.joined_at || m.joined_at <= today))
    .forEach(m => C.get(m.cell_id)?.members.push(m.name));
  return { reqs, P, C, closed };
}

function personSummary(p) {
  const bits = [];
  if (p.leads.length) bits.push(p.leads.map(c => c.name).join(', ') + tr(' 셀리더', ' · cell leader'));
  if (p.oversees.length) bits.push(tr('교역자 · 담당 셀 ' + p.oversees.length + '개', 'Leadership · ' + p.oversees.length + ' cells'));
  const extra = p.roles.filter(r => r !== 'leadership').map(r => (EN() ? ROLE_EN : ROLE_KO)[r]);

}

  return h;

    case 'nt-del': try { await rpc('pastoral_note_delete', { p_id: NOTE.form.id }); NOTE.form = null; toast(tr('지웠습니다.', 'Deleted.')); return back(); } catch (e) { return toast(errText(e)); }
    case 'open-members': Object.assign(MEM, { edit: null, confirm: null }); Object.assign(CL, { rm: null, asg: false, closeAsk: false, next: false }); return go({ name: 'members', cell: d.cell, cellName: d.name });
    case 'mem-add': { const nm = ($('#mem-new')?.value || '').trim(); if (!nm) return toast(tr('이름을 적어 주세요.', 'Please enter a name.')); return memAct('member_add', { p_cell: S.view.cell, p_name: nm }, tr(nm + '님을 셀원으로 추가했습니다.', 'Added ' + nm + '.')); }
    case 'mem-confirm': MEM.confirm = d.id; MEM.del = null; return render();
    case 'mem-sep': return memAct('member_set_separate', { p_member: d.id, p_on: d.v === '1' }, d.v === '1' ? tr('따로 만나는 셀원으로 바꿨습니다.', 'Now meets separately.') : tr('모임 셀원으로 바꿨습니다.', 'Now meets with the group.'));
    case 'mem-del-ask': MEM.del = d.id; MEM.confirm = null; return render();
    case 'mem-del': return memAct('member_delete', { p_member: d.id }, tr('셀원 명단에서 삭제했습니다.', 'Deleted.'));
    case 'mem-cancel': MEM.confirm = null; MEM.del = null; MEM.move = null; return render();
    case 'mem-move-ask': MEM.move = d.id; MEM.confirm = null; MEM.del = null; return render();
    case 'mem-move': { const to = $('#mem-move-to')?.value; if (!to) return toast(tr('옮길 셀을 골라 주세요.', 'Please choose a cell.'));
      const cn = (MEM.targets.find(c => c.id === to) || {}).name || '';
      MEM.move = null; return memAct('member_move', { p_member: d.id, p_target: to }, tr(cn + '로 옮겼습니다.', 'Moved to ' + cn + '.')); }
    case 'mem-leave': return memAct('member_leave', { p_member: d.id }, tr('명단에서 내렸습니다.', 'Removed.'));
    case 'mem-restore': return memAct('member_restore', { p_member: d.id }, tr('다시 출석 명단에 올렸습니다.', 'Added back.'));
    case 'mem-hold': return memAct('member_hold', { p_member: d.id }, tr('보류로 옮겼습니다. 아래 「보류 중인 셀원」에 있습니다.', 'Put on hold.'));
    case 'sc-save': return memAct('cell_set_schedule', { p_cell: d.cell, p_day: $('#sc-day').value, p_time: $('#sc-time').value, p_place: $('#sc-place').value }, tr('모임 시간·장소를 저장했습니다.', 'Saved.'));
    case 'mem-register': return memAct('register_member', { p_member: d.id }, tr('정식 셀원으로 등록했습니다.', 'Registered as a member.'));
    case 'push-off': return pushOff();
    case 'push-test': return pushTest();
    case 'ad-approve': return adminDecide(d.id, true);
    case 'ad-mail-open': ADMIN.mail = { id: d.id, value: d.email || '' }; return render();
    case 'ad-mail-cancel': ADMIN.mail = null; return render();
    case 'ad-mail-save': return adminChangeEmail(d.id, ADMIN.mail?.value);
    case 'ad-mail-swap': return adminChangeEmail(d.id, d.email);
    case 'ad-stop-ask': ADMIN.stop = d.id; return render();
    case 'ad-stop-cancel': ADMIN.stop = null; return render();
    case 'ad-stop': return adminAct('admin_set_profile_active', { p_profile: d.id, p_active: false }, tr('사용 중지했습니다.', 'Deactivated.'));
    case 'ad-restart': return adminAct('admin_set_profile_active', { p_profile: d.id, p_active: true }, tr('다시 사용할 수 있게 했습니다.', 'Reactivated.'));
    case 'cell-reopen': return adminAct('cell_set_active', { p_cell: d.id, p_active: true }, tr('셀을 다시 열었습니다.', 'Cell reopened.'));
    case 'nc-create': {
      const name = $('#nc-name')?.value.trim() || '';
      if (name.length < 2) return toast(tr('셀 이름을 적어 주세요.', 'Please enter a cell name.'));
      return adminAct('cell_create', { p_name: name, p_campus: $('#nc-campus').value, p_senior: $('#nc-review').value === '1', p_saturday: $('#nc-sat').checked }, tr(name + '을 만들었습니다.', 'Created ' + name + '.'));
    }
    case 'cl-when': CL.next = d.v === '1'; return render();
    case 'cl-cancel': Object.assign(CL, { rm: null, asg: false, closeAsk: false }); return render();
    case 'cl-rm-ask': Object.assign(CL, { rm: d.id, next: false }); return render();
    case 'cl-rm': return clAct('cell_leader_remove', { p_row: d.id, p_next: CL.next }, tr('셀리더에서 뺐습니다.', 'Removed.'));
    case 'cl-primary': return clAct('cell_leader_primary', { p_row: d.id }, tr('대표 셀리더를 바꿨습니다.', 'Lead changed.'));
    case 'cl-add': {
      const name = $('#cl-new')?.value.trim() || '';
      if (name.length < 2) return toast(tr('셀리더 이름을 적어 주세요.', 'Please enter a name.'));
      return clAct('cell_leader_add', { p_cell: d.cell, p_name: name, p_next: CL.next, p_primary: $('#cl-primary').checked }, tr(name + '님을 셀리더로 넣었습니다.', 'Added ' + name + '.'));
    }
    case 'cl-asg-open': Object.assign(CL, { asg: true, next: false, asgVal: '' }); return render();
    case 'cl-asg-save': {
      const v = $('#cl-asg')?.value; if (!v) return toast(tr('새 담당을 골라 주세요.', 'Please choose.'));
      return clAct('cell_set_leadership', { p_cell: d.cell, p_user: v === 'senior' ? null : v, p_next: CL.next, p_senior: v === 'senior' }, tr('담당을 바꿨습니다.', 'Updated.'));
    }
    case 'cl-close-ask': CL.closeAsk = true; return render();
    case 'cl-close': return clAct('cell_set_active', { p_cell: d.cell, p_active: false }, tr('셀을 닫았습니다.', 'Cell closed.'), () => back());
    case 'ad-reject': return adminDecide(d.id, false);
    case 'ad-section': ADMIN.open = ADMIN.open === d.v ? '' : d.v; return render();
    case 'start-report': return startReport(d.cell, d.week);
    case 'open-report': return go({ name: 'report', id: d.id });
    case 'open-editor': return go({ name: 'report', id: d.id }, { replace: true });
    case 'open-detail': return go({ name: 'detail', id: d.id });
    case 'open-group': return go({ name: 'group', key: d.key, week: d.week });
    case 'lh-week': return go({ name: 'leadershipHome', week: d.week }, { replace: true });
    case 'ad-week': ADMIN.week = d.week; return render();
    case 'demo': return demoStart(d.v);
    case 'demo-end': return demoEnd();
    case 'db-week': return go({ name: 'dashboard', week: d.week }, { replace: true });
    case 'db-filter': DASH.filter = d.v; return render();
    case 'db-campus': DASH.campus = d.v || ''; return render();
    case 'msg-open': return go({ name: 'messages' });
    case 'dg-open': DIG.data = {}; DIG.lang = null; return go({ name: 'digest' });
    case 'dg-lang': DIG.lang = d.v; return render();
    case 'dg-test': {
      DIG.busy = true; render();
      try { const { data } = await sb.auth.getSession(); const r = await fetch('api/weekly-digest', { method: 'POST', headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + (data.session?.access_token || '') }, body: JSON.stringify({ test: true }) }); const j = await r.json(); toast(j.sent ? tr(j.sent + '로 보냈습니다.', 'Sent to ' + j.sent) : (j.skipped || j.error || 'error'), 4500); }
      catch (e) { toast(errText(e), 4500); }
      DIG.busy = false; return render();
    }
    case 'msg-new': MSG.sel = []; MSG.draft = ''; return go({ name: 'msgNew', report: d.report || null, label: d.label || '' });
    case 'msg-pick': { const i = MSG.sel.indexOf(d.id); if (i >= 0) MSG.sel.splice(i, 1); else MSG.sel.push(d.id); el.setAttribute('aria-pressed', i < 0); const c = $('#msg-count'); if (c) c.textContent = MSG.sel.length ? tr(MSG.sel.length + '분 선택', MSG.sel.length + ' selected') : ''; return; }
    case 'msg-send': return msgSend(d.report);
    case 'msg-thread': MSG.reply = ''; return go({ name: 'thread', id: d.id });
    case 'msg-reply': return msgReply(d.id);
    case 'campus': CAMP.v = d.v === '부산' ? '부산' : '분당'; try { localStorage.setItem('cc_campus', CAMP.v); } catch (_) {} return render();
    case 'rv-level': DETAIL.level = d.v; document.querySelectorAll('[data-act=rv-level]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.v === d.v))); return;
    case 'rv-ok': return reviewOk();
    case 'rve-open': { const x = RVE.list.find(r => r.id === d.id); if (!x) return; Object.assign(RVE, { id: x.id, note: x.review_note || '', level: x.escalation_level }); return render(); }
    case 'rve-level': { const t = $('#rve-note'); if (t) RVE.note = t.value; RVE.level = d.v; return render(); }
    case 'rve-cancel': RVE.id = null; return render();
    case 'rve-save': { const t = $('#rve-note'); if (t) RVE.note = t.value; return reviewEditSave(); }
    case 'rv-revopen': DETAIL.revOpen = true; return render();
    case 'rep-reopen-ask': DETAIL.reopen = d.id; return render();
    case 'rep-reopen-cancel': DETAIL.reopen = null; return render();
    case 'rep-reopen': return reopenReport(d.id);
    case 'rv-revclose': DETAIL.revOpen = false; return render();
    case 'rv-send': return reviewRevise();
  }
  if (!E) return;
  const m = E.m;
  switch (a) {
    case 'ed-set': {
      const v = d.v === 'true' ? true : d.v === 'false' ? false : d.v; m[d.k] = v;
      if (d.k === 'meeting_held' && v === true && !m.meeting_date) { const t = S.ctx.today; m.meeting_date = weekOK(t) ? t : ''; }
      return markDirty(true);
    }
    case 'ed-att': { const cur = m.att[d.id] || {}; m.att[d.id] = { status: d.v, absence_reason: d.v === 'absent' ? (cur.absence_reason || '') : '' }; return markDirty(true); }
    case 'ed-allpresent': E.roster.filter(x => x.listed && !x.separate).forEach(x => { m.att[x.member_id] = { status: 'present', absence_reason: '' }; }); return markDirty(true);
    case 'ed-pu': { const cur = m.pu[d.id] || {}; m.pu[d.id] = { status: cur.status === d.v ? null : d.v, note: cur.note || '' }; if (!m.pu[d.id].status) delete m.pu[d.id]; return markDirty(true); }
    case 'ed-care': m.hasCare = d.v === 'true'; if (m.hasCare && !m.notes.length) m.notes.push({ member_id: '', categories: [], prayer: '', content: '', attention: false }); return markDirty(true);
    case 'ed-addnote': m.notes.push({ member_id: '', categories: [], prayer: '', content: '', attention: false }); return markDirty(true);
    case 'ed-delnote': m.notes.splice(+d.i, 1); if (!m.notes.length) m.hasCare = false; return markDirty(true);
    case 'ed-cat': { const cs = m.notes[+d.i].categories; const k = cs.indexOf(d.v); if (k >= 0) cs.splice(k, 1); else cs.push(d.v); return markDirty(true); }
    case 'ed-relkind': m.notes[+d.i].relation_kind = d.v; return markDirty(true);
    case 'ed-addopen': E.showAdd = true; renderEditor(); setTimeout(() => $('#new-name')?.focus(), 0); return;
    case 'ed-addcancel': E.showAdd = false; E.newName = ''; return renderEditor();
    case 'ed-addnew': {
      const nm = (E.newName || '').trim(); if (!nm) { toast('이름을 적어 주세요.'); return; }
      try {
        await save();
        const id = await rpc('add_attendee', { p_report: E.id, p_name: nm, p_register: !!E.newReg });
        const had = E.roster.find(x => x.member_id === id);
        if (had) { if (E.newReg) had.listed = true; } else E.roster.push({ member_id: id, name: nm, type_in_week: E.newReg ? 'member' : 'visitor', member_type_now: E.newReg ? 'member' : 'visitor', attendance: 'present', listed: !!E.newReg });
        m.att[id] = { status: 'present', absence_reason: '' };
        E.showAdd = false; E.newName = ''; E.newReg = false;
        toast(had ? nm + '님은 이미 명단에 있어서 그대로 출석으로 표시했습니다.' : nm + '님을 ' + (E.roster[E.roster.length - 1].listed ? '정식 셀원으로 등록했습니다.' : '이번 주 방문자로 추가했습니다.'));
        return markDirty(true);
      } catch (err) { toast(errText(err), 5000); return; }
    }
    case 'ed-revisit': {
      const vv = E.visitors.find(x => x.member_id === d.id); if (!vv) return;
      E.roster.push({ member_id: vv.member_id, name: vv.name, type_in_week: 'visitor', member_type_now: 'visitor', attendance: 'present', listed: false });
      m.att[vv.member_id] = { status: 'present', absence_reason: '' }; return markDirty(true);
    }
    case 'ed-prev': if (E.step > 0) { E.step--; E.confirm = false; save(); renderEditor(); window.scrollTo(0, 0); } return;
    case 'ed-next': if (E.step < STEPS.length - 1) { E.step++; save(); renderEditor(); window.scrollTo(0, 0); } return;
    case 'ed-step': E.step = +d.v; E.confirm = false; renderEditor(); window.scrollTo(0, 0); return;
    case 'ed-confirm': { const bad = validateForSubmit(); if (bad) { E.step = bad[0]; renderEditor(); toast(bad[1], 4000); return; } E.confirm = true; renderEditor(); setTimeout(() => window.scrollTo(0, document.body.scrollHeight), 0); return; }
    case 'ed-confirm-cancel': E.confirm = false; return renderEditor();
    case 'ed-submit': return submitReport();
    case 'ed-move-cancel': E.m.meeting_date = ''; return markDirty(true);
    case 'ed-move': {
      if (E.moving) return; E.moving = true; renderEditor();
      const nw = mondayOf(E.m.meeting_date);
      try {
        await save();
        await rpc('move_report_week', { p_report: E.id, p_week: nw, p_version: E.version });
        const step = E.step; E = await loadEditor(E.id); E.step = step;
        toast(weekLabel(nw) + ' 보고서로 옮겼습니다.'); renderEditor(); window.scrollTo(0, 0);
      } catch (e) { E.moving = false; toast(errText(e), 5000); renderEditor(); }
      return;
    }
    case 'ed-reload': { const step = E.step; E = await loadEditor(E.id); E.step = step; return renderEditor(); }
  }
});
document.addEventListener('change', (e) => { if (e.target.id === 'db-sort') { DASH.sort = e.target.value; render(); } });
window.addEventListener('beforeunload', (e) => { if (E && (E.dirty || E.saving)) { save(); e.preventDefault(); e.returnValue = ''; } });
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden' && E && E.dirty) save(); });

/* =====================================================================
   시작
   ===================================================================== */
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
let started = false;
sb.auth.onAuthStateChange((event, session) => {
  if (event === 'SIGNED_OUT') { if (started) { S.ctx = null; viewLogin(); } return; }
  if ((event === 'SIGNED_IN' || event === 'INITIAL_SESSION') && session && !S.ctx) {
    started = true;
    if (location.hash && /access_token|error/.test(location.hash)) history.replaceState(null, '', location.pathname);
    setTimeout(() => loadContext().catch(err => { $('#app').innerHTML = '<div class="banner danger"><b>불러오지 못했습니다.</b>' + esc(errText(err)) + '</div>'; }), 0);
  } else if (event === 'INITIAL_SESSION' && !session) {
    started = true;
    const hashErr = /error_description=([^&]+)/.exec(location.hash);
    if (hashErr) { LOGIN.msg = /expired|invalid/i.test(decodeURIComponent(hashErr[1])) ? '로그인 링크가 만료되었거나 이미 사용되었습니다. 메일을 다시 받아 주세요.' : decodeURIComponent(hashErr[1]).replace(/\+/g, ' '); history.replaceState(null, '', location.pathname); }
    viewLogin();
  }
});
</script>
</body>
</html>
