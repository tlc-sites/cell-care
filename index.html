  /* 색: 교회 로고의 남색(#20365B)과 회청색(#4E6285)에 맞춤 */
  --bg: #F3F5F9;
  --card: #FFFFFF;
  --ink: #1A2436;
  --muted: #586378;
  --line: #D8DEE9;
  --accent: #20365B;
  --accent-mid: #4E6285;
  --accent-ink: #FFFFFF;
  --accent-soft: #E6EBF3;
  --focus: #8EA3C6;
  --warn: #9C5212;
  --warn-soft: #FBEEDF;
  --ok: #2B7150;
  --ok-soft: #E2F1E7;
  --danger: #A0372A;
  --danger-soft: #FBE7E3;
  --font-display: "Gowun Batang", "Noto Serif KR", serif;
  --font-body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg); color: var(--ink);
  font-family: var(--font-body); font-size: 17px; line-height: 1.6;
  -webkit-text-size-adjust: 100%;
  padding-bottom: calc(88px + env(safe-area-inset-bottom, 0px));
}
button, input, textarea, select { font: inherit; color: inherit; }
.wrap { max-width: 640px; margin: 0 auto; padding-inline: 16px; padding-block: 12px 24px; }
header.top {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
  background: var(--bg); border-bottom: 1px solid var(--line);
}
header.top .in { max-width: 640px; margin: 0 auto; padding: 10px 16px; display: flex; align-items: center; gap: 8px; min-height: 56px; }
header.top .title { font-weight: 600; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.brand { display: inline-flex; align-items: center; gap: 8px; font-family: var(--font-display); font-size: 19px; color: var(--accent); }
.brand img { width: 30px; height: 27px; display: block; }
.login-logo { display: block; width: 120px; height: auto; margin: 8px auto 4px; }
.iconbtn { border: 0; background: transparent; min-width: 44px; min-height: 44px; border-radius: 10px; cursor: pointer; font-size: 15px; color: var(--muted); padding: 0 8px; }
.iconbtn:hover { background: var(--accent-soft); color: var(--accent); }
h1 { font-family: var(--font-display); font-weight: 700; font-size: 26px; line-height: 1.35; margin: 12px 0 4px; text-wrap: balance; }
h2 { font-size: 18px; font-weight: 600; margin: 28px 0 10px; }
h3 { font-size: 17px; font-weight: 600; margin: 0 0 6px; }
.sub { color: var(--muted); margin: 0 0 8px; font-size: 15px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 18px; }
.stack { display: grid; gap: 12px; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.spacer { flex: 1; }
.muted { color: var(--muted); }
.small { font-size: 15px; }
.tiny { font-size: 13px; }
.num { font-variant-numeric: tabular-nums; }
.btn {
  display: flex; align-items: center; justify-content: center; gap: 8px;
  width: 100%; min-height: 54px; padding: 12px 18px; border-radius: 12px;
  border: 1px solid var(--accent); background: var(--accent); color: var(--accent-ink);
  font-weight: 600; font-size: 17px; cursor: pointer; text-align: center;
}
.btn.ghost { background: var(--card); color: var(--accent); }
.btn.quiet { background: transparent; border-color: var(--line); color: var(--ink); font-weight: 500; }
.btn.warn { background: var(--warn); border-color: var(--warn); }
.btn.sm { min-height: 44px; font-size: 15px; width: auto; padding: 8px 14px; }
.btn:disabled { opacity: .5; cursor: default; }
.btn:focus-visible, .seg button:focus-visible, .chip:focus-visible, .iconbtn:focus-visible, .link:focus-visible, .listitem:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
.link { background: none; border: 0; color: var(--accent); text-decoration: underline; cursor: pointer; padding: 8px 0; font-size: 15px; }
.pill { display: inline-flex; align-items: center; gap: 4px; padding: 2px 10px; border-radius: 999px; font-size: 14px; font-weight: 500; background: #EDF0F5; color: var(--muted); white-space: nowrap; }
.pill.warn { background: var(--warn-soft); color: var(--warn); }
.pill.ok { background: var(--ok-soft); color: var(--ok); }
.pill.danger { background: var(--danger-soft); color: var(--danger); }
.pill.accent { background: var(--accent-soft); color: var(--accent); }
.banner { border-radius: 12px; padding: 14px 16px; background: var(--accent-soft); color: var(--ink); }
.banner.warn { background: var(--warn-soft); }
.banner.danger { background: var(--danger-soft); }
.banner b { display: block; margin-bottom: 2px; }
label.field { display: grid; gap: 6px; font-weight: 500; }
input[type=text], input[type=email], input[type=date], textarea, select {
  width: 100%; min-height: 50px; padding: 12px 14px; border: 1px solid var(--line); border-radius: 12px; background: #fff;
}
textarea { min-height: 120px; resize: vertical; line-height: 1.6; }
input:focus, textarea:focus, select:focus { outline: 2px solid var(--focus); border-color: var(--accent); }
.seg { display: grid; grid-template-columns: repeat(var(--n, 2), 1fr); gap: 8px; }
.seg button { min-height: 50px; border-radius: 12px; border: 1px solid var(--line); background: #fff; cursor: pointer; font-weight: 500; padding: 6px 8px; }
.seg button[aria-pressed=true] { background: var(--accent); border-color: var(--accent); color: #fff; }
.seg.att button[aria-pressed=true][data-v=absent] { background: var(--warn); border-color: var(--warn); }
.seg.att button[aria-pressed=true][data-v=unknown] { background: #6A7385; border-color: #6A7385; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { min-height: 40px; padding: 6px 14px; border-radius: 999px; border: 1px solid var(--line); background: #fff; cursor: pointer; font-size: 15px; }
.chip[aria-pressed=true] { background: var(--accent); border-color: var(--accent); color: #fff; }
.check { display: flex; gap: 10px; align-items: flex-start; cursor: pointer; padding: 6px 0; }
.check input { width: 22px; height: 22px; margin-top: 2px; accent-color: var(--accent); flex: none; }
.steps { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; margin: 8px 0 18px; }
.steps div { text-align: center; font-size: 13px; color: var(--muted); padding-top: 8px; border-top: 4px solid var(--line); }
.steps div.done { border-color: #93A6C6; color: var(--ink); }
.steps div.now { border-color: var(--accent); color: var(--accent); font-weight: 600; }
.member { display: grid; gap: 8px; padding: 14px 0; border-bottom: 1px solid var(--line); }
.member:last-child { border-bottom: 0; }
.member .nm { font-weight: 600; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.footer-bar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 6;
  background: rgba(243,245,249,.97); border-top: 1px solid var(--line);
  padding: 10px 16px calc(10px + env(safe-area-inset-bottom, 0px));
}
.footer-bar .in { max-width: 640px; margin: 0 auto; display: grid; gap: 6px; }
.footer-bar .btns { display: grid; grid-template-columns: 1fr 2fr; gap: 10px; }
.savestate { font-size: 13px; color: var(--muted); text-align: center; min-height: 18px; }
nav.tabs {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 4; background: var(--accent);
  padding-bottom: env(safe-area-inset-bottom, 0px); box-shadow: 0 -4px 14px rgba(32,54,91,.18);
}
nav.tabs .in { max-width: 640px; margin: 0 auto; display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 6px; padding: 7px 8px; }
nav.tabs button { min-height: 58px; border: 0; border-radius: 14px; background: transparent; cursor: pointer; color: rgba(255,255,255,.72);
  font-size: 13.5px; font-weight: 600; padding: 4px 4px; line-height: 1.2; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; }
nav.tabs button svg { width: 23px; height: 23px; stroke: currentColor; fill: none; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }
nav.tabs button:active { transform: scale(.97); }
nav.tabs button[aria-current=page] { background: #fff; color: var(--accent); box-shadow: 0 2px 8px rgba(0,0,0,.18); }
.listitem { display: grid; gap: 4px; padding: 14px 16px; border: 1px solid var(--line); border-radius: 12px; background: var(--card); cursor: pointer; text-align: left; width: 100%; }
.listitem:hover { border-color: #B4C0D6; }
.listitem .top { display: flex; gap: 8px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.stat { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; }
.stat .v { font-size: 22px; font-weight: 600; font-variant-numeric: tabular-nums; line-height: 1.3; }
.stat .k { font-size: 13px; color: var(--muted); }
.stat.warn .v { color: var(--warn); }
.bar { display: grid; grid-template-columns: 64px 1fr auto; gap: 10px; align-items: center; font-size: 14px; }
.bar .track { height: 10px; border-radius: 999px; background: #E5E9F0; overflow: hidden; }
.bar .fill { height: 100%; border-radius: 999px; background: var(--accent); }
.bar .fill.rv { background: var(--accent-mid); }
.bar .fill.low { background: var(--warn); }
.weeknav { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: 4px 0 12px; }
.weeknav b { font-weight: 600; }
.summary dt { color: var(--muted); font-size: 14px; margin-top: 10px; }
.summary dd { margin: 2px 0 0; }
.note { border-left: 4px solid var(--line); padding: 4px 0 4px 12px; margin: 8px 0; }
.note.attn { border-left-color: var(--warn); }
.toast {
  position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(92px + env(safe-area-inset-bottom, 0px)); z-index: 20;
  background: var(--ink); color: #fff; padding: 12px 18px; border-radius: 12px; max-width: calc(100% - 32px); font-size: 15px;
}
.center { text-align: center; }
.empty { text-align: center; color: var(--muted); padding: 24px 8px; }
details.cellbox { border-top: 1px solid var(--line); padding: 10px 0; }
details.cellbox:first-of-type { border-top: 0; }
details.cellbox summary { cursor: pointer; min-height: 32px; }
.ref { background: var(--accent-soft); border-radius: 10px; padding: 8px 10px; }
.ref > div { margin-top: 2px; }
.loading { text-align: center; color: var(--muted); padding: 48px 8px; }
.sel { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
@media (max-width: 380px) { .stats { grid-template-columns: repeat(2, 1fr); } h1 { font-size: 23px; } }
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; } }
</style>

};

/* ---------- 영어 화면 (Senior Pastor용 토글, 이 휴대폰에 저장) ---------- */
let LANG = (() => { try { return localStorage.getItem('cc_lang') === 'en' ? 'en' : 'ko'; } catch (_) { return 'ko'; } })();
const EN = () => LANG === 'en';
const tr = (ko, en) => (EN() ? en : ko);
const L_EN = {
  status: { draft: 'Draft', submitted: 'Submitted', revision_requested: 'Revision requested' },
  escalation: { normal: 'Normal', attention: 'Needs attention', pastoral: 'Pastoral follow-up', urgent: 'Urgent' },
  message: { none: 'None', prayer: 'Prayer needed', contact: 'Contact or counseling needed', advice: 'Leadership advice needed', share_up: 'Share with senior leadership' },
  att: { present: 'Present', absent: 'Absent', unknown: 'Not checked' },
  care: { update: 'Update', prayer: 'Prayer request', faith: 'Faith', health: 'Health', family: 'Family', work_school: 'Work / School',

  prayer: { ongoing: 'Ongoing', answered: 'Answered', closed: 'Closed' }
};
const LX = (group, key) => ((EN() ? L_EN : L)[group] || {})[key] ?? (L[group] || {})[key] ?? '';
const MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
function langAllowed() { return !S.ctx || isSenior(); }
function setLang(l) {
  LANG = l === 'en' ? 'en' : 'ko'; document.documentElement.lang = LANG;
  try { localStorage.setItem('cc_lang', LANG); } catch (_) { }
  PUSH.synced = false;
  if (S.ctx) render(); else viewLogin();
}

/* ---------- 작은 도구들 ---------- */
const $ = (s, r = document) => r.querySelector(s);
const esc = (v) => String(v ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const nl2br = (v) => esc(v).replace(/\n/g, '<br>');
function addDays(iso, n) { const d = new Date(iso + 'T00:00:00Z'); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); }
function kstDate(ts) { return new Date(ts).toLocaleDateString('sv-SE', { timeZone: 'Asia/Seoul' }); }
function parts(iso) { return { y: +iso.slice(0, 4), m: +iso.slice(5, 7), d: +iso.slice(8, 10) }; }
function weekLabel(iso, withYear) { const p = parts(iso); if (EN()) return MONTHS[p.m - 1] + (withYear ? ' ' + p.y : '') + ', Week ' + Math.ceil(p.d / 7); return (withYear ? p.y + '년 ' : '') + p.m + '월 ' + Math.ceil(p.d / 7) + '주차'; }
function dayLabel(iso) { if (!iso) return ''; const p = parts(iso); const dw = new Date(iso + 'T00:00:00Z').getUTCDay(); if (EN()) return ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'][dw] + ', ' + MONTHS[p.m - 1] + ' ' + p.d; const w = '일월화수목금토'[dw]; return p.m + '월 ' + p.d + '일 (' + w + ')'; }
function dateTime(ts) {
  if (!ts) return '';
  const d = new Date(ts);
  return d.toLocaleString(EN() ? 'en-US' : 'ko-KR', { timeZone: 'Asia/Seoul', month: EN() ? 'short' : 'long', day: 'numeric', hour: 'numeric', minute: '2-digit' });
}
function toast(msg, ms = 2800) {
  const t = $('#toast'); t.textContent = msg; t.hidden = false;
  clearTimeout(toast.t); toast.t = setTimeout(() => { t.hidden = true; }, ms);
}
function errText(e) {
  const m = (e && (e.message || e.error_description || e.msg)) || String(e || '');
  if (/VERSION_CONFLICT/.test(m)) return '다른 셀리더가 방금 저장했습니다. 최신 내용을 불러와 주세요.';
  if (/Failed to fetch|NetworkError|Load failed/i.test(m)) return '인터넷 연결을 확인해 주세요.';
  if (/JWT|jwt expired|invalid claim/i.test(m)) return '로그인이 만료되었습니다. 다시 로그인해 주세요.';
  return m.replace(/^VERSION_CONFLICT:\s*/, '');
}
async function rpc(name, args) {
  const { data, error } = await sb.rpc(name, args || {});
  if (error) throw error;
  return data;
}
async function q(promise) { const { data, error } = await promise; if (error) throw error; return data; }

/* =====================================================================

const S = { ctx: null, me: null, roles: [], tab: null, view: null, stack: [] };

function hasRole(r) { return S.roles.includes(r); }
function isSenior() { return hasRole('senior_pastor') || hasRole('samonim'); }
function availableTabs() {
  const t = [];
  if (S.ctx.leader_cells.length || S.ctx.my_open_reports.length) t.push({ id: 'leader', label: tr('셀리더', 'Cell Leader') });
  if (hasRole('leadership')) t.push({ id: 'leadership', label: tr('분파셀리더', 'Leadership') });
  if (isSenior()) t.push({ id: 'senior', label: tr('전체 현황', 'Overview') });
  if (hasRole('leadership') || isSenior()) t.push({ id: 'notes', label: tr('성도 동정', 'Notes') });
  if (hasRole('admin')) t.push({ id: 'admin', label: tr('관리', 'Admin') });
  return t;
}
const TAB_HOME = { leader: { name: 'leaderHome' }, leadership: { name: 'leadershipHome' }, senior: { name: 'dashboard' }, admin: { name: 'adminHome' }, notes: { name: 'notesHome' } };

function go(view, opts = {}) {
  if (!opts.replace && S.view) S.stack.push(S.view);
  S.view = view;
  if (!opts.replace) history.pushState({ n: S.stack.length }, '');
  render();
  window.scrollTo(0, 0);
}
function back() {
  if (S.stack.length) { S.view = S.stack.pop(); render(); window.scrollTo(0, 0); }
  else { S.view = TAB_HOME[S.tab]; render(); }
}
window.addEventListener('popstate', () => { if (S.ctx && S.stack.length) { S.view = S.stack.pop(); render(); } });
function switchTab(id) { S.tab = id; S.stack = []; S.view = { ...TAB_HOME[id] }; render(); window.scrollTo(0, 0); }

function setTop(title, canBack) {
  $('#topbar').innerHTML =
    (canBack ? '<button class="iconbtn" data-act="back" aria-label="' + tr('뒤로', 'Back') + '">' + tr('← 뒤로', '← Back') + '</button>' : '<span class="brand">' + BRAND_MARK + tr('셀 케어', 'Cell Care') + '</span>') +
    '<span class="title">' + esc(title || '') + '</span>' +
    (langAllowed() ? '<button class="iconbtn" data-act="lang" aria-label="Language">' + (EN() ? '한국어' : 'EN') + '</button>' : '') +
    (S.ctx ? '<button class="iconbtn" data-act="logout">' + tr('로그아웃', 'Log out') + '</button>' : '');
}

function renderTabs(show) {
  const nav = $('#tabs');
  const tabs = S.ctx ? availableTabs() : [];
  if (!show || tabs.length < 2) { nav.hidden = true; document.body.style.paddingBottom = show === 'footer' ? '170px' : '24px'; if (show && tabs.length < 2) document.body.style.paddingBottom = '24px'; return; }
  nav.hidden = false; document.body.style.paddingBottom = '';
  nav.innerHTML = '<div class="in">' + tabs.map(t =>
    '<button data-act="tab" data-id="' + t.id + '"' + (S.tab === t.id ? ' aria-current="page"' : '') + '>' + (TAB_ICON[t.id] || '') + '<span>' + esc(t.label) + '</span></button>').join('') + '</div>';
}

async function render() {
  const v = S.view; const app = $('#app');
  try {
    if (v.name === 'leaderHome') return await viewLeaderHome(app);
    if (v.name === 'report') return await viewReportEditor(app, v);
    if (v.name === 'leadershipHome') return await viewLeadershipHome(app, v);
    if (v.name === 'detail') return await viewReportDetail(app, v);
    if (v.name === 'dashboard') return await viewDashboard(app, v);
    if (v.name === 'group') return await viewGroup(app, v);
    if (v.name === 'adminHome') return await viewAdminHome(app);
    if (v.name === 'members') return await viewMembers(app, v);
    if (v.name === 'notesHome') return await viewNotesHome(app, v);
    if (v.name === 'noteEdit') return viewNoteEdit(app, v);
    if (v.name === 'lrEdit') return await viewLrEdit(app, v);
    if (v.name === 'lrRead') return await viewLrRead(app, v);
    if (v.name === 'issues') return await viewIssues(app, v);
  } catch (e) {
    console.error(e);
    setTop('', S.stack.length > 0); renderTabs(true);
    app.innerHTML = '<div class="banner danger" role="alert"><b>화면을 불러오지 못했습니다.</b>' + esc(errText(e)) +
      '</div><div style="margin-top:12px"><button class="btn ghost" data-act="reload">다시 시도</button></div>';
  }
}

    <h1 style="text-align:center">${tr('주님의교회 셀 케어', "The Lord's Church Cell Care")}</h1>
    <p class="sub" style="text-align:center">${tr('셀 모임 보고와 목양 기록을 함께 나누는 공간입니다.', 'A place to share cell group reports and pastoral care.')}</p>
    <div class="card stack" style="margin-top:16px">
      ${!LOGIN.sent ? `
        <label class="field">${tr('이메일', 'Email')}
          <input id="login-email" type="email" inputmode="email" autocomplete="email" placeholder="${tr('등록된 이메일을 입력해 주세요', 'Your registered email')}" value="${esc(LOGIN.email)}">
        </label>
        <button class="btn" data-act="send-login" ${LOGIN.busy ? 'disabled' : ''}>${LOGIN.busy ? tr('보내는 중…', 'Sending…') : tr('로그인 메일 받기', 'Email me a login code')}</button>
        <p class="tiny muted" style="margin:0">${tr('비밀번호 없이, 메일로 받은 링크나 코드로 로그인합니다.', 'No password needed — sign in with the code sent to your email.')}</p>
      ` : `
        <div class="banner"><b>${tr('메일을 보냈습니다', 'Email sent')}</b>${tr(esc(LOGIN.email) + ' 메일함을 확인해 주세요.', 'Please check ' + esc(LOGIN.email) + '.')}</div>
        <p class="small" style="margin:0">${tr('메일에 있는 <b>숫자 코드</b>를 아래에 입력하거나, 메일 속 <b>로그인 링크</b>를 눌러 주세요. 링크는 이 휴대폰(또는 컴퓨터)의 인터넷 앱에서 열어 주세요.', 'Enter the <b>number code</b> from the email below.')}</p>
        <label class="field">${tr('메일에 숫자 코드가 있다면 여기에 입력해 주세요', 'Login code')}
          <input id="login-code" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="10" placeholder="${tr('메일로 받은 숫자', 'Code from the email')}">
        </label>
        <button class="btn" data-act="verify-code" ${LOGIN.busy ? 'disabled' : ''}>${tr('코드로 로그인', 'Sign in')}</button>

async function sendRegister() {
  const name = ($('#reg-name')?.value || '').trim();
  const email = ($('#reg-email')?.value || '').trim().toLowerCase();
  LOGIN.regName = name; LOGIN.email = email; LOGIN.msg = '';
  if (name.length < 2) { LOGIN.msg = '이름을 적어 주세요.'; return viewLogin(); }
  if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) { LOGIN.msg = '이메일 주소를 다시 확인해 주세요.'; return viewLogin(); }
  LOGIN.busy = true; viewLogin();
  try { await rpc('request_access', { p_name: name, p_email: email }); LOGIN.regDone = true; fetch('api/notify-request', { method: 'POST' }).catch(() => {}); }
  catch (e) { LOGIN.msg = errText(e); }
  LOGIN.busy = false; viewLogin();
}
async function sendLogin() {
  const email = ($('#login-email')?.value || '').trim().toLowerCase();
  LOGIN.email = email; LOGIN.msg = '';
  if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) { LOGIN.msg = '이메일 주소를 다시 확인해 주세요.'; return viewLogin(); }
  LOGIN.busy = true; viewLogin();
  const { error } = await sb.auth.signInWithOtp({
    email, options: { shouldCreateUser: true, emailRedirectTo: location.origin + location.pathname }
  });
  LOGIN.busy = false;
  if (error) {
    const m = error.message || ''; const code = error.code || '';
    if (code === 'unexpected_failure' || /Database error|NOT_APPROVED/i.test(m)) LOGIN.msg = '아직 승인되지 않은 이메일입니다. 아래 「등록 신청하기」로 먼저 신청해 주세요. 이미 신청하셨다면 승인 후 다시 시도해 주세요.';
    else if (code === 'signup_disabled' || /for this instance/i.test(m)) LOGIN.msg = '등록은 되어 있지만 아직 초대를 수락하지 않으셨어요. 받으신 초대 메일의 링크를 먼저 눌러 주세요. 메일이 없다면 담당 교역자에게 초대를 다시 요청해 주세요.';
    else if (code === 'otp_disabled' || /signup|not allowed|not found|Signups/i.test(m)) LOGIN.msg = '아직 등록되지 않은 이메일입니다. 담당 교역자에게 문의해 주세요.';
    else if (/rate|security purposes|seconds/i.test(m)) LOGIN.msg = '메일을 너무 자주 요청했습니다. 잠시 후 다시 시도해 주세요.';
    else LOGIN.msg = '메일을 보내지 못했습니다. 잠시 후 다시 시도해 주세요. (' + m + ')';
    return viewLogin();
  }
  LOGIN.sent = true; viewLogin();
}
async function verifyCode() {
  const token = ($('#login-code')?.value || '').replace(/\D/g, '');
  if (token.length < 6 || token.length > 10) { LOGIN.msg = '메일로 받은 숫자 코드를 그대로 입력해 주세요.'; return viewLogin(); }
  LOGIN.busy = true; LOGIN.msg = ''; viewLogin();
  const { error } = await sb.auth.verifyOtp({ email: LOGIN.email, token, type: 'email' });
  LOGIN.busy = false;
  if (error) { LOGIN.msg = tr('코드가 맞지 않거나 시간이 지났습니다. 메일을 다시 받아 주세요.', 'The code is incorrect or expired. Please request a new one.'); return viewLogin(); }
}

function leaderCardState(r) {

  return { pill: '<span class="pill ok">제출 완료</span>', text: '제출했습니다. 확인을 기다리고 있어요. 확인 전까지는 직접 고칠 수 있습니다.', btn: '제출한 보고서 보기', cls: 'quiet' };

async function viewLeaderHome(app) {
  setTop('셀리더', false); renderTabs(true);
  await refreshContext();
  const ctx = S.ctx; const thisWeek = ctx.this_week; const lastWeek = addDays(thisWeek, -7);
  const cellIds = ctx.leader_cells.map(c => c.cell_id);
  let reports = [], pastWeeks = [];
  if (cellIds.length) {
    pastWeeks = await rpc('my_report_weeks').catch(() => []);
    reports = await q(sb.from('weekly_reports')
      .select('id, cell_id, week_start, status, review_status, review_mode, submitted_at, submission_no')
      .in('cell_id', cellIds).order('week_start', { ascending: false }).limit(30));
  }
  const find = (cell, w) => reports.find(r => r.cell_id === cell && r.week_start === w);
  const revs = (ctx.my_open_reports || []).filter(r => r.status === 'revision_requested' && !(cellIds.includes(r.cell_id) && (r.week_start === thisWeek || r.week_start === lastWeek)));
  const otherOpen = (ctx.my_open_reports || []).filter(r => !(cellIds.includes(r.cell_id) && (r.week_start === thisWeek || r.week_start === lastWeek)) && r.status !== 'revision_requested');

  const DL = {};
  await Promise.all(ctx.leader_cells.flatMap(c => [thisWeek, lastWeek].map(w => rpc('cell_deadline', { p_cell: c.cell_id, p_week: w }).then(x => { DL[c.cell_id + w] = x; }).catch(() => {}))));
  const dlText = (cell, w, r) => {
    if (r && r.status === 'submitted') return '';
    const d = DL[cell + w]; if (!d || isNaN(new Date(d).getTime())) return '';
    return Date.now() > new Date(d).getTime() ? ' 마감이 지났지만 지금이라도 작성해 주세요.' : ' 마감: ' + dayLabel(kstDate(d)) + ' 낮 12시까지';
  };
  let h = `<h1>안녕하세요, ${esc(honorific(S.me.name))}</h1>`;
  if (revs.length) {
    h += '<div class="stack" style="margin-top:12px">' + revs.map(r => `
      <div class="banner warn"><b>${esc(r.cell_name)} · ${weekLabel(r.week_start)} 보고서에 수정 요청이 있습니다</b>
        ${r.revision_reason ? '“' + esc(r.revision_reason) + '”' : ''}
        <div style="margin-top:10px"><button class="btn warn sm" data-act="open-report" data-id="${r.report_id}">수정하러 가기</button></div></div>`).join('') + '</div>';
  }
  for (const c of ctx.leader_cells) {
    const leadershipLine = c.review_mode === 'leadership' ? ('담당 분파셀리더: ' + esc(c.leadership || '배정 전'))
      : c.review_mode === 'senior_direct' ? '스캇 브래너 담임 목사님 / 성희 브래너 사모님 직접 확인' : '검토 없이 제출만 하는 셀';
    h += `<div class="row" style="margin-top:28px;align-items:center"><h2 style="margin:0">${esc(c.name)}</h2><span class="spacer"></span><button class="btn sm ghost" data-act="open-members" data-cell="${c.cell_id}" data-name="${esc(c.name)}">셀원 관리</button></div><p class="sub">${leadershipLine}${c.leaders && c.leaders.length > 1 ? ' · 공동 셀리더: ' + esc(c.leaders.join(', ')) : ''}</p><div class="stack">`;
    const weeks = [thisWeek];
    const lw = find(c.cell_id, lastWeek);
    const wasLeaderLast = pastWeeks.some(x => x.cell_id === c.cell_id && x.week_start === lastWeek);
    if ((!lw || lw.status !== 'submitted') && (lw || wasLeaderLast)) weeks.push(lastWeek);
    for (const w of weeks) {
      const r = find(c.cell_id, w); const st = leaderCardState(r);
      h += `<div class="card stack">
        <div class="row"><h3 style="margin:0">${w === thisWeek ? '이번 주' : '지난주'} · ${weekLabel(w, true)}</h3><span class="spacer"></span>${st.pill}</div>
        ${r && r.status === 'revision_requested' ? (() => { const o = (ctx.my_open_reports || []).find(x => x.report_id === r.id); return o && o.revision_reason ? '<div class="banner warn small"><b>수정 요청 사유</b>' + nl2br(o.revision_reason) + '</div>' : ''; })() : ''}
        <p class="muted small" style="margin:0">${st.text}${dlText(c.cell_id, w, r)}</p>
        <button class="btn ${st.cls}" data-act="${r ? 'open-report' : 'start-report'}" data-id="${r ? r.id : ''}" data-cell="${c.cell_id}" data-week="${w}">${st.btn}</button>
      </div>`;
    }
    h += '</div>';
    const older = pastWeeks.filter(x => x.cell_id === c.cell_id && x.week_start < lastWeek && x.status !== 'submitted');
    if (older.length) {
      h += `<details class="cellbox" style="margin-top:8px"><summary class="small">지난 보고서 쓰기 (${older.length}주)</summary><div class="stack" style="margin-top:8px">` +
        older.map(x => `<button class="listitem" data-act="${x.report_id ? 'open-report' : 'start-report'}" data-id="${x.report_id || ''}" data-cell="${c.cell_id}" data-week="${x.week_start}">
          <span class="top"><b>${weekLabel(x.week_start)}</b><span class="pill">${x.report_id ? LX('status', x.status) : '작성 전'}</span></span></button>`).join('') +
        '</div><p class="tiny muted" style="margin:6px 0 0">4주 전까지 작성할 수 있습니다.</p></details>';
    }
  }
  if (otherOpen.length) {
    h += '<h2>마무리할 보고서</h2><div class="stack">' + otherOpen.map(r => `
      <button class="listitem" data-act="open-report" data-id="${r.report_id}"><span class="top"><b>${esc(r.cell_name)} · ${weekLabel(r.week_start)}</b><span class="pill accent">${LX('status', r.status)}</span></span></button>`).join('') + '</div>';
  }
  h += '<div id="pushbox"></div>';
  const recent = reports.filter(r => r.status === 'submitted');
  h += '<h2>최근 보고서</h2>';
  h += recent.length ? '<div class="stack">' + recent.slice(0, 8).map(r => {
    const cell = ctx.leader_cells.find(c => c.cell_id === r.cell_id);
    const rv = r.review_status === 'reviewed' ? '<span class="pill ok">분파셀리더 확인 완료</span>' : r.review_status === 'not_required' ? '<span class="pill ok">제출 완료</span>' : '<span class="pill">확인 대기</span>';
    return `<button class="listitem" data-act="open-report" data-id="${r.id}"><span class="top"><b>${weekLabel(r.week_start)}${ctx.leader_cells.length > 1 ? ' · ' + esc(cell?.name || '') : ''}</b>${rv}</span></button>`;
  }).join('') + '</div>' : '<p class="empty">아직 제출한 보고서가 없습니다.</p>';
  app.innerHTML = h;
  renderPushBox();
}

/* =====================================================================
   보고서 알림 (앱 푸시) — 셀리더 홈 아래쪽 카드
   ===================================================================== */
const PUSH = { busy: false, msg: '' };
const isIOS = () => /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
const isStandalone = () => window.matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
function b64urlToBytes(s) { const p = '='.repeat((4 - s.length % 4) % 4); const b = atob((s + p).replace(/-/g, '+').replace(/_/g, '/')); return Uint8Array.from(b, c => c.charCodeAt(0)); }
async function pushState() {
  if (/KAKAOTALK|NAVER|Instagram|FBAN|FBAV/i.test(navigator.userAgent)) return { s: 'inapp' };
  if (!('serviceWorker' in navigator) || !('PushManager' in window) || !('Notification' in window)) return { s: isIOS() && !isStandalone() ? 'ios-home' : 'unsupported' };
  try { const r = await fetch('api/vapid-public', { cache: 'no-store' }); if (!r.ok) return { s: 'off' }; } catch (_) { return { s: 'off' }; }
  if (Notification.permission === 'denied') return { s: 'denied' };
  const reg = await navigator.serviceWorker.ready;
  const sub = await reg.pushManager.getSubscription();
  return { s: sub ? 'on' : 'ready', sub };
}
async function renderPushBox() {
  const box = $('#pushbox'); if (!box) return;
  let st; try { st = await pushState(); } catch (_) { st = { s: 'off' }; }
  if (!$('#pushbox')) return;
  const msg = PUSH.msg ? `<p class="small" style="margin:0;color:var(--accent)">${esc(PUSH.msg)}</p>` : '';
  const card = (inner) => `<h2>${tr('셀 케어 알림', 'Notifications')}</h2><div class="card stack">${inner}${msg}</div>`;
  if (st.s === 'off') { box.innerHTML = ''; return; }
  if (st.s === 'on' && !PUSH.synced) {   // 이 휴대폰 알림을 지금 로그인한 사람 것으로 맞춤 (계정을 바꿔 로그인한 경우)
    PUSH.synced = true;
    const j = st.sub.toJSON();
    rpc('save_push_subscription', { p_endpoint: j.endpoint, p_p256dh: j.keys.p256dh, p_auth: j.keys.auth, p_ua: navigator.userAgent, p_lang: LANG }).catch(() => { PUSH.synced = false; });
  }
  if (st.s === 'on') return box.innerHTML = card(`<p style="margin:0">${tr('이 휴대폰으로 <b>셀 케어 알림</b>을 받고 있습니다.', 'This phone receives <b>Cell Care notifications</b>.')}</p>
    <div class="row" style="gap:8px"><button class="btn sm ghost" data-act="push-test" ${PUSH.busy ? 'disabled' : ''}>${tr('테스트 알림 보내기', 'Send a test')}</button>
    <button class="link" data-act="push-off">${tr('알림 끄기', 'Turn off')}</button></div>`);
  if (st.s === 'ready') return box.innerHTML = card(`<p style="margin:0">${tr('셀 케어 알림을 받으시겠어요?', 'Would you like Cell Care notifications?')}</p>
    <button class="btn" data-act="push-on" ${PUSH.busy ? 'disabled' : ''}>${PUSH.busy ? tr('설정하는 중…', 'Setting up…') : tr('알림 받기', 'Turn on notifications')}</button>
    <p class="tiny muted" style="margin:0">${tr('버튼을 누른 뒤 나오는 창에서 「허용」을 눌러 주세요.', 'Then tap “Allow” in the pop-up.')}</p>`);
  if (st.s === 'denied') return box.innerHTML = card(`<p style="margin:0">이 휴대폰에서 셀 케어 알림이 꺼져 있습니다.</p>
    <p class="small muted" style="margin:0">휴대폰 <b>설정 → 알림</b>(또는 인터넷 앱의 사이트 설정)에서 셀 케어 알림을 허용한 뒤 다시 열어 주세요.</p>`);
  if (st.s === 'ios-home') return box.innerHTML = card(`<p style="margin:0">${tr('아이폰은 <b>홈 화면에 추가</b>한 뒤에 알림을 받을 수 있어요.', 'On iPhone, notifications work after you <b>Add to Home Screen</b>.')}</p>
    <ol class="small" style="margin:0;padding-left:20px;line-height:1.8"><li>사파리 아래쪽 <b>공유 버튼</b>(네모에 위쪽 화살표)을 누릅니다.</li>
    <li><b>홈 화면에 추가</b>를 누릅니다.</li><li>홈 화면에 생긴 <b>셀 케어</b> 아이콘으로 열고, 여기서 「알림 받기」를 누릅니다.</li></ol>`);
  if (st.s === 'inapp') return box.innerHTML = card(`<p style="margin:0">카카오톡 등 다른 앱 안에서 연 화면에서는 알림을 받을 수 없어요.</p>
    <p class="small muted" style="margin:0">오른쪽 위 메뉴에서 <b>다른 브라우저로 열기</b>(크롬·사파리)를 눌러 주세요.</p>`);
  box.innerHTML = card(`<p style="margin:0">이 인터넷 앱에서는 알림을 받을 수 없어요.</p><p class="small muted" style="margin:0">휴대폰의 크롬(안드로이드) 또는 사파리(아이폰)로 열어 주세요.</p>`);
}
// 제출 알림: 확인할 분께 바로 알림 (실패해도 제출에는 영향 없음)
async function notifySubmitted(id) {
  try {
    const { data } = await sb.auth.getSession();
    await fetch('api/notify-submit', { method: 'POST', headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + (data.session?.access_token || '') }, body: JSON.stringify({ report: id }) });
    fetch('api/pastor-message', { method: 'POST', headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + (data.session?.access_token || '') }, body: JSON.stringify({ report: id }) }).catch(() => {});
  } catch (_) { /* 토요일 확인 알림이 대신 챙김 */ }
}
async function pushOn() {
  PUSH.busy = true; PUSH.msg = ''; 
  try {
    const perm = await Notification.requestPermission();
    if (perm !== 'granted') { PUSH.msg = '알림이 허용되지 않았습니다.'; return; }
    const reg = await navigator.serviceWorker.ready;
    const { key } = await (await fetch('api/vapid-public', { cache: 'no-store' })).json();
    const sub = (await reg.pushManager.getSubscription()) || await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: b64urlToBytes(key) });
    const j = sub.toJSON();
    await rpc('save_push_subscription', { p_endpoint: j.endpoint, p_p256dh: j.keys.p256dh, p_auth: j.keys.auth, p_ua: navigator.userAgent, p_lang: LANG });
    PUSH.msg = tr('알림을 켰습니다. 「테스트 알림 보내기」로 확인해 보세요.', 'Notifications are on. Try “Send a test”.');
  } catch (e) { PUSH.msg = '알림을 켜지 못했습니다. (' + errText(e) + ')'; }
  finally { PUSH.busy = false; renderPushBox(); }
}
async function pushOff() {
  try {
    const reg = await navigator.serviceWorker.ready; const sub = await reg.pushManager.getSubscription();
    if (sub) { await rpc('delete_push_subscription', { p_endpoint: sub.endpoint }).catch(() => {}); await sub.unsubscribe(); }
    PUSH.msg = tr('알림을 껐습니다.', 'Notifications are off.');
  } catch (e) { PUSH.msg = errText(e); }
  renderPushBox();
}
async function pushTest() {
  PUSH.busy = true; PUSH.msg = ''; renderPushBox();
  try {
    const { data } = await sb.auth.getSession();
    const r = await fetch('api/test-push', { method: 'POST', headers: { Authorization: 'Bearer ' + (data.session?.access_token || '') } });
    const j = await r.json();
    PUSH.msg = r.ok && j.sent ? tr('테스트 알림을 보냈습니다. 잠시 뒤 알림이 오는지 확인해 주세요.', 'Test sent. It should arrive in a moment.')
      : r.ok && j.failed ? '알림 서버에서 받지 않았습니다. 「알림 끄기」 후 다시 「알림 받기」를 눌러 주세요.'
      : r.ok ? '이 계정에 등록된 휴대폰이 없습니다. 「알림 끄기」 후 다시 「알림 받기」를 눌러 주세요.'
      : '보내지 못했습니다. ' + (j.error || '');
  } catch (e) { PUSH.msg = '보내지 못했습니다. (' + errText(e) + ')'; }
  finally { PUSH.busy = false; renderPushBox(); }
}

/* 호칭: 이름에 직분이 붙어 있으면(예: 장주상 전도사) '님'만, 없으면 '셀리더님' */
function honorific(name) { name = (name || '').trim(); return /\s/.test(name) ? name + '님' : name + ' 셀리더님'; }

async function startReport(cell, week) {
  try {
    const id = await rpc('start_report', { p_cell: cell, p_week_start: week });
    go({ name: 'report', id });
  } catch (e) { toast(errText(e)); }
}

/* =====================================================================
   보고서 작성 (5단계) — 제출 전에는 수정, 제출 후에는 읽기 화면
   ===================================================================== */
const STEPS = ['모임', '출석', '셀 케어', '은혜', '확인'];
const reviewerName = (mode) => mode === 'senior_direct' ? '담임 목사님·사모님' : '담당 분파셀리더';
/* 관계 기록: 서로 어려워함 / 이 분이 상대 때문에 어려워함 */
function relText(subject, other, kind) {
  if (!other) return '';
  return kind === 'one_way' ? tr(subject + ' → ' + other + ' (' + other + ' 때문에 어려워함)', subject + ' → ' + other + ' (troubled by ' + other + ')')
    : tr(subject + ' ↔ ' + other + ' (서로 어려워함)', subject + ' ↔ ' + other + ' (mutual difficulty)');
}
let E = null; // 편집 중인 보고서
let PMSG_LOADED = '';

async function loadEditor(id) {
  const [rep] = await q(sb.from('weekly_reports').select('*').eq('id', id));
  if (!rep) throw new Error(tr('보고서를 찾을 수 없거나 볼 권한이 없습니다.', 'Report not found, or you do not have access.'));
  const [roster, visitors, prayers, notes, revisions, cells] = await Promise.all([
    rpc('get_report_roster', { p_report: id }),
    rpc('get_recent_visitors', { p_report: id }).catch(() => []),
    rpc('get_open_prayers', { p_report: id }),
    q(sb.from('care_notes').select('*').eq('report_id', id).order('created_at')),
    q(sb.from('revision_requests').select('*').eq('report_id', id).order('created_at', { ascending: false })),
    q(sb.from('cells').select('id, name, review_mode').eq('id', rep.cell_id)),
    rpc('pastor_msg_get', { p_report: id }).catch(() => [])
  ]).then(x => { PMSG_LOADED = (x[6] && x[6][0]) ? x[6][0].content : ''; return x; });
  const att = {};
  for (const m of roster) if (m.attendance) att[m.member_id] = { status: m.attendance, absence_reason: m.absence_reason || '' };
  const pu = {};
  for (const p of prayers) if (p.this_week_status) pu[p.prayer_id] = { status: p.this_week_status, note: p.this_week_note || '' };
  return {
    id, rep, cell: cells[0] || { name: '' }, roster, visitors, prayers, revisions,
    step: E && E.id === id ? E.step : 0,
    m: {
      meeting_held: rep.meeting_held, meeting_date: rep.meeting_date || '', meeting_cancel_reason: rep.meeting_cancel_reason || '',
      grace_notes: rep.grace_notes || '', grace_none: false, leader_message: rep.leader_message === 'share_up' ? 'none' : (rep.leader_message || 'none'),
      att, pu,
      notes: notes.map(n => ({ member_id: n.member_id, category: n.category, content: n.content, attention: n.leadership_attention_required, related_member_id: n.related_member_id || '', related_name: n.related_name || '', related_mode: n.related_member_id ? 'member' : n.related_name ? 'other' : '', relation_kind: n.relation_kind || 'mutual' })),
      hasCare: notes.length ? true : (rep.version > 2 ? false : null)
    },
    pmsg: PMSG_LOADED, pmsgSaved: PMSG_LOADED,
    version: rep.version, dirty: false, saving: false, saveMsg: '', conflict: false, confirm: false, newName: '', newReg: false, showAdd: false
  };
}

async function viewReportEditor(app, v) {
  E = await loadEditor(v.id);
  if (E.rep.status === 'submitted') { E = null; S.view = { name: 'detail', id: v.id, mine: true }; return render(); }
  renderEditor();
}

function mondayOf(iso) { const d = new Date(iso + 'T00:00:00Z'); return addDays(iso, -((d.getUTCDay() + 6) % 7)); }
function weekOK(d) { return d && d >= E.rep.week_start && d <= addDays(E.rep.week_start, 6); }

      <div class="card"><dl class="summary" style="margin:0">

        <dt>셀</dt><dd>${esc(E.cell.name)}</dd><dt>확인</dt><dd>${ldr}</dd></dl></div>
      <h2>${weekLabel(r.week_start)} 셀모임을 진행하셨나요?</h2>
      <div class="seg" style="--n:2">

          : `<div class="banner warn" style="margin-top:8px" role="alertdialog"><b>${dayLabel(m.meeting_date)}은 ${weekLabel(nw)} (${dayLabel(nw)} ~ ${dayLabel(addDays(nw, 6))})입니다</b>이 보고서를 ${weekLabel(nw)} 보고서로 옮길까요? 적어 두신 출석·셀 케어·은혜와 나눔 내용은 그대로 함께 옮겨집니다.
            <div class="row" style="margin-top:10px;gap:8px;flex-wrap:wrap"><button class="btn sm" data-act="ed-move" ${E.moving ? 'disabled' : ''}>${weekLabel(nw)} 보고서로 옮기기</button><button class="btn quiet sm" data-act="ed-move-cancel">날짜 다시 고르기</button></div></div>`; })() : ''}</div>`;

async function reopenReport(id) {

function hideFooter() { const b = document.getElementById('footer-bar'); if (b) b.hidden = true; }

function markDirty(rerender) { E.dirty = true; E.saveMsg = '저장 전'; const s = $('#savestate'); if (s) s.textContent = E.saveMsg; clearTimeout(E.timer); E.timer = setTimeout(save, 1200); if (rerender) renderEditor(); }

function payload() {
  const m = E.m;
  return {
    meeting_held: m.meeting_held, meeting_date: m.meeting_held ? (m.meeting_date || null) : null,
    meeting_cancel_reason: m.meeting_held === false ? m.meeting_cancel_reason : null,
    grace_notes: m.grace_none ? null : m.grace_notes, grace_none: m.grace_none, leader_message: m.leader_message,
    attendance: E.roster.filter(x => x.listed || m.att[x.member_id]).map(x => {
      const a = m.att[x.member_id] || { status: 'unknown' };
      return { member_id: x.member_id, status: a.status, absence_reason: a.status === 'absent' ? (a.absence_reason || '') : '' };
    }),
    care_notes: m.hasCare ? m.notes.filter(n => n.member_id && n.category && n.content.trim())
      .map(n => ({ member_id: n.member_id, category: n.category, content: n.content.trim(), leadership_attention_required: !!n.attention,
        related_member_id: n.category === 'relationship' ? (n.related_member_id || '') : '', related_name: n.category === 'relationship' && n.related_mode === 'other' ? (n.related_name || '') : '', relation_kind: n.relation_kind || 'mutual' })) : [],
    prayer_updates: Object.entries(m.pu).filter(([, u]) => u.status).map(([id, u]) => ({ prayer_id: id, status: u.status, note: u.note || '' }))
  };
}
async function save() {
  if (!E || E.conflict) return false;
  if (E.saving) { E.again = true; return E.savingPromise; }
  if (!E.dirty) return true;
  clearTimeout(E.timer);
  E.saving = true; E.dirty = false; E.saveMsg = '저장하는 중…'; const s = $('#savestate'); if (s) s.textContent = E.saveMsg;
  const ed = E;
  E.savingPromise = (async () => {
    try {
      ed.version = await rpc('save_report', { p_report: ed.id, p_data: payload(), p_version: ed.version });
      if ((ed.pmsg || '').trim() !== (ed.pmsgSaved || '').trim()) { const v = ed.pmsg || ''; await rpc('pastor_msg_save', { p_report: ed.id, p_content: v }); ed.pmsgSaved = v; }
      const t = new Date().toLocaleTimeString('ko-KR', { hour: 'numeric', minute: '2-digit', timeZone: 'Asia/Seoul' });
      ed.saveMsg = '자동 저장됨 · ' + t;
      return true;
    } catch (e) {
      if (e.code === 'P0409' || /VERSION_CONFLICT/.test(e.message || '')) { ed.conflict = true; if (E === ed) renderEditor(); }
      else { ed.dirty = true; ed.saveMsg = '저장하지 못했습니다: ' + errText(e); }
      return false;
    } finally {
      ed.saving = false;
      const s2 = $('#savestate'); if (s2 && E === ed) s2.textContent = ed.saveMsg;
      if (ed.again) { ed.again = false; if (ed.dirty) save(); }
    }
  })();
  return E.savingPromise;
}

function validateForSubmit() {
  const m = E.m; const w = E.rep.week_start;
  if (m.meeting_held === null || m.meeting_held === undefined) return [0, '이번 주 셀모임 진행 여부를 골라 주세요.'];
  if (m.meeting_held && !weekOK(m.meeting_date)) return [0, '셀모임 날짜를 ' + dayLabel(w) + '부터 ' + dayLabel(addDays(w, 6)) + ' 사이로 입력해 주세요.'];
  if (m.meeting_held === false && !m.meeting_cancel_reason.trim()) return [0, '모임을 진행하지 못한 이유를 적어 주세요.'];
  if (m.meeting_held && !m.grace_none && !m.grace_notes.trim()) return [3, '은혜와 나눔을 적어 주세요.'];
  if (m.hasCare && m.notes.some(n => (n.content.trim() || n.member_id) && (!n.member_id || !n.category || !n.content.trim()))) return [2, '셀 케어 기록마다 셀원, 유형, 내용을 모두 채워 주세요.'];
  return null;
}
async function submitReport() {
  const bad = validateForSubmit();
  if (bad) { E.confirm = false; E.step = bad[0]; renderEditor(); toast(bad[1], 4000); return; }
  const ok = await save(); if (!ok && E.conflict) return;
  if (E.dirty) { const ok2 = await save(); if (!ok2) { toast('저장하지 못해 제출할 수 없습니다. 인터넷 연결을 확인해 주세요.'); return; } }
  try {
    await rpc('submit_report', { p_report: E.id, p_version: E.version });
    const id = E.id; E = null; hideFooter();
    notifySubmitted(id);
    toast('보고서를 제출했습니다. 수고 많으셨습니다.');
    S.stack = []; S.view = { name: 'detail', id, mine: true }; render();
  } catch (e) {
    if (e.code === 'P0409' || /VERSION_CONFLICT/.test(e.message || '')) { E.conflict = true; E.confirm = false; renderEditor(); }
    else { E.confirm = false; renderEditor(); toast(errText(e), 5000); }
  }
}

/* 편집 화면의 입력 (다시 그리지 않음: 글자 입력 중 커서 유지) */
document.addEventListener('input', (e) => {
  if (!E) return; const t = e.target;
  if (t.dataset.bind) { E.m[t.dataset.bind] = t.value; markDirty(false); }
  else if (t.dataset.attReason) { (E.m.att[t.dataset.attReason] ||= { status: 'absent' }).absence_reason = t.value; markDirty(false); }
  else if (t.dataset.puNote) { (E.m.pu[t.dataset.puNote] ||= {}).note = t.value; markDirty(false); }
  else if (t.dataset.note !== undefined && t.dataset.f === 'content') { E.m.notes[+t.dataset.note].content = t.value; markDirty(false); }
  else if (t.dataset.note !== undefined && t.dataset.f === 'related_name') { E.m.notes[+t.dataset.note].related_name = t.value; markDirty(false); }
  else if (t.dataset.pmsg) { E.pmsg = t.value; markDirty(false); }
  else if (t.id === 'new-name') E.newName = t.value;
});
document.addEventListener('change', (e) => {
  if (!E) return; const t = e.target;
  if (t.dataset.bindCheck) { E.m[t.dataset.bindCheck] = t.checked; markDirty(true); }
  else if (t.dataset.bind) { E.m[t.dataset.bind] = t.value; markDirty(!!t.dataset.rerender); }
  else if (t.dataset.noteAttn !== undefined) { E.m.notes[+t.dataset.noteAttn].attention = t.checked; markDirty(false); }
  else if (t.dataset.note !== undefined && t.dataset.f === 'member_id') { E.m.notes[+t.dataset.note].member_id = t.value; markDirty(E.m.notes[+t.dataset.note].category === 'relationship'); }
  else if (t.dataset.note !== undefined && t.dataset.f === 'related') { const n = E.m.notes[+t.dataset.note];
    if (t.value === '__other') { n.related_mode = 'other'; n.related_member_id = ''; } else { n.related_mode = t.value ? 'member' : ''; n.related_member_id = t.value; n.related_name = ''; }
    markDirty(true); }
  else if (t.id === 'new-reg') E.newReg = t.checked;
});

  </div>`;

  if (row.i_can_review || row.i_can_request_revision) {

        <textarea id="rv-note" rows="3" placeholder="${tr('예: 최근 3주 결석 중. 연락 예정.', 'e.g. Absent 3 weeks — will call.')}">${esc(R.note)}</textarea></label>
      <div><div style="font-weight:500;margin-bottom:6px">${tr('상위 보고 상태', 'Escalation')}</div><div class="sel">${Object.keys(L.escalation).map(k =>

    if (row.i_can_request_revision) h += R.revOpen ? `

        <textarea id="rv-reason" rows="3" placeholder="${tr('예: 결석 사유를 조금 더 적어 주세요.', 'e.g. Please add more about the absences.')}">${esc(R.reason)}</textarea></label>
      <div class="row"><button class="btn warn sm" data-act="rv-send">${tr('수정 요청 보내기', 'Send request')}</button><button class="btn quiet sm" data-act="rv-revclose">${tr('취소', 'Cancel')}</button></div>`
      : '<button class="link" data-act="rv-revopen">' + tr('수정 요청하기', 'Request a revision') + '</button>';
    else if (rep.status === 'submitted' && row.i_can_review) h += '<p class="tiny muted" style="margin:0">' + tr('그 주 셀리더 중 지금 수정할 수 있는 분이 없어 수정 요청은 보낼 수 없습니다. 필요한 내용은 메모로 남겨 주세요.', 'No current cell leader can revise this report, so a revision cannot be requested. Please leave a note instead.') + '</p>';
    h += '</div>';
  } else if (rep.status === 'submitted' && rep.review_status === 'pending' && !row.i_am_leader) {
    h += '<p class="tiny muted" style="margin-top:16px">' + tr('이 보고서는 읽기만 할 수 있습니다.', 'This report is read-only for you.') + '</p>';

      <div class="muted">${esc(nameOf(x.reviewer_id))} · ${dateTime(x.reviewed_at)}</div>${x.review_note ? '<div style="margin-top:4px">' + nl2br(x.review_note) + '</div>' : ''}</div>`).join('') + '</div>';

      <div>${nl2br(x.reason)}</div><div class="muted tiny">${esc(nameOf(x.requested_by))} · ${dateTime(x.created_at)}</div></div>`).join('') + '</div>';
  }
  app.innerHTML = h;
}
const DETAIL = { id: null, note: '', level: 'normal', revOpen: false, reason: '', busy: false, reopen: null };
/* 보고서 내용 번역 (목사님·사모님, 영어 화면) */
const TRANS = { id: null, map: null, busy: false, err: '' };
function TX(key, ko) {
  const en = TRANS.map && TRANS.map[key];
  if (!EN() || !en) return nl2br(ko);
  return nl2br(en) + '<div class="tiny muted" style="margin-top:2px">' + nl2br(ko) + '</div>';
}
async function translateReport(id) {
  TRANS.busy = true; TRANS.err = ''; render();
  try {
    const { data } = await sb.auth.getSession();
    const r = await fetch('api/translate', { method: 'POST', headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + (data.session?.access_token || '') }, body: JSON.stringify({ report: id }) });
    const j = await r.json();
    if (!r.ok) throw new Error(j.error || r.status);
    TRANS.id = id; TRANS.map = j.translations || {};
  } catch (e) { TRANS.err = 'Could not translate: ' + (e.message || e); }
  finally { TRANS.busy = false; render(); }
}
document.addEventListener('input', (e) => { if (e.target.id === 'rv-note') DETAIL.note = e.target.value; if (e.target.id === 'rv-reason') DETAIL.reason = e.target.value; });

async function reviewOk() {
  DETAIL.busy = true;
  try {
    await rpc('review_report', { p_report: DETAIL.id, p_note: DETAIL.note, p_level: DETAIL.level });
    toast(tr('확인 완료로 표시했습니다.', 'Marked as reviewed.')); DETAIL.id = null; back();
  } catch (e) { toast(errText(e), 5000); DETAIL.busy = false; render(); }
}
async function reviewRevise() {
  if (!DETAIL.reason.trim()) { toast(tr('수정 요청 사유를 적어 주세요.', 'Please write a reason.')); return; }
  try {
    await rpc('request_revision', { p_report: DETAIL.id, p_reason: DETAIL.reason });
    toast(tr('셀리더에게 수정 요청을 보냈습니다.', 'Revision request sent to the cell leader.')); DETAIL.id = null; back();
  } catch (e) { toast(errText(e), 5000); }
}

/* =====================================================================
   주차 상태 공통
   ===================================================================== */
function rowState(r) {
  if (!r.report_id) return r.is_missing ? { t: tr('미제출 · 마감 지남', 'Not submitted · overdue'), c: 'danger' } : { t: tr('작성 전', 'Not started'), c: '' };
  if (r.status === 'draft') return r.is_missing ? { t: tr('작성 중 · 마감 지남', 'Draft · overdue'), c: 'danger' } : { t: tr('작성 중', 'Draft'), c: '' };
  if (r.status === 'revision_requested') return { t: tr('수정 요청됨', 'Revision requested'), c: 'warn' };
  const late = r.is_late ? tr(' (마감 후)', ' (late)') : '';
  if (r.review_status === 'reviewed') return { t: tr('제출 완료', 'Submitted') + late + tr(' · 확인 완료', ' · Reviewed'), c: 'ok' };
  if (r.review_status === 'not_required') return { t: tr('제출 완료', 'Submitted') + late + tr(' · 검토 없음', ' · No review'), c: 'ok' };
  return { t: tr('제출 완료', 'Submitted') + late + ' · ' + (r.review_mode === 'senior_direct' ? tr('확인 대기', 'Awaiting review') : tr('분파셀리더 확인 대기', 'Awaiting Leadership review')), c: 'warn' };
}
const isConcern = (r) => r.escalation_level && r.escalation_level !== 'normal';
function weekNav(week, act) {
  const thisWeek = S.ctx.this_week;
  return `<div class="weeknav"><button class="btn quiet sm" data-act="${act}" data-week="${addDays(week, -7)}">${tr('← 지난주', '← Prev')}</button>
    <b>${weekLabel(week, true)}</b>
    <button class="btn quiet sm" data-act="${act}" data-week="${addDays(week, 7)}" ${week >= thisWeek ? 'disabled' : ''}>${tr('다음 주 →', 'Next →')}</button></div>`;
}
function cellItem(r, opts = {}) {
  const st = rowState(r);
  const can = !!r.report_id && r.status !== 'draft';
  return `<button class="listitem" ${can ? `data-act="open-detail" data-id="${r.report_id}"` : 'data-act="noop"'} ${can ? '' : 'aria-disabled="true"'}>
    <span class="top"><b>${esc(r.cell_name)}</b><span class="pill ${st.c}">${st.t}</span></span>
    <span class="small muted">Cell Leader: ${esc(r.leader_names || tr('배정 전', 'Not assigned'))}${opts.showResp && r.responsible_leadership_name ? tr(' · 담당: ', ' · Leadership: ') + esc(r.responsible_leadership_name) : ''}</span>
    ${isConcern(r) ? `<span class="small" style="color:var(--warn)">${tr('상위 보고', 'Escalation')}: ${LX('escalation', r.escalation_level)}</span>` : ''}
    ${r.attention_items ? `<span class="small" style="color:var(--warn)">${tr('분파셀리더 확인 필요 항목 ' + r.attention_items + '건', r.attention_items + ' item(s) flagged for Leadership')}</span>` : ''}
  </button>`;
}

/* Leadership 탭의 '내 셀': 제출된 보고서는 보기, 아직이면 작성 화면으로 (확인 버튼 없음) */
function ownCellItem(r, week) {
  const st = rowState(r);
  const submitted = r.report_id && r.status === 'submitted';
  const act = submitted ? `data-act="open-detail" data-id="${r.report_id}"`
    : r.report_id ? `data-act="open-report" data-id="${r.report_id}"`
    : `data-act="start-report" data-cell="${r.cell_id}" data-week="${week}"`;
  const hint = submitted ? '눌러서 보고서 보기' : r.report_id ? '눌러서 이어서 쓰기' : '눌러서 보고서 쓰기';
  return `<button class="listitem" ${act}>
    <span class="top"><b>${esc(r.cell_name)}</b><span class="pill ${st.c}">${st.t}</span></span>
    <span class="small muted">${r.review_mode === 'senior_direct' ? '스캇 브래너 담임 목사님 / 성희 브래너 사모님 확인' : '담당: ' + esc(r.responsible_leadership_name || '배정 전')} · ${hint}</span>
  </button>`;
}

      <button class="btn ${lr && lr.status === 'submitted' ? 'ghost' : ''}" data-act="lr-edit-open" data-week="${week}">${!lr ? '교역자 보고 쓰기' : lr.status === 'submitted' ? '보고 보기 · 고치기' : '이어서 쓰기'}</button></div>
      <button class="listitem" data-act="open-issues" style="margin-bottom:12px"><span class="top"><b>셀원 이슈 보기</b><span class="small muted">내 분파 · 교회 전체 →</span></span><span class="small muted">관계, 장기결석, 건강 등 이슈별로, 사람별로 모아 봅니다.</span></button>`;

    : mine.length ? '<div class="banner"><b>지금 확인할 보고서가 없습니다</b>제출되는 대로 여기에 표시됩니다.</div>' : '';
  h += `<div class="stats" style="margin-top:12px">

const DASH = { sort: 'unreviewed', filter: 'all', campus: '' };
function groupKey(r) {
  if (r.review_mode === 'none') return { key: 'none', name: tr('검토 없음 셀', 'Cells without review'), mode: 'none' };
  if (r.review_mode === 'senior_direct') return { key: 'senior', name: tr('스캇 브래너 담임 목사님 / 성희 브래너 사모님 직접 확인', 'Reviewed by Pastor Scott Brenner & Mrs. Sunghee Brenner'), mode: 'senior' };
  return { key: r.responsible_leadership_id || 'unassigned', name: r.responsible_leadership_name ? r.responsible_leadership_name : tr('담당 분파셀리더 없음', 'No Leadership assigned'), mode: 'leadership' };
}
function groupRows(rows) {
  const g = new Map();
  for (const r of rows) {
    const k = groupKey(r);
    if (!g.has(k.key)) g.set(k.key, { ...k, rows: [] });
    g.get(k.key).rows.push(r);
  }
  return [...g.values()].map(x => {
    const sub = x.rows.filter(r => r.status === 'submitted');
    const rev = sub.filter(r => r.review_status === 'reviewed');
    return { ...x, n: x.rows.length, sub: sub.length, rev: rev.length, unrev: x.mode === 'none' ? 0 : sub.length - rev.length,
      missing: x.rows.length - sub.length, concern: x.rows.filter(isConcern).length, urgent: x.rows.filter(r => r.escalation_level === 'urgent').length };
  });
}
async function signals(week) {
  const w1 = addDays(week, -7), w2 = addDays(week, -14);
  const [prev, prev2, cells] = await Promise.all([rpc('get_week_status', { p_week_start: w1 }), rpc('get_week_status', { p_week_start: w2 }),
    q(sb.from('cells').select('id, created_at'))]);
  const made = {}; cells.forEach(c => { made[c.id] = kstDate(c.created_at); });
  const out = [];
  for (const r of prev) {
    const r2 = prev2.find(x => x.cell_id === r.cell_id);
    const existed = !made[r.cell_id] || made[r.cell_id] <= addDays(w2, 6);
    if (existed && r.is_missing && r2 && r2.is_missing) out.push({ cell: r.cell_name, text: tr('2주 연속 보고서 미제출', 'No report for 2 weeks in a row'), id: null });
  }
  const now = Date.now();
  for (const set of [prev, prev2]) for (const r of set) {
    if (r.status === 'submitted' && r.review_status === 'pending' && r.submitted_at && now - new Date(r.submitted_at).getTime() > 7 * 864e5)
      out.push({ cell: r.cell_name, text: weekLabel(r.week_start || w1) + tr(' 보고서, 제출 후 7일 넘게 확인 대기', ' report — awaiting review for over 7 days'), id: r.report_id });
  }
  try {
    const weeks = [week, w1, w2];
    const rows = await q(sb.from('attendance').select('member_id, status, weekly_reports!inner(week_start, cell_id, status)').in('weekly_reports.week_start', weeks).eq('weekly_reports.status', 'submitted'));
    const by = new Map();
    for (const a of rows) { const k = a.member_id; if (!by.has(k)) by.set(k, { cell: a.weekly_reports.cell_id, weeks: new Set() }); if (a.status === 'absent') by.get(k).weeks.add(a.weekly_reports.week_start); }
    const hit = [...by.entries()].filter(([, x]) => weeks.every(w => x.weeks.has(w)));
    if (hit.length) {
      const mem = await q(sb.from('cell_members').select('id, name, cell_id').in('id', hit.map(([id]) => id)));
      const cur = await rpc('get_week_status', { p_week_start: week });
      for (const [id, x] of hit) {
        const mm = mem.find(m => m.id === id); const c = cur.find(r => r.cell_id === x.cell);
        out.push({ cell: c ? c.cell_name : '', text: (mm ? mm.name : tr('셀원', 'Member')) + tr(' 3주 연속 결석', ' — absent 3 weeks in a row'), id: c ? c.report_id : null });
      }
    }
  } catch (e) { console.warn('결석 신호 계산 생략', e); }
  return out;
}

      <div class="tiny muted" style="margin-top:2px">${r.source === 'report' ? esc(r.cell_name || '') + (r.resp_name ? ' · ' + esc(r.resp_name) : '') + ' · ' + tr('셀리더 ', 'by ') + esc(r.author_name || '') : tr('쓴 분: ', 'By ') + esc(r.author_name || '')}</div></div>`;

  // 관계 한눈에: 누가 누구와
  const rels = list.filter(r => r.relation_kind && relOther(r));
  if (rels.length && (!ISS.cat || ISS.cat === 'relationship')) {
    const pairs = new Map();
    for (const r of rels) {
      const a = r.person_name, b = relOther(r);
      const key = r.relation_kind === 'mutual' ? 'M:' + [a, b].sort().join('|') : 'O:' + a + '|' + b;
      if (!pairs.has(key)) pairs.set(key, { a, b, kind: r.relation_kind, n: 0, last: r.on_date, cell: r.cell_name });
      const x = pairs.get(key); x.n++; if (r.on_date > x.last) x.last = r.on_date;
    }
    h += `<h2>${tr('관계 한눈에', 'Relationships at a glance')} <span class="muted" style="font-weight:400">${pairs.size}</span></h2><div class="card" style="padding:6px 14px">` +
      [...pairs.values()].sort((x, y) => (y.last > x.last ? 1 : -1)).map(x => `<div class="row" style="padding:10px 0;border-bottom:1px solid var(--line);gap:8px;flex-wrap:wrap">
        <b>${esc(x.a)} ${x.kind === 'mutual' ? '↔' : '→'} ${esc(x.b)}</b><span class="tiny muted">${x.kind === 'mutual' ? tr('서로 어려워함', 'mutual') : tr(x.b + ' 때문에 어려워함', 'troubled by ' + x.b)}</span>
        <span class="spacer"></span><span class="tiny muted">${x.cell ? esc(x.cell) + ' · ' : ''}${tr(x.n + '번', x.n + '×')} · ${dayLabel(x.last)}</span></div>`).join('') + '</div>';
  }

  if (!list.length) { h += `<p class="empty" style="margin-top:16px">${tr('이 기간에 기록된 이슈가 없습니다.', 'No issues in this period.')}</p>`; app.innerHTML = h; return; }
  if (ISS.view === 'recent') {
    h += `<h2>${tr('최근 순', 'Latest')} <span class="muted" style="font-weight:400">${list.length}</span></h2><div class="stack" style="gap:0">` +
      list.map(r => `<div class="card" style="margin-top:8px"><b>${esc(r.person_name)}</b>${item(r, false)}</div>`).join('') + '</div>';
  } else {
    const groups = new Map();
    const add = (k, name, cell, r, asOther) => { if (!groups.has(k)) groups.set(k, { name, cell, items: [] }); groups.get(k).items.push({ r, asOther }); };
    for (const r of list) add(who(r), r.person_name, r.cell_name, r, false);
    // 관계 상대도 그 사람 묶음에 함께 보이게
    for (const r of rels) {
      const k = r.related_member_id ? 'm:' + r.related_member_id : 'n:' + relOther(r);
      const k2 = groups.has(k) ? k : [...groups.keys()].find(g => groups.get(g).name === relOther(r)) || k;
      add(k2, relOther(r), groups.get(k2)?.cell || (r.related_member_id ? r.cell_name : ''), r, true);
    }
    const arr = [...groups.entries()].map(([k, g]) => ({ k, ...g, last: g.items.reduce((m, x) => x.r.on_date > m ? x.r.on_date : m, '') }))
      .sort((a, b) => b.items.length - a.items.length || (b.last > a.last ? 1 : -1));
    h += `<h2>${tr('사람별', 'By person')} <span class="muted" style="font-weight:400">${arr.length}${tr('명', '')}</span></h2><div class="stack">` + arr.map(g => {
      const cats = [...new Set(g.items.map(x => x.r.category))];
      const open = ISS.open[g.k];
      return `<div class="card"><button class="row" data-act="iss-open" data-k="${esc(g.k)}" style="all:unset;display:flex;width:100%;gap:8px;align-items:center;flex-wrap:wrap;cursor:pointer">
          <b style="font-size:1.05em">${esc(g.name)}</b><span class="tiny muted">${esc(g.cell || '')}</span><span class="spacer"></span>
          ${cats.map(c => `<span class="pill">${noteCat(c)}</span>`).join('')}<span class="tiny muted">${tr(g.items.length + '건', g.items.length + '')} ${open ? '▲' : '▼'}</span></button>
        ${open ? g.items.sort((a, b) => (b.r.on_date > a.r.on_date ? 1 : -1)).map(x => item(x.r, x.asOther)).join('') : ''}</div>`;
    }).join('') + '</div>';
  }
  app.innerHTML = h;
}

const ADMIN = { open: 'requests', pick: {} };
async function loadAdminData() {
  const today = S.ctx.today;
  const cur = (x) => x.start_date <= today && (!x.end_date || x.end_date >= today);
  const [reqs, people, roles, cells, leaders, asg, members] = await Promise.all([
    q(sb.from('access_requests').select('id, name, email, matched_profile_id, status, created_at').eq('status', 'pending').order('created_at')),
    q(sb.from('profiles').select('id, name, email, auth_user_id, active').order('name')),
    q(sb.from('user_roles').select('user_id, role')),
    q(sb.from('cells').select('id, name, campus, review_mode, active').eq('active', true).order('name')),
    q(sb.from('cell_leaders').select('cell_id, user_id, start_date, end_date, is_primary')),
    q(sb.from('leadership_assignments').select('cell_id, leadership_user_id, start_date, end_date')),
    q(sb.from('cell_members').select('cell_id, name, member_type, active, joined_at, left_at').eq('active', true))
  ]);
  const P = new Map(people.map(p => [p.id, { ...p, roles: [], leads: [], oversees: [] }]));
  roles.forEach(r => P.get(r.user_id)?.roles.push(r.role));
  const C = new Map(cells.map(c => [c.id, { ...c, leaders: [], resp: null, members: [] }]));
  leaders.filter(cur).sort((a, b) => b.is_primary - a.is_primary).forEach(l => { const c = C.get(l.cell_id), p = P.get(l.user_id); if (c && p) { c.leaders.push(p); p.leads.push(c); } });
  asg.filter(cur).forEach(a => { const c = C.get(a.cell_id), p = P.get(a.leadership_user_id); if (c && p) { c.resp = p; p.oversees.push(c); } });
  members.filter(m => m.member_type === 'member' && (!m.left_at || m.left_at >= today) && (!m.joined_at || m.joined_at <= today))
    .forEach(m => C.get(m.cell_id)?.members.push(m.name));
  return { reqs, P, C };
}
const ROLE_KO = { leadership: 'Leadership', senior_pastor: '담임 목사님', samonim: '사모님', admin: '관리자' };
function personSummary(p) {
  const bits = [];

  if (p.oversees.length) bits.push('분파셀리더 · 담당 셀 ' + p.oversees.length + '개');
  const extra = p.roles.filter(r => r !== 'leadership').map(r => ROLE_KO[r]);
  if (extra.length) bits.push(extra.join(', '));
  return bits.join(' · ') || '맡은 셀·역할 없음';
}

  const sec = (id, title, count, body) => `
    <button class="listitem" data-act="ad-section" data-v="${id}" aria-expanded="${ADMIN.open === id}" style="margin-top:12px">
      <span class="top"><b>${title}</b><span class="pill ${id === 'requests' && count ? 'warn' : ''}">${count}</span></span></button>
    ${ADMIN.open === id ? '<div class="stack" style="margin-top:8px">' + body + '</div>' : ''}`;

  let h = `<h1>관리</h1>
    <div class="stats" style="margin-top:12px">
      <div class="stat ${reqs.length ? 'warn' : ''}"><div class="v">${reqs.length}</div><div class="k">승인 대기</div></div>
      <div class="stat"><div class="v">${done.length} / ${people.length}</div><div class="k">등록 완료</div></div>
      <div class="stat"><div class="v">${C.size}</div><div class="k">셀</div></div></div>`;

  // 1) 등록 신청
  const reqBody = reqs.length ? reqs.map(r => {
    const m = r.matched_profile_id && P.get(r.matched_profile_id);
    const ok = m && !isRegistered(m);
    const sel = ADMIN.pick[r.id] || (ok ? m.id : '');
    return `<div class="card stack">
      <div class="row"><b style="font-size:1.1em">${esc(r.name)}</b><span class="spacer"></span><span class="tiny muted">${new Date(r.created_at).toLocaleString('ko-KR', { month: 'numeric', day: 'numeric', hour: 'numeric', minute: '2-digit' })}</span></div>
      <div class="small">${esc(r.email)}</div>
      ${ok ? `<div class="banner small"><b>명단에서 찾았습니다: ${esc(m.name)}</b>${esc(personSummary(m))}</div>`
           : `<div class="banner warn small"><b>명단에서 같은 이름을 찾지 못했습니다</b>아래에서 이 분이 누구인지 골라 주세요. 모르는 분이면 거절해 주세요.</div>`}
      <label class="field small">이 신청을 연결할 사람
        <select data-adpick="${r.id}">
          <option value="">— 골라 주세요 —</option>
          ${unclaimed.map(p => `<option value="${p.id}" ${p.id === sel ? 'selected' : ''}>${esc(p.name)} · ${esc(personSummary(p))}</option>`).join('')}
        </select></label>
      <div class="row" style="gap:8px">
        <button class="btn sm" data-act="ad-approve" data-id="${r.id}" ${sel ? '' : 'disabled'}>승인</button>
        <button class="btn sm ghost" data-act="ad-reject" data-id="${r.id}">거절</button></div>
    </div>`;
  }).join('') : '<p class="empty">지금 승인을 기다리는 신청이 없습니다.</p>';
  h += sec('requests', '등록 신청', reqs.length, reqBody);

  // 2) 등록 현황
  const line = (p) => `<div class="member"><div class="row"><b>${esc(p.name)}</b><span class="spacer"></span>${isRegistered(p) ? `<span class="pill ok">${p.auth_user_id ? '로그인함' : '승인됨'}</span>` : '<span class="pill">아직</span>'}</div>
    <div class="tiny muted">${esc(personSummary(p))}${isRegistered(p) ? ' · ' + esc(p.email) : ''}</div></div>`;
  h += sec('people', '등록 현황', `${done.length} / ${people.length}`,
    `<div class="card">${waiting.length ? '<h3 style="margin-top:0">아직 등록하지 않은 분 ' + waiting.length + '명</h3>' + waiting.map(line).join('') : '<p style="margin:0">모든 분이 등록을 마치셨습니다.</p>'}</div>` +
    (done.length ? `<div class="card"><h3 style="margin-top:0">등록을 마친 분 ${done.length}명</h3>${done.map(line).join('')}</div>` : ''));

  // 3) 셀 명단 (담당별)
  const groups = new Map();
  for (const c of C.values()) {
    const key = c.review_mode === 'leadership' ? (c.resp ? c.resp.name : '담당 분파셀리더 없음') : c.review_mode === 'senior_direct' ? '스캇 브래너 담임 목사님 / 성희 브래너 사모님 직접 확인' : '검토 없음';
    if (!groups.has(key)) groups.set(key, []);
    groups.get(key).push(c);
  }
  const gsorted = [...groups.entries()].sort((a, b) => (a[0].startsWith('스캇') ? 1 : 0) - (b[0].startsWith('스캇') ? 1 : 0) || a[0].localeCompare(b[0], 'ko'));
  const cellBody = gsorted.map(([g, cs]) => `<div class="card"><h3 style="margin-top:0">${esc(g)} <span class="tiny muted">셀 ${cs.length}개 · 셀원 ${cs.reduce((n, c) => n + c.members.length, 0)}명</span></h3>
    ${cs.map(c => `<details class="cellbox"><summary><b>${esc(c.name)}</b> <span class="tiny muted">셀원 ${c.members.length}명</span></summary>
      <div class="small" style="margin:6px 0">셀리더: ${c.leaders.map(p => esc(p.name)).join(', ') || '배정 전'}</div>
      <div class="small muted">${c.members.map(esc).join(' · ') || '셀원 없음'}</div>
      <button class="btn sm ghost" style="margin-top:8px" data-act="open-members" data-cell="${c.id}" data-name="${esc(c.name)}">셀원 관리</button></details>`).join('')}</div>`).join('');
  h += sec('cells', '셀 명단', C.size + '개', cellBody);
  try {
    const ps = await rpc('admin_push_stats');
    h += `<div class="card stack" style="margin-top:12px"><div class="row"><b>보고서 알림</b><span class="spacer"></span><span class="pill">${ps.with_push} / ${ps.leaders}명</span></div>
      <p class="small muted" style="margin:0">이번 주 셀리더 ${ps.leaders}명 중 ${ps.registered}명이 로그인했고, ${ps.with_push}명이 알림을 켰습니다.</p></div>`;
  } catch (_) { /* 알림 기능 설치 전 */ }

  h += `<div class="card stack" style="margin-top:20px">
    <p class="small muted" style="margin:0">셀원 이동, 셀리더·담당 변경은 아직 Supabase 대시보드에서 합니다. 대시보드에서 고친 내용은 변경 기록에 “누가”가 남지 않으니, 정정 기록표에 날짜·작업자·사유를 함께 적어 주세요.</p>
    <p class="small muted" style="margin:0">관리자 역할만으로는 보고서와 목양 기록을 볼 수 없습니다.</p></div><div id="pushbox"></div>`;
  app.innerHTML = h;
  renderPushBox();
}
document.addEventListener('change', (e) => {
  const el = e.target.closest('[data-adpick]'); if (!el) return;
  ADMIN.pick[el.dataset.adpick] = el.value;
  const btn = document.querySelector(`[data-act=ad-approve][data-id="${el.dataset.adpick}"]`); if (btn) btn.disabled = !el.value;
});
async function adminDecide(id, approve) {
  try {
    if (approve) {
      const pid = document.querySelector(`[data-adpick="${id}"]`)?.value;
      if (!pid) return toast('연결할 사람을 골라 주세요.');
      await rpc('admin_approve_request', { p_request: id, p_profile: pid });
      toast('승인했습니다. 이제 그 이메일로 로그인하실 수 있습니다.');
    } else {
      await rpc('admin_reject_request', { p_request: id });
      toast('거절했습니다.');
    }
    delete ADMIN.pick[id];
  } catch (e) { toast(errText(e), 4500); }
  render();
}

/* =====================================================================
   클릭 처리
