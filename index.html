document.addEventListener('click', async (e) => {
  const el = e.target.closest('[data-act]'); if (!el || el.disabled) return;
  const a = el.dataset.act; const d = el.dataset;
  switch (a) {
    case 'noop': return;
    case 'back': if (E) { await save(); E = null; hideFooter(); } return back();
    case 'reload': return render();
    case 'tab': if (E) { await save(); E = null; hideFooter(); } return switchTab(d.id);
    case 'logout': PUSH.synced = false; if (E) { await save(); E = null; hideFooter(); } await sb.auth.signOut(); Object.assign(LOGIN, { sent: false, msg: '', busy: false }); S.ctx = null; S.tab = null; return viewLogin();
    case 'send-login': return sendLogin();
    case 'verify-code': return verifyCode();
    case 'login-reset': Object.assign(LOGIN, { sent: false, msg: '' }); return viewLogin();
    case 'lang': return setLang(EN() ? 'ko' : 'en');
    case 'reg-open': Object.assign(LOGIN, { mode: 'register', msg: '', regDone: false }); return viewLogin();
    case 'reg-close': Object.assign(LOGIN, { mode: 'login', msg: '', regDone: false }); return viewLogin();
    case 'reg-send': return sendRegister();
    case 'push-on': return pushOn();
    case 'tx-report': return translateReport(d.id);
    case 'lr-edit-open': LR.week = null; return go({ name: 'lrEdit', week: d.week });
    case 'lr-open': return go({ name: 'lrRead', id: d.id });
    case 'open-issues': return go({ name: 'issues' });
    case 'iss-scope': ISS.scope = d.v; return render();
    case 'iss-weeks': ISS.weeks = +d.v; return render();
    case 'iss-cat': ISS.cat = d.v; return render();
    case 'iss-view': ISS.view = d.v; return render();
    case 'iss-open': ISS.open[d.k] = !ISS.open[d.k]; return render();
    case 'lr-notes': NOTE.filter = 'week'; NOTE.week = d.week; return switchTab('notes');
    case 'lr-cat': LR.cat = d.v; document.querySelectorAll('[data-act=lr-cat]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.v === d.v))); return;
    case 'lr-add': return lrAdd();
    case 'lr-item-edit': return lrItemEdit(+d.i);
    case 'lr-item-del': LR.items.splice(+d.i, 1); return lrAutosave();
    case 'lr-save': return lrSave(false);
    case 'lr-submit': return lrSave(true);
    case 'lr-ind-add': return lrIndAdd();
    case 'lr-ind-del': return lrIndDel(d.id);
    case 'lr-tx': return lrTranslate(d.id);
    case 'note-new': NOTE.form = { id: null, met_on: S.ctx.today, person_name: '', category: 'update', visit_method: 'in_person', campus: '분당', content: '', prayer: '', needs_pastor: false, visibility: 'all', viewers: [] }; return go({ name: 'noteEdit' });
    case 'note-edit': { const n = NOTE.list.find(x => x.id === d.id); if (!n) return; NOTE.form = { id: n.id, met_on: n.met_on, person_name: n.person_name, category: n.category, content: n.content, prayer: n.prayer || '', needs_pastor: n.needs_pastor, visibility: n.visibility || 'all', viewers: n.viewer_ids || [], visit_method: n.visit_method || 'in_person', campus: n.campus || '분당' }; return go({ name: 'noteEdit' }); }
    case 'note-filter': NOTE.filter = d.v; return render();
    case 'note-week': { const w = addDays(NOTE.week || S.ctx.this_week, +d.v); NOTE.week = w > S.ctx.this_week ? S.ctx.this_week : w; return render(); }
    case 'note-campus': NOTE.campus = d.v || ''; return render();
    case 'note-tx': return noteTranslate();
    case 'note-ack': try { await rpc('pastoral_note_ack', { p_id: d.id }); toast(tr('확인 표시를 했습니다.', 'Marked as seen.')); } catch (e) { toast(errText(e)); } return render();
    case 'nt-cat': noteFormSync(); NOTE.form.category = d.v; return render();
    case 'nt-vis': noteFormSync(); NOTE.form.visibility = d.v; return render();
    case 'nt-method': noteFormSync(); NOTE.form.visit_method = d.v; return render();
    case 'nt-campus': noteFormSync(); NOTE.form.campus = d.v; return render();
    case 'nt-save': return noteSave();
    case 'nt-del-ask': noteFormSync(); NOTE.form.confirmDel = true; return render();
    case 'nt-del-cancel': NOTE.form.confirmDel = false; return render();
    case 'nt-del': try { await rpc('pastoral_note_delete', { p_id: NOTE.form.id }); NOTE.form = null; toast(tr('지웠습니다.', 'Deleted.')); return back(); } catch (e) { return toast(errText(e)); }
    case 'open-members': Object.assign(MEM, { edit: null, confirm: null }); return go({ name: 'members', cell: d.cell, cellName: d.name });
    case 'mem-add': { const nm = ($('#mem-new')?.value || '').trim(); if (!nm) return toast('이름을 적어 주세요.'); return memAct('member_add', { p_cell: S.view.cell, p_name: nm }, nm + '님을 셀원으로 추가했습니다.'); }
    case 'mem-confirm': MEM.confirm = d.id; MEM.del = null; return render();
    case 'mem-del-ask': MEM.del = d.id; MEM.confirm = null; return render();
    case 'mem-del': return memAct('member_delete', { p_member: d.id }, '셀원 명단에서 삭제했습니다.');
    case 'mem-cancel': MEM.confirm = null; MEM.del = null; return render();
    case 'mem-leave': return memAct('member_leave', { p_member: d.id }, '출석 명단에서 내렸습니다.');
    case 'mem-restore': return memAct('member_restore', { p_member: d.id }, '다시 올렸습니다.');
    case 'mem-register': return memAct('register_member', { p_member: d.id }, '정식 셀원으로 등록했습니다.');
    case 'push-off': return pushOff();
    case 'push-test': return pushTest();
    case 'ad-approve': return adminDecide(d.id, true);
    case 'ad-reject': return adminDecide(d.id, false);
    case 'ad-section': ADMIN.open = ADMIN.open === d.v ? '' : d.v; return render();
    case 'start-report': return startReport(d.cell, d.week);
    case 'open-report': return go({ name: 'report', id: d.id });
    case 'open-editor': return go({ name: 'report', id: d.id }, { replace: true });
    case 'open-detail': return go({ name: 'detail', id: d.id });
    case 'open-group': return go({ name: 'group', key: d.key, week: d.week });
    case 'lh-week': return go({ name: 'leadershipHome', week: d.week }, { replace: true });
    case 'db-week': return go({ name: 'dashboard', week: d.week }, { replace: true });
    case 'db-filter': DASH.filter = d.v; return render();
    case 'db-campus': DASH.campus = d.v || ''; return render();
    case 'rv-level': DETAIL.level = d.v; document.querySelectorAll('[data-act=rv-level]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.v === d.v))); return;
    case 'rv-ok': return reviewOk();
    case 'rv-revopen': DETAIL.revOpen = true; return render();
    case 'rep-reopen-ask': DETAIL.reopen = d.id; return render();
    case 'rep-reopen-cancel': DETAIL.reopen = null; return render();
    case 'rep-reopen': return reopenReport(d.id);
    case 'rv-revclose': DETAIL.revOpen = false; return render();
    case 'rv-send': return reviewRevise();
  }
  if (!E) return;
  const m = E.m;
  switch (a) {
    case 'ed-set': {
      const v = d.v === 'true' ? true : d.v === 'false' ? false : d.v; m[d.k] = v;
      if (d.k === 'meeting_held' && v === true && !m.meeting_date) { const t = S.ctx.today; m.meeting_date = weekOK(t) ? t : ''; }
      return markDirty(true);
    }
    case 'ed-att': { const cur = m.att[d.id] || {}; m.att[d.id] = { status: d.v, absence_reason: d.v === 'absent' ? (cur.absence_reason || '') : '' }; return markDirty(true); }
    case 'ed-allpresent': E.roster.filter(x => x.listed).forEach(x => { m.att[x.member_id] = { status: 'present', absence_reason: '' }; }); return markDirty(true);
    case 'ed-pu': { const cur = m.pu[d.id] || {}; m.pu[d.id] = { status: cur.status === d.v ? null : d.v, note: cur.note || '' }; if (!m.pu[d.id].status) delete m.pu[d.id]; return markDirty(true); }
    case 'ed-care': m.hasCare = d.v === 'true'; if (m.hasCare && !m.notes.length) m.notes.push({ member_id: '', category: '', content: '', attention: false }); return markDirty(true);
    case 'ed-addnote': m.notes.push({ member_id: '', category: '', content: '', attention: false }); return markDirty(true);
    case 'ed-delnote': m.notes.splice(+d.i, 1); if (!m.notes.length) m.hasCare = false; return markDirty(true);
    case 'ed-cat': m.notes[+d.i].category = d.v; return markDirty(true);
    case 'ed-relkind': m.notes[+d.i].relation_kind = d.v; return markDirty(true);
    case 'ed-addopen': E.showAdd = true; renderEditor(); setTimeout(() => $('#new-name')?.focus(), 0); return;
    case 'ed-addcancel': E.showAdd = false; E.newName = ''; return renderEditor();
    case 'ed-addnew': {
      const nm = (E.newName || '').trim(); if (!nm) { toast('이름을 적어 주세요.'); return; }
      try {
        await save();
        const id = await rpc('add_attendee', { p_report: E.id, p_name: nm, p_register: !!E.newReg });
        const had = E.roster.find(x => x.member_id === id);
        if (had) { if (E.newReg) had.listed = true; } else E.roster.push({ member_id: id, name: nm, type_in_week: E.newReg ? 'member' : 'visitor', member_type_now: E.newReg ? 'member' : 'visitor', attendance: 'present', listed: !!E.newReg });
        m.att[id] = { status: 'present', absence_reason: '' };
        E.showAdd = false; E.newName = ''; E.newReg = false;
        toast(had ? nm + '님은 이미 명단에 있어서 그대로 출석으로 표시했습니다.' : nm + '님을 ' + (E.roster[E.roster.length - 1].listed ? '정식 셀원으로 등록했습니다.' : '이번 주 방문자로 추가했습니다.'));
        return markDirty(true);
      } catch (err) { toast(errText(err), 5000); return; }
    }
    case 'ed-revisit': {
      const vv = E.visitors.find(x => x.member_id === d.id); if (!vv) return;
      E.roster.push({ member_id: vv.member_id, name: vv.name, type_in_week: 'visitor', member_type_now: 'visitor', attendance: 'present', listed: false });
      m.att[vv.member_id] = { status: 'present', absence_reason: '' }; return markDirty(true);
    }
    case 'ed-prev': if (E.step > 0) { E.step--; E.confirm = false; save(); renderEditor(); window.scrollTo(0, 0); } return;
    case 'ed-next': if (E.step < STEPS.length - 1) { E.step++; save(); renderEditor(); window.scrollTo(0, 0); } return;
    case 'ed-step': E.step = +d.v; E.confirm = false; renderEditor(); window.scrollTo(0, 0); return;
    case 'ed-confirm': { const bad = validateForSubmit(); if (bad) { E.step = bad[0]; renderEditor(); toast(bad[1], 4000); return; } E.confirm = true; renderEditor(); setTimeout(() => window.scrollTo(0, document.body.scrollHeight), 0); return; }
    case 'ed-confirm-cancel': E.confirm = false; return renderEditor();
    case 'ed-submit': return submitReport();
    case 'ed-move-cancel': E.m.meeting_date = ''; return markDirty(true);
    case 'ed-move': {
      if (E.moving) return; E.moving = true; renderEditor();
      const nw = mondayOf(E.m.meeting_date);
      try {
        await save();
        await rpc('move_report_week', { p_report: E.id, p_week: nw, p_version: E.version });
        const step = E.step; E = await loadEditor(E.id); E.step = step;
        toast(weekLabel(nw) + ' 보고서로 옮겼습니다.'); renderEditor(); window.scrollTo(0, 0);
      } catch (e) { E.moving = false; toast(errText(e), 5000); renderEditor(); }
      return;
    }
    case 'ed-reload': { const step = E.step; E = await loadEditor(E.id); E.step = step; return renderEditor(); }
  }
});
document.addEventListener('change', (e) => { if (e.target.id === 'db-sort') { DASH.sort = e.target.value; render(); } });
window.addEventListener('beforeunload', (e) => { if (E && (E.dirty || E.saving)) { save(); e.preventDefault(); e.returnValue = ''; } });
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden' && E && E.dirty) save(); });

/* =====================================================================
   시작
   ===================================================================== */
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
let started = false;
sb.auth.onAuthStateChange((event, session) => {
  if (event === 'SIGNED_OUT') { if (started) { S.ctx = null; viewLogin(); } return; }
  if ((event === 'SIGNED_IN' || event === 'INITIAL_SESSION') && session && !S.ctx) {
    started = true;
    if (location.hash && /access_token|error/.test(location.hash)) history.replaceState(null, '', location.pathname);
    setTimeout(() => loadContext().catch(err => { $('#app').innerHTML = '<div class="banner danger"><b>불러오지 못했습니다.</b>' + esc(errText(err)) + '</div>'; }), 0);
  } else if (event === 'INITIAL_SESSION' && !session) {
    started = true;
    const hashErr = /error_description=([^&]+)/.exec(location.hash);
    if (hashErr) { LOGIN.msg = /expired|invalid/i.test(decodeURIComponent(hashErr[1])) ? '로그인 링크가 만료되었거나 이미 사용되었습니다. 메일을 다시 받아 주세요.' : decodeURIComponent(hashErr[1]).replace(/\+/g, ' '); history.replaceState(null, '', location.pathname); }
    viewLogin();
  }
});
